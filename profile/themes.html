<style id="pagesize"></style>

  body{ background:#c9cfd5; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html.print body{ background:#fff; }
  #doc{ margin:0 auto; }
  html:not(.print) #doc{ padding:24px 0 60px; display:flex; flex-direction:column; gap:24px; align-items:center; }
  h1,h2,h3,p{ margin:0; }
  .page{ position:relative; overflow:hidden; page-break-after:always; break-after:page; }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  html:not(.print) .page{ box-shadow:0 12px 40px rgba(20,30,45,.25); }
  .abs{ position:absolute; }
  .ic{ display:inline-block; flex:0 0 auto; } .ic svg{ width:100%; height:100%; }
  img.whole{ display:block; height:auto; }
  .ph{ display:grid; place-items:center; }
  .ui{ position:sticky; top:0; z-index:20; padding:10px 18px; background:#1d3a57; color:#fff; font:14px 'Source Sans 3',sans-serif; display:flex; gap:10px; align-items:center; }

</style>
