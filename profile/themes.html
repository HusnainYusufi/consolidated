<html lang="en">
<head>

<style>
  /* Theme sampler for the company profile: six design directions, three sample pages each, placeholder
     copy only. Logo colours throughout; every photo is shown whole (never cropped). */
  :root{
    --navy:#1d3a57; --navy2:#16304a; --steel:#2f6390; --sky:#8fb0cc; --silver:#9aa3ac; --ink:#262b30; --ink2:#5b636b;
    --line:#dde2e7; --mist:#f2f5f8; --paper:#fdfdfe;
  }
  @page{ size:210mm 297mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:'Source Sans 3',sans-serif; color:var(--ink2); background:#c9cfd5; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html.print body{ background:#fff; }
  #doc{ width:210mm; margin:0 auto; }
  html:not(.print) #doc{ padding:24px 0 60px; display:flex; flex-direction:column; gap:24px; }
  h1,h2,h3,p{ margin:0; }
  .page{ position:relative; width:210mm; height:297mm; overflow:hidden; background:var(--paper); page-break-after:always; break-after:page; }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  html:not(.print) .page{ box-shadow:0 12px 40px rgba(20,30,45,.25); }
  .abs{ position:absolute; }
  .tagline{ position:absolute; bottom:3.6mm; left:0; right:0; text-align:center; font:600 6.4pt 'Source Sans 3',sans-serif; letter-spacing:.2em; text-transform:uppercase; color:#b0b7be; z-index:9; }
  .ic svg{ width:100%; height:100%; }
  img.whole{ display:block; height:auto; }
  .ui{ position:sticky; top:0; z-index:20; padding:10px 18px; background:var(--navy); color:#fff; font:14px 'Source Sans 3',sans-serif; display:flex; gap:12px; align-items:center; }
  .ui span{ flex:1; } .ui a{ color:#fff; border:1px solid rgba(255,255,255,.4); padding:6px 12px; text-decoration:none; }
  html.print .ui{ display:none; }
</style>
</head>
