<style>
  /* ============ Consolidated company profile · Brand Blades, angular edition ============
     Sharp angles only: faceted shards cut from a 60-degree triangle lattice (the six-fold geometry of the
     logo), chamfered panels and icon tiles, straight-edged charts. Big icons carry the content; the only
     photograph is the building on the cover, shown whole. Colours come from the logo.
     All copy comes from the website (assets/js/i18n.js); ?lang=ar for Arabic. */
  :root{

    --dark:linear-gradient(150deg,#0e1218,#1a2531 55%,#16304a);
    --navyfill:linear-gradient(150deg,#24476b,#13253a);
    --font:'Outfit','Segoe UI',sans-serif;
  }
  html[lang="ar"]{ --font:'IBM Plex Sans Arabic','Segoe UI',sans-serif; }
  @page{ size:210mm 297mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:var(--font); color:var(--ink2); background:#c9cfd6; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html.print body{ background:var(--paper); }
  #doc{ width:210mm; margin:0 auto; }
  html:not(.print) #doc{ padding:24px 0 60px; display:flex; flex-direction:column; gap:24px; }
  h1,h2,h3,p{ margin:0; }
  .ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }

  .page{ position:relative; isolation:isolate; width:210mm; height:297mm; overflow:hidden; background:var(--paper); page-break-after:always; break-after:page; }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  .page.dark{ background:var(--dark); color:#c3cbd3; }
  html:not(.print) .page{ box-shadow:0 12px 40px rgba(14,18,24,.3); }
  .abs{ position:absolute; z-index:1; }
  .bg{ position:absolute; z-index:0; pointer-events:none; }
  html[dir="rtl"] .bg.mir{ transform:scaleX(-1); }
  .navy{ background:var(--navyfill); color:#fff; }

  /* running header and footer */

  .hd .sec{ display:flex; align-items:center; gap:2.6mm; font-size:7.4pt; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--steel); }
  .hd .sec b{ color:var(--navy); font-size:9pt; letter-spacing:0; }
  html[lang="ar"] .hd .sec{ letter-spacing:0; font-size:8.4pt; }
  .hd img{ height:6mm; }
  .ft{ position:absolute; z-index:3; bottom:9mm; inset-inline:18mm; display:flex; align-items:center; gap:4mm; font-size:7pt; color:var(--silver); }
  .ft .r{ flex:1; height:1px; background:var(--line); }
  .ft b{ color:var(--navy); font-size:9pt; }
  html[lang="ar"] .ft{ font-size:7.8pt; }
  .dark .hd .sec, .dark .hd .sec b{ color:#fff; } .dark .hd img{ filter:brightness(0) invert(1); }
  .dark .ft, .lf .ft{ color:#c7d3de; } .dark .ft b, .lf .ft b{ color:#fff; } .dark .ft .r, .lf .ft .r{ background:rgba(255,255,255,.25); }

  .kick::before{ content:""; width:4mm; height:4mm; background:currentColor; clip-path:polygon(100% 0,100% 100%,0 100%); }
  html[dir="rtl"] .kick::before{ clip-path:polygon(0 0,100% 100%,0 100%); }
  html[lang="ar"] .kick{ letter-spacing:0; font-size:9pt; }
  .h2{ font-weight:700; color:var(--navy); font-size:27pt; line-height:1.08; margin-top:3mm; letter-spacing:-.01em; }
  .h2 span{ font-weight:300; color:var(--steel); }
  html[lang="ar"] .h2{ font-size:21pt; line-height:1.45; letter-spacing:0; }
  .t2{ font-weight:700; color:var(--navy); font-size:11pt; line-height:1.3; }
  html[lang="ar"] .t2{ font-size:11.4pt; line-height:1.55; }
  .tag{ color:var(--steel); font-weight:600; font-size:9.2pt; line-height:1.35; }
  .tx{ font-size:9.1pt; line-height:1.56; color:var(--ink2); text-align:justify; }
  html[lang="ar"] .tx{ font-size:9.4pt; line-height:1.8; }
  .sm{ font-size:8pt; line-height:1.5; }
  html[lang="ar"] .sm{ font-size:8.6pt; line-height:1.7; }
  .cap{ font-size:7pt; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--steel); }
  html[lang="ar"] .cap{ letter-spacing:0; font-size:8.4pt; }
  .num{ font-weight:300; line-height:.95; letter-spacing:-.02em; }
  .num small{ font-size:.5em; font-weight:400; }
  .navy .t2, .navy .h2, .dark .t2, .dark .h2{ color:#fff; } .navy .tx, .navy .sm, .dark .tx, .dark .sm{ color:#c9d6e2; }
  .navy .cap, .navy .tag, .dark .cap, .dark .tag{ color:var(--soft); } .navy .kick, .dark .kick{ color:var(--soft); } .dark .h2 span{ color:var(--soft); }

  .tile{ display:inline-grid; place-items:center; flex:0 0 auto; color:#fff; background:var(--steel); clip-path:polygon(24% 0,100% 0,100% 100%,0 100%,0 24%); }

  .tile.nv{ background:var(--navy); } .tile.wt{ color:var(--navy); background:#fff; } .tile.gl{ color:#fff; background:rgba(255,255,255,.13); }

  .rail b{ font-size:6pt; font-weight:700; color:var(--navy); margin-bottom:1.4mm; }
  .rail span{ display:block; width:.8mm; height:11mm; background:#d5dce3; }
  .rail span.on{ width:1.8mm; background:var(--steel); }
  .dark .rail b{ color:#fff; } .dark .rail span{ background:rgba(255,255,255,.2); } .dark .rail span.on{ background:#fff; }
  ul.li{ list-style:none; margin:0; padding:0; display:grid; gap:1.5mm 6mm; }
  ul.li li{ display:flex; gap:2.2mm; font-size:7.9pt; line-height:1.38; color:var(--ink); }
  html[lang="ar"] ul.li li{ font-size:8.5pt; line-height:1.55; }
  ul.li li::before{ content:""; flex:0 0 auto; width:2mm; height:2mm; margin-top:1.1mm; background:var(--steel); clip-path:polygon(100% 0,100% 100%,0 100%); }
  .chip{ display:inline-block; border:1px solid var(--steel); color:var(--navy); font-weight:600; font-size:7.6pt; padding:.6mm 2.4mm; letter-spacing:.05em; direction:ltr; }
  .navy .chip, .dark .chip{ border-color:rgba(255,255,255,.45); color:#fff; }

  .ui{ position:sticky; top:0; z-index:9; display:flex; gap:12px; align-items:center; padding:10px 18px; background:var(--navy); color:#fff; font:14px var(--font); }
  .ui img{ height:24px; filter:brightness(0) invert(1); } .ui .t{ flex:1; opacity:.85; }
  .ui a{ color:#fff; border:1px solid rgba(255,255,255,.4); padding:6px 12px; text-decoration:none; }
  html.print .ui{ display:none; }

  // ---- faceted shards: triangles of a 60-degree lattice, filled inside a region (all edges straight) ----

  const facets = ({ core, fringe, s = 13, pal = 'navy', seed = 1, W = 210, H = 297, edge = .14, dens = .94, fr = .3 }) => { _s = seed; const h = s * Math.sqrt(3) / 2, [c0, c1] = GR[pal]; let o = '';

  const st = D.stats, S = D.services.items;
  const totalSpec = S.reduce((a, s) => a + s.list.length, 0), maxL = Math.max(...S.map((s) => s.list.length));

  // unit strip: one cell per specialised service (117 in all); the cells of practice k are lit
  const offs = S.map((_, k) => S.slice(0, k).reduce((a, s) => a + s.list.length, 0));

  // squarified treemap (all straight edges): rectangles sized by value

      <div><p class="cap" style="color:var(--ink2)">${esc(T.teamBy)}</p><div style="display:flex;gap:1mm;margin-top:2mm">${tg.slice().sort().map((g) => `<div style="flex:1;height:6mm;background:${gcol[g]};clip-path:${cut(2)}"></div>`).join('')}</div>
        <div style="display:flex;gap:1mm;margin-top:1.6mm">${[0, 1, 2, 3].map((g) => { const n = tg.filter((x) => x === g).length; return `<div style="flex:${n}"><p style="font-size:6.4pt;line-height:1.25;color:var(--ink2)">${esc(T.groups[g])}<br><b style="color:${gcol[g]};font-size:8pt">${n}</b></p></div>`; }).join('')}</div></div></div>`)}
    ${A(18, 80, 174, `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8mm">${D.team.people.map((p, k) => `
      <div style="display:flex;gap:4.6mm;padding:4.4mm 0;border-top:${k < 2 ? '2px solid var(--navy)' : '1px solid var(--line)'};height:48.5mm">
        ${tile(roleIcon(EN.team.people[k].role), 15, '', `background:${gcol[tg[k]]}`)}
        <div><p class="t2" style="font-size:10pt">${esc(p.name)}</p><p class="cap" style="margin:1mm 0 1.6mm;font-size:6.4pt">${esc(p.role)}</p><p class="sm" style="font-size:7.5pt;line-height:1.48;text-align:justify">${esc(p.line)}</p></div></div>`).join('')}</div>`)}`);

  // ============ 13 · CLIENTS & COMMITMENTS ============
  const logos = EN.clients.logoFiles || [];
  page(8, `
    ${corner(59)}
    ${A(18, 26, 174, `<div style="display:flex;justify-content:space-between;align-items:flex-end"><div><p class="kick">09 · ${esc(T.lb[8])}</p><h2 class="h2">${esc(T.clientsT)}</h2></div><p class="num" style="font-size:36pt;color:var(--steel)">${st[2].n}<small>${esc(st[2].suffix)}</small></p></div>`)}
    ${A(18, 52, 174, `<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:2mm 3mm;border-top:2px solid var(--navy);padding-top:4.4mm">${logos.map((f) => `<div style="height:15mm;position:relative"><img src="/assets/img/clients/${f}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></div>`).join('')}</div>`)}
    ${band(134, 163, `<p class="kick">${esc(T.expectT)}</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7mm 7mm;margin-top:7mm">${D.expect.cards.map((c, k) => `
        <div style="display:flex;gap:3.4mm;align-items:flex-start">${tile(expIcons[k], 11, 'wt')}<p class="sm" style="color:#fff;font-size:8.3pt;line-height:1.5">${esc(c.text)}</p></div>`).join('')}</div>`, 61)}`, { lightFoot: true });

  // ============ 14 · CORPORATE PROFILE: square-dot map, straight routes from Amman, fact table ============
  const Mp = MENA_MAP, mw = 174, mh = mw * Mp.h / Mp.w, kk = mw / Mp.w;
  const mxm = (x) => AR ? Mp.w - x : x;
  const hubs = [[46.7, 24.7], [55.3, 25.2], [31.2, 30.0], [44.4, 33.3], [48.0, 29.4], [51.5, 25.3], [58.4, 23.6], [35.5, 33.9], [39.2, 21.5], [10.2, 36.8], [3.0, 36.7], [-6.8, 34.0], [13.2, 32.9]].map(([lo, la]) => [lo + 18, 44 - la]);
  const [amx, amy] = Mp.amman;
  const routes = hubs.map(([x, y]) => `<line x1="${mxm(amx)}" y1="${amy}" x2="${mxm(x)}" y2="${y}" stroke="#2f6390" stroke-width=".16" stroke-dasharray=".7 .5"/><rect x="${mxm(x) - .5}" y="${y - .5}" width="1" height="1" fill="#2f6390" transform="rotate(45 ${mxm(x)} ${y})"/>`).join('');
  const dotSvg = `<svg viewBox="0 0 ${Mp.w} ${Mp.h}" style="width:${mw}mm;height:${mh}mm;display:block">${Mp.dots.map(([x, y, t]) => { const fill = t === 'J' || t === 'j' ? '#1d3a57' : t === 'm' ? '#a7b3bf' : '#dde2e7'; const r = t === 'J' ? .13 : .27; return `<rect x="${(mxm(x) - r).toFixed(2)}" y="${(y - r).toFixed(2)}" width="${2 * r}" height="${2 * r}" fill="${fill}"/>`; }).join('')}${routes}
    <rect x="${mxm(amx) - 1.2}" y="${amy - 1.2}" width="2.4" height="2.4" fill="#fff" stroke="#1d3a57" stroke-width=".3" transform="rotate(45 ${mxm(amx)} ${amy})"/><rect x="${mxm(amx) - .5}" y="${amy - .5}" width="1" height="1" fill="#1d3a57" transform="rotate(45 ${mxm(amx)} ${amy})"/></svg>`;
  const facts = [T.firm, T.founded, link('pin'), S.map((s) => s.title).join(' · '), D.hero.certs.slice(0, 5).map((c) => c[0]).join(' · '), D.hero.certs.slice(5).map((c) => c[0]).join(' · '), `${st[2].n}${st[2].suffix} · ${st[2].caption}`, link('phone'), link('mail'), link('globe')];
  page(9, `
    ${corner(67)}
    ${A(18, 26, 174, `${head(10, T.mapT[0], T.mapT[1])}<p class="tx" style="margin-top:3mm">${esc(T.mapS)}</p>`)}
    <div class="abs" style="top:76mm;left:18mm;width:${mw}mm">${dotSvg}
      <div style="position:absolute;left:${mxm(amx) * kk + (AR ? -19 : 3)}mm;top:${amy * kk + 2.4}mm;font-weight:700;color:var(--navy);font-size:9.5pt;background:var(--paper);padding:0 1.2mm">${esc(T.amman)}</div></div>
    ${A(18, 76 + mh + 6, 174, `<div style="border-top:2px solid var(--navy)">${T.rows.map((r, i) => `
      <div style="display:grid;grid-template-columns:44mm 1fr;gap:6mm;padding:2.6mm 0;border-bottom:1px solid var(--line)"><span class="cap" style="color:var(--ink2)">${esc(r)}</span><span class="sm" style="color:var(--ink)">${i >= 7 ? `<span class="ltr">${esc(facts[i])}</span>` : esc(facts[i])}</span></div>`).join('')}</div>`)}`);

  // ============ 15 · BACK COVER (dark) ============
  page(0, `
    ${svgBg(facets({ core: [[-5, 150], [120, 302], [-5, 302]], fringe: [[-5, 120], [150, 302], [-5, 302]], s: 13, seed: 71 }))}
    ${svgBg(facets({ core: [[150, -5], [215, -5], [215, 70]], fringe: [[128, -5], [215, -5], [215, 96]], s: 10, pal: 'silver', seed: 73, edge: .2 }), 210, 297, 'opacity:.4')}
    ${A(18, 36, 120, `<img src="/assets/img/icon.png" style="height:22mm;filter:brightness(0) invert(1)"><img src="/profile/img/wordmark-white.png" style="height:8.4mm;display:block;margin-top:6mm">`)}
    ${A(18, 104, 150, `<h2 class="h2" style="color:#fff;font-size:${AR ? 22 : 28}pt">${esc(D.consult.title1)}<br><span style="color:var(--soft)">${esc(D.consult.title2)}</span></h2><p class="tx" style="margin-top:4mm;color:#c9d6e2">${esc(D.consult.sub)}</p>`)}
    ${A(18, 168, 174, `<div style="display:grid;grid-template-columns:1fr 38mm;gap:10mm;align-items:end;border-top:1px solid rgba(255,255,255,.25);padding-top:7mm">
      <div style="display:flex;flex-direction:column;gap:3.4mm">${[['map-pin', link('pin'), false], ['phone', link('phone'), true], ['mail', link('mail'), true], ['globe', link('globe'), true]].map(([i, v, l]) => `
        <div style="display:flex;gap:3.4mm;align-items:center;color:#fff;font-size:10pt">${tile(i, 9, 'gl')}${l ? `<span class="ltr">${esc(v)}</span>` : esc(v)}</div>`).join('')}</div>
      <div style="background:#fff;padding:2.6mm"><img src="/profile/qr-website.svg" style="width:100%;display:block"></div></div>
      <div style="display:flex;gap:6mm;margin-top:8mm">${T.motto.map((m) => `<span style="color:var(--soft);font-weight:600;letter-spacing:${AR ? 0 : '.14em'};text-transform:uppercase;font-size:8pt">${esc(m)}</span>`).join('')}</div>`)}`, { bare: true, dark: true });

  // ---------- render ----------
  document.getElementById('doc').innerHTML = pages.map((p, i) => `<section class="page${p.opt.dark ? ' dark' : ''}${p.opt.lightFoot ? ' lf' : ''}" id="pg${i + 1}">${p.inner}
      ${p.opt.bare ? '' : `<div class="hd"><span class="sec">${p.opt.sub ? `<b>${esc(T.lb[p.sec])}</b>${p.opt.sub}` : ''}</span><img src="/assets/img/icon.png" alt=""></div>
        <div class="rail"><b>${pad(p.sec + 1)}</b>${T.lb.map((_, k) => `<span class="${k === p.sec ? 'on' : ''}"></span>`).join('')}</div>
        <div class="ft"><b>${pad(i + 1)}</b><span class="r"></span><span>${esc(T.firm)}</span><span class="ltr">${T.site}</span></div>`}</section>`).join('');
  lucide.createIcons({ attrs: { 'stroke-width': 1.7 } });

  if (!PRINT) document.getElementById('ui').innerHTML = `<img src="/assets/img/icon.png" alt=""><span class="t">${esc(T.firm)} · ${esc(T.profile)} ${T.year}</span>
    <a href="${T.otherHref}">${esc(T.other)}</a><a href="/profile/Consolidated-Company-Profile-${AR ? 'AR' : 'EN'}.pdf" download>${esc(T.dl)}</a>`;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(() => { window.__profileReady = true; }));
})();
</script>
</body>
</html>
