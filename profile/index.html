<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Profile – Consolidated</title>
<meta name="description" content="Company profile of Consolidated for Auditing and Financial Consulting, Amman, Jordan.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================================
     EDITORIAL EDITION · LANDSCAPE (A4, 297 x 210 mm)
     White paper and one accent (cobalt), set like a printed annual report. Photography is its
     own set (Amman and close-up professional work), separate from the website's images.
     Only solid colours, hairlines and images, so every PDF viewer (incl. macOS Preview) agrees.
     ========================================================================================== */
  :root{
    --paper:#faf9f6; --ink:#121418; --grey:#5d626a; --soft:#8b8f95; --hair:#d8d6cf;
    --blue:#2347b8; --on-blue:rgba(255,255,255,.8); --hair-blue:rgba(255,255,255,.3);
    --display:'Instrument Serif',Georgia,serif; --text:'Newsreader',Georgia,serif; --label:'Inter',Arial,sans-serif;
  }
  html[lang="ar"]{ --display:'Amiri',serif; --text:'Noto Naskh Arabic',serif; --label:'IBM Plex Sans Arabic',sans-serif; }
  @page{ size:297mm 210mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:#2a2a2a; color:var(--ink); font-family:var(--text); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html.print body{ background:var(--paper); }
  h1,h2,h3,h4,p,ul,ol{ margin:0; padding:0; font-weight:400; }
  a{ color:inherit; text-decoration:none; }
  img{ display:block; }

  #doc{ width:297mm; margin:0 auto; }
  html:not(.print) #doc{ margin:76px auto 40px; display:flex; flex-direction:column; gap:26px; }
  .page{ position:relative; width:297mm; height:210mm; overflow:hidden; background:var(--paper); page-break-after:always; break-after:page; }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  html:not(.print) .page{ box-shadow:0 24px 70px rgba(0,0,0,.5); }
  .blue{ background:var(--blue); color:#fff; }

  /* frame */
  .pad{ position:absolute; inset:20mm 18mm 17mm; display:flex; flex-direction:column; }
  .rh{ position:absolute; top:8.5mm; inset-inline:18mm; display:flex; justify-content:space-between; padding-bottom:2mm; border-bottom:.6pt solid var(--hair); }
  .fo{ position:absolute; bottom:7.5mm; inset-inline:18mm; display:flex; align-items:baseline; justify-content:space-between; }
  .fo .pn{ font:400 11pt/1 var(--display); }

  /* type */
  .lbl{ font:500 6.2pt/1.3 var(--label); letter-spacing:.17em; text-transform:uppercase; color:var(--grey); }
  html[lang="ar"] .lbl{ letter-spacing:0; font-size:7.8pt; }
  .blue .lbl, .onb .lbl{ color:var(--on-blue); }
  .onb .hair{ border-color:var(--hair-blue); }
  .acc{ color:var(--blue); } .blue .acc{ color:#fff; }
  .disp{ font-family:var(--display); font-weight:400; line-height:.98; letter-spacing:-.005em; }
  .it{ font-style:italic; } html[lang="ar"] .it{ font-style:normal; }
  .stand{ font:300 13pt/1.42 var(--text); }
  .body{ font:400 9.2pt/1.55 var(--text); color:#2a2d33; hyphens:auto; }
  .blue .body{ color:var(--on-blue); }
  html[lang="ar"] .stand{ font-size:11.6pt; line-height:1.8; font-weight:400; }
  html[lang="ar"] .body{ font-size:8.8pt; line-height:1.85; }
  .cols2{ columns:2; column-gap:8mm; } .cols2 p + p{ margin-top:2.4mm; }
  .hair{ border-top:.6pt solid var(--hair); } .blue .hair{ border-color:var(--hair-blue); }
  .dropcap::first-letter{ float:left; font:400 50pt/.78 var(--display); margin:1.2mm 2.4mm 0 0; color:var(--blue); }
  html[lang="ar"] .dropcap::first-letter{ float:none; font:inherit; margin:0; color:inherit; }
  .ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }

  /* images */
  .ph{ position:absolute; overflow:hidden; } .ph img{ width:100%; height:100%; object-fit:cover; }
  .credit{ position:absolute; font:400 5.4pt/1 var(--label); letter-spacing:.08em; color:rgba(255,255,255,.75); }

  /* logo */
  .logo{ display:flex; align-items:center; gap:2.6mm; }
  .logo .mark{ height:11mm; } .logo .word{ height:6mm; }
  .logo .ar{ display:none; flex-direction:column; line-height:1.15; font-family:var(--label); }
  .logo .ar b{ font-size:14pt; font-weight:600; } .logo .ar small{ font-size:7.2pt; opacity:.8; }
  html[lang="ar"] .logo .word{ display:none; } html[lang="ar"] .logo .ar{ display:flex; }

  /* split: photo on one side, content on the other */
  .side{ position:absolute; top:0; bottom:0; }
  .content{ position:absolute; top:20mm; bottom:17mm; display:flex; flex-direction:column; }

  /* chapter opener */
  .ch-no{ font:400 190pt/.74 var(--display); letter-spacing:-.04em; }
  .ch-list{ display:flex; flex-direction:column; gap:1.4mm; }
  .ch-list span{ font:400 10pt/1.3 var(--text); color:var(--on-blue); }

  /* contents */
  .toc-row{ display:grid; grid-template-columns:24mm 1fr 12mm; gap:5mm; align-items:start; padding:5mm 0; border-top:.6pt solid var(--hair); }
  .toc-row .n{ font:400 40pt/.8 var(--display); color:var(--blue); }
  .toc-row h3{ font:400 20pt/1.05 var(--display); margin-bottom:2mm; }
  .toc-row .items{ font:400 8.8pt/1.5 var(--text); color:var(--grey); }
  .toc-row .pg{ font:400 14pt/1 var(--display); text-align:end; }

  /* numbers */
  .nums{ display:grid; grid-template-columns:repeat(3,1fr); column-gap:10mm; }
  .num{ padding:4.5mm 0 6mm; border-top:.6pt solid var(--hair); }
  .num b{ display:block; font:400 64pt/.86 var(--display); color:var(--blue); }
  .num p{ margin-top:3mm; font:400 9.6pt/1.4 var(--text); color:var(--grey); max-width:60mm; }

  /* generic ruled items */
  .grid2{ display:grid; grid-template-columns:1fr 1fr; column-gap:9mm; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); column-gap:8mm; }
  .item{ padding:4mm 0 4.6mm; border-top:.6pt solid var(--hair); }
  .item .k{ font:500 6.2pt/1 var(--label); letter-spacing:.16em; color:var(--blue); }
  .item h3{ font:400 19pt/1.05 var(--display); margin:2.4mm 0 2.2mm; }
  .item p{ font:400 9pt/1.5 var(--text); color:#2a2d33; }
  html[lang="ar"] .item p{ line-height:1.8; font-size:8.6pt; }
  .blue .item{ border-color:var(--hair-blue); } .blue .item .k{ color:#fff; } .blue .item p{ color:var(--on-blue); }

  /* services index */
  .svc-row{ display:grid; grid-template-columns:12mm 1fr 10mm; gap:4mm; align-items:baseline; padding:2.9mm 0; border-top:.6pt solid var(--hair); }
  .svc-row .n{ font:400 15pt/1 var(--display); color:var(--blue); }
  .svc-row h3{ font:400 14.5pt/1.1 var(--display); }
  .svc-row p{ font:italic 400 8.6pt/1.35 var(--text); color:var(--grey); margin-top:.8mm; }
  html[lang="ar"] .svc-row p{ font-style:normal; }
  .svc-row .pg{ font:400 11pt/1 var(--display); text-align:end; }

  /* service pages */
  .s-no{ font:400 92pt/.76 var(--display); color:var(--blue); letter-spacing:-.03em; }
  .s-title{ font:400 28pt/1.02 var(--display); }
  .s-tag{ font:italic 300 12.5pt/1.35 var(--text); }
  html[lang="ar"] .s-tag{ font-style:normal; font-weight:400; font-size:11.2pt; line-height:1.7; }
  .spec-head{ display:flex; justify-content:space-between; align-items:baseline; gap:6mm; padding:2.6mm 0 2mm; }
  .spec{ list-style:none; counter-reset:sp; columns:2; column-gap:7mm; }
  .spec li{ counter-increment:sp; display:grid; grid-template-columns:7mm 1fr; gap:1.6mm; padding:1.45mm 0; border-top:.6pt solid var(--hair); font:400 8.7pt/1.3 var(--text); break-inside:avoid; }
  .spec li::before{ content:counter(sp, decimal-leading-zero); font:500 6pt/1.9 var(--label); letter-spacing:.08em; color:var(--blue); }

  /* leadership */
  .creds{ font:500 7.2pt/1 var(--label); letter-spacing:.18em; color:var(--blue); }
  .bio p{ font:400 9.4pt/1.55 var(--text); color:#2a2d33; }
  .bio p + p{ margin-top:2.4mm; }
  html[lang="ar"] .bio p{ font-size:9pt; line-height:1.85; }
  .ct-mini{ display:grid; grid-template-columns:1fr 1fr; gap:3mm 8mm; padding-top:3.4mm; border-top:.6pt solid var(--hair); }
  .ct-mini span{ display:block; font:400 9.4pt/1.35 var(--text); margin-top:1mm; }
  .ct-mini span.lbl{ font:500 6.2pt/1.3 var(--label); margin-top:0; }

  /* team: one row of seven */
  .team{ display:grid; grid-template-columns:repeat(7,1fr); column-gap:4.4mm; }
  .member .ph2{ aspect-ratio:3/4; overflow:hidden; background:#111; }
  .member .ph2 img{ width:100%; height:100%; object-fit:cover; object-position:center 20%; }
  .member h3{ font:400 12pt/1.1 var(--display); margin-top:3mm; }
  .member .role{ display:block; font:italic 400 8pt/1.3 var(--text); color:var(--blue); margin:.8mm 0 1.4mm; }
  html[lang="ar"] .member .role{ font-style:normal; }
  .member p{ font:400 7.2pt/1.42 var(--text); color:var(--grey); }

  /* sectors: typographic list */
  .sec{ display:grid; grid-template-columns:12mm 1fr; gap:3mm; align-items:baseline; padding:4mm 0; border-top:.6pt solid var(--hair); }
  .sec .k{ font:400 15pt/1 var(--display); color:var(--blue); }
  .sec h3{ font:400 18pt/1.1 var(--display); }

  /* clients */
  .logos{ display:grid; grid-template-columns:repeat(9,1fr); border-top:.6pt solid var(--hair); border-inline-start:.6pt solid var(--hair); }
  .logos div{ position:relative; aspect-ratio:4/3; border-bottom:.6pt solid var(--hair); border-inline-end:.6pt solid var(--hair); background:#fff; }
  .logos img{ position:absolute; inset:18% 14%; width:72%; height:64%; object-fit:contain; mix-blend-mode:multiply; }

  /* back cover */
  .ct-row{ display:block; padding:2.8mm 0; border-top:.6pt solid var(--hair-blue); }
  .ct-row span{ display:block; font:400 10.4pt/1.35 var(--text); margin-top:1.1mm; }
  .ct-row span.lbl{ font:500 6.2pt/1.3 var(--label); margin-top:0; }
  .qr{ display:block; background:#fff; padding:3mm; width:34mm; color:var(--ink); }
  .qr img{ width:100%; } .qr p{ font:500 5.6pt/1.3 var(--label); letter-spacing:.12em; text-transform:uppercase; text-align:center; margin-top:1.6mm; }

  /* screen chrome */
  .ui{ position:fixed; z-index:50; top:0; left:0; right:0; height:56px; display:flex; align-items:center; gap:14px; padding:0 20px; background:rgba(20,20,20,.9); backdrop-filter:blur(10px); font-family:'Inter',sans-serif; }
  html.print .ui{ display:none; }
  .ui img{ height:28px; } .ui .t{ flex:1; font-size:13px; letter-spacing:.04em; color:rgba(255,255,255,.8); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ui a{ font-size:13px; color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:99px; padding:7px 15px; white-space:nowrap; }
  .ui a.pri{ background:#fff; color:#111; border-color:#fff; font-weight:500; }
  @media (max-width:700px){ .ui .t{ display:none; } }
</style>
</head>
<body>
<div class="ui" id="ui"></div>
<div id="doc"></div>
<script src="/assets/js/i18n.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'ar' ? 'ar' : 'en', AR = lang === 'ar', PRINT = q.has('print');
  const D = I18N[lang], EN = I18N.en, H = document.documentElement;
  H.lang = lang; H.dir = AR ? 'rtl' : 'ltr'; if (PRINT) H.classList.add('print');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad2 = (i) => String(i).padStart(2, '0');
  // Profile photography (Pexels licence: free for commercial use, no attribution required). Not used on the website.
  const P = {
    cover: 17743494, contents: 6992159, ch1: 18717635, about: 18717582, numbers: 32549230, vision: 18717644, why: 19128263,
    ch2: 18682578, ch3: 6992158, ch4: 18717725, back: 30791306,
    svc: [33175651, 7821914, 7821672, 6779567, 7821708, 6779571, 7658352, 8296974, 7821540]
  };
  const pic = (id) => `/profile/img/p-${id}.jpg`;

  const T = AR ? {
    profile: 'الملف التعريفي 2026', firm: 'الموحدة لتدقيق الحسابات والاستشارات المالية', since: 'تأسست 2015 · عمّان، الأردن',
    contents: 'المحتويات', chapter: 'الفصل', ch: ['من نحن', 'ما نقدمه', 'فريقنا', 'من يثق بنا'], vm: 'الرؤية والمهمة',
    numbers: 'بالأرقام', glance: 'لمحة سريعة', founded: 'سنة التأسيس', lines: 'خطوط خدمات متكاملة تحت سقف واحد',
    specialisedAll: 'خدمة متخصصة عبر جميع الممارسات', people: 'مهنيون مؤهلون في فريقنا', service: 'الخدمة', specialised: 'خدمة متخصصة',
    svcLead: 'تسع ممارسات متكاملة تحت سقف واحد، يقودها مهنيون معتمدون دولياً، ترافق عملك من التأسيس إلى النمو والتحول.',
    leadership: 'القيادة', address: 'العنوان', phone: 'الهاتف', email: 'البريد الإلكتروني',
    website: 'الموقع الإلكتروني', scan: 'امسح الرمز لزيارة موقعنا', motto: 'نزاهة • شفافية • جودة', dl: 'تحميل PDF', other: 'English', otherHref: '?lang=en'
  } : {
    profile: 'Company Profile 2026', firm: 'Consolidated for Auditing and Financial Consulting', since: 'Est. 2015 · Amman, Jordan',
    contents: 'Contents', chapter: 'Chapter', ch: ['Who We Are', 'What We Do', 'Our People', 'Who Trusts Us'], vm: 'Vision & Mission',
    numbers: 'In Numbers', glance: 'At a glance', founded: 'Year of establishment', lines: 'Integrated service lines under one roof',
    specialisedAll: 'Specialised services across our practices', people: 'Qualified professionals in our team', service: 'Service', specialised: 'specialised services',
    svcLead: 'Nine integrated practices under one roof, led by internationally certified professionals, supporting your business from formation to growth and transformation.',
    leadership: 'Leadership', address: 'Address', phone: 'Phone', email: 'Email',
    website: 'Website', scan: 'Scan to visit our website', motto: 'Integrity • Transparency • Quality', dl: 'Download PDF', other: 'العربية', otherHref: '?lang=ar'
  };
  const logo = (white) => `<div class="logo"><img class="mark" src="/assets/img/icon.png" alt=""><img class="word" src="${white ? '/profile/img/wordmark-white.png' : '/assets/img/wordmark.png'}" alt=""><div class="ar"><b>الموحدة</b><small>لتدقيق الحسابات والاستشارات المالية</small></div></div>`;
  const contact = D.footer.cols.find((c) => (c.links || []).some((l) => l[3] === 'phone')).links;
  const pick = (k) => (contact.find((l) => l[3] === k) || [''])[0];
  const stripNum = (s) => String(s).replace(/^(أكثر من\s*)?\d+\+?\s*/, '');
  const st = (k) => D.stats.find((s) => s.icon === k) || {};
  // start/end sides in physical terms for absolutely placed blocks (mirrors in Arabic)
  const S = (startMm, endMm) => `inset-inline-start:${startMm};inset-inline-end:${endMm}`;

  // ---------- page model ----------
  const pages = [], anchor = {};
  const mark = (k) => { anchor[k] = pages.length + 1; };
  const page = (inner, o = {}) => pages.push(Object.assign({ inner, cls: '', head: true, foot: true, section: '', frame: null }, o));
  const title = (lbl, html, size = 46) => `<div class="lbl">${esc(lbl)}</div><h2 class="disp" style="font-size:${size}pt;margin-top:3.5mm">${html}</h2>`;

  const toc = [
    ['c1', [D.intro.title, T.numbers, T.vm, `${D.values.title1} ${D.values.title2}`, `${D.why.title1} ${D.why.title2}`]],
    ['c2', [D.services.heading, `${D.services.items.length} ${T.lines}`]],
    ['c3', [D.leaders.title, D.team.title]],
    ['c4', [D.sectors.title, D.clients.title, `${D.expect.t1} ${D.expect.t2} ${D.expect.t3}`]]
  ];

  // Chapter opener: photo across the start half, cobalt panel with the number on the end half.
  const opener = (n, key, photo, standfirst, items) => {
    mark(key);
    page(`<div class="ph side" style="${S('0', '148.5mm')}"><img src="${pic(photo)}"></div>
      <div class="side blue" style="${S('148.5mm', '0')}"></div>
      <div class="content onb" style="${S('162mm', '18mm')}">
        <div class="lbl">${esc(T.chapter)} ${pad2(n)}</div>
        <div class="ch-no" style="margin-top:6mm;color:#fff">${pad2(n)}</div>
        <div style="margin-top:auto;color:#fff">
          <h2 class="disp" style="font-size:42pt">${esc(T.ch[n - 1])}</h2>
          <p class="stand" style="margin-top:4.5mm;color:#fff;font-size:12pt">${esc(standfirst)}</p>
          <div class="ch-list hair" style="margin-top:5mm;padding-top:4mm;border-color:var(--hair-blue)">${items.map((t) => `<span>${esc(t)}</span>`).join('')}</div>
        </div>
      </div>`, { head: false, foot: false });
  };

  // 1 · Cover
  page(`<div class="ph side" style="${S('0', '120mm')}"><img src="${pic(P.cover)}" style="object-position:center 60%"></div>
    <div class="side blue" style="${S('177mm', '0')}"></div>
    <div class="content onb" style="${S('191mm', '16mm')};top:16mm;bottom:14mm;color:#fff">
      ${logo(true)}
      <div style="margin-top:auto">
        <div class="lbl">${esc(T.profile)}</div>
        <h1 class="disp" style="font-size:52pt;margin:5mm 0 6mm;line-height:.94">${String(D.footer.motto).split('•').map((w, i) => `<span style="display:block" class="${i === 1 ? 'it' : ''}">${esc(w.trim())}</span>`).join('')}</h1>
        <p class="body" style="color:var(--on-blue);font-size:9.4pt">${esc(D.hero.sub)}</p>
        <div class="hair" style="margin-top:7mm;padding-top:3.5mm;border-color:var(--hair-blue);display:flex;flex-direction:column;gap:1.4mm">
          <span class="lbl">${esc(T.firm)}</span><span class="lbl">${esc(T.since)} · <span class="ltr">www.caudit.net</span></span>
        </div>
      </div>
    </div>`, { head: false, foot: false });

  // 2 · Contents
  page(`<div class="ph side" style="${S('0', '197mm')}"><img src="${pic(P.contents)}"></div>
    <div class="content" style="${S('118mm', '18mm')}">
      ${title(T.profile, esc(T.contents), 50)}
      <p class="stand it" style="margin:4mm 0 6mm;color:var(--grey);font-size:12pt">${esc(D.consult.title1)} ${esc(D.consult.title2)}</p>
      <div style="margin-top:auto">${toc.map(([k, items], i) => `<a class="toc-row" href="%%L:${k}%%"><span class="n">${pad2(i + 1)}</span>
        <div><h3>${esc(T.ch[i])}</h3><p class="items">${items.map(esc).join(' · ')}</p></div><span class="pg">%%${k}%%</span></a>`).join('')}</div>
    </div>`, { section: T.contents, frame: ['118mm', '18mm'] });

  // ===== Chapter 1 =====
  opener(1, 'c1', P.ch1, D.expect.cards[0].text, toc[0][1]);

  // About: text column + tall photo
  page(`<div class="content" style="${S('18mm', '128mm')}">
      ${title(T.ch[0], `<span class="it">${esc(D.intro.title)}</span>`, 54)}
      <p class="stand dropcap" style="margin-top:auto;font-size:12.2pt;line-height:1.52">${esc(D.intro.p1)}</p>
    </div>
    <div class="ph side" style="${S('181mm', '0')}"><img src="${pic(P.about)}"></div>`, { section: T.ch[0], frame: ['18mm', '128mm'] });

  // In numbers
  const nums = [
    [st('founded').n, T.founded],
    [`${st('years').n}${st('years').suffix || ''}`, stripNum(st('years').caption)],
    [`${st('clients').n}${st('clients').suffix || ''}`, stripNum(st('clients').caption)],
    [D.services.items.length, T.lines],
    [D.services.items.reduce((a, s) => a + s.list.length, 0), T.specialisedAll],
    [D.team.people.length, T.people]
  ];
  page(`<div class="ph" style="top:0;bottom:0;width:66mm;inset-inline-end:0"><img src="${pic(P.numbers)}"></div>
    <div class="content" style="${S('18mm', '80mm')}">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10mm">
        <div>${title(T.glance, `<span class="it">${esc(T.numbers)}</span>`, 50)}</div>
        <p class="disp it" style="font-size:17pt;max-width:80mm;text-align:end">${esc(st('location').caption)}</p>
      </div>
      <div class="nums" style="margin-top:auto">${nums.map(([n, c]) => `<div class="num"><b>${esc(n)}</b><p>${esc(c)}</p></div>`).join('')}</div>
    </div>`, { section: T.ch[0], frame: ['18mm', '80mm'] });

  // Vision & Mission: photo band on top, two columns
  page(`<div class="ph" style="top:0;left:0;right:0;height:72mm"><img src="${pic(P.vision)}" style="object-position:center 55%"></div>
    <div class="pad" style="top:82mm">
      <div class="grid2" style="column-gap:14mm;flex:1">
        ${[D.vision, D.mission].map((v) => `<div style="display:flex;flex-direction:column">
          <div class="lbl">${esc(T.vm)}</div>
          <h2 class="disp it" style="font-size:38pt;margin-top:3mm">${esc(v.title)}</h2>
          <p class="stand" style="margin-top:4mm;font-size:12pt">${esc(v.text)}</p>
          <p class="lbl acc" style="margin-top:auto;padding-top:4mm">${esc(v.tag)}</p></div>`).join('')}
      </div>
    </div>`, { section: T.ch[0], head: false });

  // Core values: intro column + 3 x 2 grid
  page(`<div class="pad" style="flex-direction:row;gap:12mm">
      <div style="width:78mm;display:flex;flex-direction:column">
        ${title(D.values.kicker, `${esc(D.values.title1)}<br><span class="it">${esc(D.values.title2)}</span>`, 46)}
        <p class="stand" style="margin-top:auto;font-size:11.2pt;color:var(--grey)">${esc(D.values.sub)}</p>
      </div>
      <div class="grid3" style="flex:1;align-content:end;column-gap:7mm">${D.values.cards.map((c, i) => `<div class="item"><span class="k">${pad2(i + 1)}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join('')}</div>
    </div>`, { section: T.ch[0] });

  // Why choose us: cobalt panel + 3 x 2 grid on paper
  page(`<div class="side blue" style="${S('0', '197mm')}"></div>
    <div class="content onb" style="${S('18mm', '211mm')};color:#fff">
      <div class="lbl">${esc(T.ch[0])}</div>
      <h2 class="disp" style="font-size:42pt;margin-top:3.5mm">${esc(D.why.title1)}<br><span class="it">${esc(D.why.title2)}</span></h2>
      <p class="body" style="margin-top:auto;font-size:9.8pt;color:#fff">${esc(D.why.intro)}</p>
    </div>
    <div class="content" style="${S('114mm', '18mm')};justify-content:flex-end">
      <div class="grid3" style="column-gap:7mm">${D.why.items.map((w, i) => `<div class="item"><span class="k">${pad2(i + 1)}</span><h3 style="font-size:16pt">${esc(w.title)}</h3><p>${esc(w.text)}</p></div>`).join('')}</div>
    </div>`, { section: T.ch[0], frame: ['114mm', '18mm'] });

  // ===== Chapter 2 =====
  opener(2, 'c2', P.ch2, T.svcLead, toc[1][1]);

  // Services index: lead column + list
  page(`<div class="pad" style="flex-direction:row;gap:12mm">
      <div style="width:84mm;display:flex;flex-direction:column">
        ${title(T.ch[1], `<span class="it">${esc(D.services.heading)}</span>`, 50)}
        <p class="stand" style="margin-top:auto;font-size:12pt">${esc(T.svcLead)}</p>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end">${D.services.items.map((s, i) => `<a class="svc-row" href="%%L:s${i}%%"><span class="n">${pad2(i + 1)}</span>
        <div><h3>${esc(s.title)}</h3><p>${esc(s.tagline)}</p></div><span class="pg">%%s${i}%%</span></a>`).join('')}</div>
    </div>`, { section: T.ch[1] });

  // One page per service: photo strip on alternating sides, text and list across the rest
  D.services.items.forEach((s, i) => {
    mark('s' + i);
    const start = i % 2 === 0;
    const photoPos = start ? S('0', '214mm') : S('214mm', '0');
    const textPos = start ? S('97mm', '18mm') : S('18mm', '97mm');
    const long = s.list.length > 12;
    page(`<div class="ph side" style="${photoPos}"><img src="${pic(P.svc[i])}"></div>
      <div class="content" style="${textPos}">
        <div style="display:grid;grid-template-columns:auto 1fr;gap:7mm;align-items:end">
          <span class="s-no">${pad2(i + 1)}</span>
          <div><div class="lbl">${esc(T.service)} ${pad2(i + 1)} / ${pad2(D.services.items.length)}</div><h2 class="s-title" style="margin-top:2.6mm">${esc(s.title)}</h2></div>
        </div>
        <p class="s-tag" style="margin-top:5mm">${esc(s.tagline)}</p>
        <div class="body cols2" style="margin-top:3.5mm">${s.text.slice(0, long ? 1 : 2).map((p) => `<p>${esc(p)}</p>`).join('')}</div>
        <div style="margin-top:auto">
          <div class="spec-head hair"><p class="disp it" style="font-size:13pt">${esc(s.listTitle)}</p><span class="lbl acc" style="white-space:nowrap">${pad2(s.list.length)} ${esc(T.specialised)}</span></div>
          <ol class="spec">${s.list.map((li) => `<li><span>${esc(li)}</span></li>`).join('')}</ol>
        </div>
      </div>`, { section: T.ch[1], frame: start ? ['97mm', '18mm'] : ['18mm', '97mm'] });
  });

  // ===== Chapter 3 =====
  opener(3, 'c3', P.ch3, D.expect.cards[2].text, toc[2][1]);

  // Leadership: one page per partner, portrait on alternating sides
  D.leaders.people.forEach((p, i) => {
    const start = i % 2 === 0;
    const mail = (p.contact.find((c) => (c.href || '').startsWith('mailto:')) || {}).value || '';
    const tel = (p.contact.find((c) => (c.href || '').startsWith('tel:')) || {}).value || '';
    page(`<div class="ph side" style="${start ? S('0', '192mm') : S('192mm', '0')};background:#000"><img src="/profile/img/${p.photo}-bw.jpg" style="object-position:center 15%"></div>
      <div class="content" style="${start ? S('119mm', '18mm') : S('18mm', '119mm')}">
        <div class="lbl">${esc(T.leadership)}</div>
        <h2 class="disp" style="font-size:36pt;margin-top:4mm">${esc(p.name)}</h2>
        <div style="display:flex;flex-wrap:wrap;gap:3mm 6mm;align-items:baseline;margin-top:3.5mm">
          <p class="lbl acc">${esc(p.role)}</p>
          ${p.certs.length ? `<p class="creds"><span class="ltr">${p.certs.map(esc).join(' · ')}</span></p>` : ''}
        </div>
        <p class="body it" style="margin-top:3mm;color:var(--grey)">${esc(p.degree)}</p>
        <div class="bio hair" style="margin-top:5mm;padding-top:4.5mm">${p.bio.map((b, k) => k === 0 ? `<p class="stand" style="font-size:11.8pt;color:var(--ink)">${esc(b)}</p>` : `<p>${esc(b)}</p>`).join('')}</div>
        <div class="ct-mini" style="margin-top:auto"><div><span class="lbl">${esc(T.email)}</span><span class="ltr">${esc(mail)}</span></div><div><span class="lbl">${esc(T.phone)}</span><span class="ltr">${esc(tel)}</span></div></div>
      </div>`, { section: T.ch[2], frame: start ? ['119mm', '18mm'] : ['18mm', '119mm'] });
  });

  // Team: one row of seven
  const teamImg = ['esam', 'abdelhadi', 'masoud', 'hamdan', 'alfares', 'abuhejleh', 'lojen'];
  page(`<div class="pad">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12mm">
        <div>${title(T.ch[2], `<span class="it">${esc(D.team.title)}</span>`, 34)}</div>
        <p class="body" style="max-width:85mm;color:var(--grey)">${esc(D.expect.cards[2].text)}</p>
      </div>
      <div class="team" style="margin-top:auto">${D.team.people.map((p, i) => `<div class="member"><div class="ph2"><img src="/profile/img/team-${teamImg[i]}.jpg"></div>
        <h3>${esc(p.name)}</h3><span class="role">${esc(p.role)}</span><p>${esc(p.line)}</p></div>`).join('')}</div>
    </div>`, { section: T.ch[2] });

  // ===== Chapter 4 =====
  opener(4, 'c4', P.ch4, D.expect.cards[1].text, toc[3][1]);

  // Sectors: big figure + typographic list
  page(`<div class="pad" style="flex-direction:row;gap:14mm">
      <div style="width:96mm;display:flex;flex-direction:column">
        ${title(T.ch[3], `<span class="it">${esc(D.sectors.title)}</span>`, 46)}
        <b class="disp acc" style="font-size:110pt;line-height:.8;margin-top:auto">${esc(st('clients').n)}${esc(st('clients').suffix || '')}</b>
        <p class="stand" style="margin-top:5mm;font-size:11.4pt;color:var(--grey)">${esc(D.expect.cards[4].text)}</p>
      </div>
      <div class="grid2" style="flex:1;align-content:end;column-gap:9mm">${D.sectors.cards.map((c, i) => `<div class="sec"><span class="k">${pad2(i + 1)}</span><h3>${esc(c.title)}</h3></div>`).join('')}</div>
    </div>`, { section: T.ch[3] });

  // Clients
  page(`<div class="pad">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12mm">
        <div>${title(T.ch[3], `<span class="it">${esc(D.clients.title)}</span>`, 46)}</div>
        <p class="stand" style="max-width:100mm;font-size:11.4pt;color:var(--grey)">${esc(D.expect.cards[1].text)}</p>
      </div>
      <div class="logos" style="margin-top:auto">${(EN.clients.logoFiles || []).map((f) => `<div><img src="/assets/img/clients/${f}"></div>`).join('')}</div>
    </div>`, { section: T.ch[3] });

  // What you can expect
  page(`<div class="pad" style="flex-direction:row;gap:12mm">
      <div style="width:70mm;display:flex;flex-direction:column">
        ${title(T.ch[3], `<span class="it">${esc(D.expect.t1)} ${esc(D.expect.t2)}</span> ${esc(D.expect.t3)}`, 40)}
      </div>
      <div class="grid3" style="flex:1;align-content:end">${D.expect.cards.map((c, i) => `<div class="item" style="min-height:44mm"><span class="k">${pad2(i + 1)}</span><p class="disp" style="font-size:14pt;line-height:1.2;margin-top:2.6mm;color:var(--ink)">${esc(c.text)}</p></div>`).join('')}</div>
    </div>`, { section: T.ch[3] });

  // Back cover
  page(`<div class="ph side" style="${S('160mm', '0')}"><img src="${pic(P.back)}"></div>
    <div class="side blue" style="${S('0', '137mm')}"></div>
    <div class="content onb" style="${S('16mm', '153mm')};top:16mm;bottom:14mm;color:#fff">
      ${logo(true)}
      <h2 class="disp" style="font-size:38pt;margin-top:auto">${esc(D.consult.title1)}<br><span class="it">${esc(D.consult.title2)}</span></h2>
      <p class="body" style="margin-top:4mm;color:var(--on-blue);font-size:9.4pt">${esc(D.consult.sub)}</p>
      <div style="display:grid;grid-template-columns:1fr auto;gap:7mm;align-items:end;margin-top:7mm">
        <div>
          <a class="ct-row" href="${esc((contact.find((l) => l[3] === 'map') || [])[1] || '#')}"><span class="lbl">${esc(T.address)}</span><span>${esc(pick('pin'))}</span></a>
          <a class="ct-row" href="tel:${esc(pick('phone').replace(/\s+/g, ''))}"><span class="lbl">${esc(T.phone)}</span><span class="ltr">${esc(pick('phone'))}</span></a>
          <a class="ct-row" href="mailto:${esc(pick('mail'))}"><span class="lbl">${esc(T.email)}</span><span class="ltr">${esc(pick('mail'))}</span></a>
          <a class="ct-row" href="https://www.caudit.net"><span class="lbl">${esc(T.website)}</span><span class="ltr">${esc(pick('globe'))}</span></a>
        </div>
        <a class="qr" href="https://www.caudit.net"><img src="/profile/qr-website.svg" alt=""><p>${esc(T.scan)}</p></a>
      </div>
      <div class="hair" style="margin-top:6mm;padding-top:3mm;border-color:var(--hair-blue)"><span class="lbl">${esc(T.motto)}</span></div>
    </div>`, { head: false, foot: false });

  // ---------- render ----------
  let out = pages.map((p, i) => {
    const fr = p.frame ? ` style="${S(p.frame[0], p.frame[1])}"` : '';
    const rh = p.head ? `<div class="rh"${fr}><span class="lbl">${esc(T.firm)}</span><span class="lbl">${esc(p.section)}</span></div>` : '';
    const fo = p.foot ? `<div class="fo"${fr}><span class="lbl">${esc(T.profile)}</span><span class="pn">${pad2(i + 1)}</span></div>` : '';
    return `<section class="page ${p.cls}" id="pg${i + 1}">${p.inner}${rh}${fo}</section>`;
  }).join('');
  out = out.replace(/%%L:(\w+)%%/g, (_, k) => '#pg' + (anchor[k] || 1)).replace(/%%(\w+)%%/g, (_, k) => pad2(anchor[k] || 0));
  const doc = document.getElementById('doc');
  doc.innerHTML = out;

  if (!PRINT) {
    document.getElementById('ui').innerHTML = `<img src="/assets/img/icon.png" alt=""><span class="t">${esc(T.firm)} · ${esc(T.profile)}</span>
      <a href="${T.otherHref}">${esc(T.other)}</a><a class="pri" href="/profile/Consolidated-Company-Profile-${AR ? 'AR' : 'EN'}.pdf" download>${esc(T.dl)}</a>`;
    const fit = () => { doc.style.zoom = Math.min(1.1, (window.innerWidth - 32) / 1123); };
    fit(); window.addEventListener('resize', fit);
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(() => { window.__profileReady = true; }));
})();
</script>
</body>
</html>
