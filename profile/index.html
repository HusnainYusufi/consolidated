<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Profile – Consolidated</title>
<meta name="description" content="Company profile of Consolidated for Auditing and Financial Consulting, Amman, Jordan.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ Consolidated company profile ============
     Editorial corporate brochure in the manner of the client's reference (Toyo Tanso): white pages,
     large light titles in one accent colour, bracketed section labels, photography cut on 60-degree
     angles (the six-fold symmetry of the logo's blades), diagrams and a regional dot map instead of
     card grids. Colours come from the logo: steel blue, navy, charcoal, silver.
     All copy comes from the website (assets/js/i18n.js); ?lang=ar renders the Arabic edition. */
  :root{
    --accent: oklch(0.50 0.075 245);
    --navy: oklch(0.31 0.055 252);
    --char: oklch(0.27 0.008 250);
    --ink: oklch(0.30 0.01 250);
    --ink2: oklch(0.45 0.01 250);
    --silver: oklch(0.66 0.008 250);
    --line: oklch(0.88 0.008 250);
    --mist: oklch(0.955 0.008 245);
    --paper: oklch(0.997 0.002 250);
    --font: 'Source Sans 3', 'Segoe UI', sans-serif;
  }
  html[lang="ar"]{ --font:'IBM Plex Sans Arabic', 'Segoe UI', sans-serif; }
  @page{ size:210mm 297mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:var(--font); color:var(--ink2); background:oklch(0.82 0.01 250); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html.print body{ background:var(--paper); }
  #doc{ width:210mm; margin:0 auto; }
  html:not(.print) #doc{ padding:24px 0 60px; display:flex; flex-direction:column; gap:24px; }
  h1,h2,h3,p{ margin:0; }
  .ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }

  .page{ position:relative; isolation:isolate; width:210mm; height:297mm; overflow:hidden; background:var(--paper); page-break-after:always; break-after:page; }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  html:not(.print) .page{ box-shadow:0 12px 40px oklch(0.2 0.03 252 / .25); }
  .shot{ position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .abs{ position:absolute; z-index:1; }

  /* section label in brackets, page number */
  .brk{ position:absolute; z-index:2; top:12mm; inset-inline-start:18mm; font-size:7.6pt; letter-spacing:.06em; color:var(--ink2); }
  html[lang="ar"] .brk{ letter-spacing:0; font-size:8.6pt; }
  .pn{ position:absolute; z-index:2; bottom:10mm; inset-inline-end:18mm; display:flex; align-items:center; gap:3mm; font-size:7pt; color:var(--silver); }
  .pn b{ font-weight:600; color:var(--accent); font-size:8.5pt; }
  html[lang="ar"] .pn{ font-size:7.8pt; }

  /* type: large light titles in the accent colour */
  .t1{ font-weight:300; color:var(--accent); font-size:31pt; line-height:1.06; letter-spacing:-.01em; }
  html[lang="ar"] .t1{ font-size:24pt; line-height:1.4; letter-spacing:0; }
  .t2{ font-weight:600; color:var(--char); font-size:11.5pt; line-height:1.35; }
  html[lang="ar"] .t2{ font-size:12pt; line-height:1.6; }
  .t3{ font-weight:600; color:var(--accent); font-size:10pt; line-height:1.3; }
  .tx{ font-size:9pt; line-height:1.55; color:var(--ink2); text-align:justify; }
  html[lang="ar"] .tx{ font-size:9.4pt; line-height:1.8; }
  .sm{ font-size:8pt; line-height:1.5; }
  html[lang="ar"] .sm{ font-size:8.6pt; line-height:1.7; }
  .cap{ font-size:7pt; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--accent); }
  html[lang="ar"] .cap{ letter-spacing:0; font-size:8.4pt; }
  .num{ font-weight:300; color:var(--accent); line-height:.95; letter-spacing:-.02em; }
  .num small{ font-size:.5em; }
  .rule{ height:1px; background:var(--line); }
  .band{ background:var(--accent); color:#fff; }
  .band .t1, .band .t2, .band .t3, .band .num{ color:#fff; } .band .tx, .band .sm{ color:oklch(0.93 0.02 245); }
  .band .cap{ color:oklch(0.88 0.04 245); }
  .ic{ display:inline-grid; place-items:center; flex:0 0 auto; color:var(--accent); }
  .ic svg{ width:100%; height:100%; stroke-width:1.3; }
  .dot{ display:inline-block; width:2.4mm; height:2.4mm; background:var(--accent); flex:0 0 auto; }
  ul.li{ list-style:none; margin:0; padding:0; display:grid; gap:1.4mm 6mm; }
  ul.li li{ display:flex; gap:2mm; font-size:7.9pt; line-height:1.38; color:var(--ink); }
  html[lang="ar"] ul.li li{ font-size:8.5pt; line-height:1.55; }
  ul.li li::before{ content:""; flex:0 0 auto; width:1.5mm; height:1.5mm; margin-top:1.4mm; background:var(--accent); }

  .ui{ position:sticky; top:0; z-index:9; display:flex; gap:12px; align-items:center; padding:10px 18px; background:var(--char); color:#fff; font:14px var(--font); }
  .ui img{ height:24px; } .ui .t{ flex:1; opacity:.85; }
  .ui a{ color:#fff; border:1px solid oklch(1 0 0 / .4); padding:6px 12px; text-decoration:none; }
  html.print .ui{ display:none; }
</style>
</head>
<body>
<div class="ui" id="ui"></div>
<div id="doc"></div>
<script src="/assets/js/i18n.js"></script>
<script src="/profile/mark.js"></script>
<script src="/profile/photos.js"></script>
<script src="/profile/map.js"></script>
<script src="/profile/vendor/lucide.min.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'ar' ? 'ar' : 'en', AR = lang === 'ar', PRINT = q.has('print');
  const D = I18N[lang], EN = I18N.en, Hd = document.documentElement;
  Hd.lang = lang; Hd.dir = AR ? 'rtl' : 'ltr'; if (PRINT) Hd.classList.add('print');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = (i) => String(i).padStart(2, '0');
  const ic = (n, mm) => `<span class="ic" style="width:${mm}mm;height:${mm}mm"><i data-lucide="${n}"></i></span>`;

  // ---------- geometry: layouts are drawn left-to-right in mm and mirrored for Arabic ----------
  const MX = (x) => AR ? 210 - x : x;
  const SL = Math.tan(Math.PI / 6);                                   // 60-degree edges: dx = dy * tan(30deg)
  const para = (x, w, y0, y1) => { const s = (y1 - y0) * SL; return [[x, y0], [x + w, y0], [x + w - s, y1], [x - s, y1]]; };
  const src = (id) => /^\d+$/.test(String(id)) ? `/profile/img/c-${id}.jpg` : `/assets/img/${id}.jpg`;
  let sid = 0;
  // A photo clipped to a polygon, drawn as a page-sized SVG (clipping survives PDF output even when it bleeds).
  const shot = (id, pts, o = {}) => {
    const P = pts.map(([x, y]) => [MX(x), y]), xs = P.map((p) => p[0]), ys = P.map((p) => p[1]);
    const bx = Math.min(...xs), by = Math.min(...ys), bw = Math.max(...xs) - bx, bh = Math.max(...ys) - by;
    const [iw, ih] = PHOTO_DIM[id], f = Math.max(bw / iw, bh / ih), w = iw * f, h = ih * f, [px, fy] = o.pos || [.5, .5], fx = AR ? 1 - px : px, k = ++sid;
    const poly = (pp) => pp.map(([x, y]) => `${MX(x)},${y}`).join(' ');
    return `<svg class="shot" viewBox="0 0 210 297" preserveAspectRatio="none"><defs><clipPath id="s${k}"><polygon points="${P.map((p) => p.join(',')).join(' ')}"/></clipPath></defs>
      <image href="${src(id)}" x="${bx - (w - bw) * fx}" y="${by - (h - bh) * fy}" width="${w}" height="${h}" preserveAspectRatio="none" clip-path="url(#s${k})"/>
      ${(o.overlays || []).map((ov) => `<polygon points="${poly(ov.pts)}" fill="${ov.fill}" opacity="${ov.op ?? 1}" clip-path="url(#s${k})"/>`).join('')}</svg>`;
  };
  const GR = { silver: ['#c6ccd2', '#7d858d'], navy: ['#3d678c', '#13253a'], char: ['#3e4248', '#1a1c1f'] };
  let gid = 0;
  const mark = (style, mono) => { const id = ++gid;
    return `<svg viewBox="0 0 ${MARK.w} ${MARK.h}" style="${style}"><defs>${Object.entries(GR).map(([k, [a, b]]) => `<linearGradient id="m${id}${k}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`).join('')}</defs>${MARK.blades.map((b) => `<path d="${b.d}" fill="${mono || `url(#m${id}${b.role})`}"/>`).join('')}</svg>`; };

  const T = AR ? {
    profile: 'الملف التعريفي', year: '2026', firm: 'الموحدة لتدقيق الحسابات والاستشارات المالية', site: 'www.caudit.net', motto: ['نزاهة', 'شفافية', 'جودة'],
    lb: { about: 'من نحن', lead: 'قيادتنا', why: 'لماذا تختارنا', values: 'قيمنا الأساسية', sectors: 'القطاعات التي نخدمها', svc: 'خدماتنا', det: 'تفاصيل الخدمات', team: 'فريقنا', clients: 'عملاؤنا والتزاماتنا', profile: 'لمحة عن الشركة' },
    whoTitle: 'شريك موثوق لأعمالك', est: 'تأسست عام 2015 · عمّان، الأردن', vision: 'رؤيتنا', mission: 'مهمتنا', mottoT: 'شعارنا', reach: 'نطاق عملنا',
    specialised: 'خدمة متخصصة', across: 'خدمة متخصصة عبر تسع ممارسات متكاملة', service: 'الخدمة',
    stats: ['سنة التأسيس', 'سنوات من الخبرة', 'عميل', 'خدمة متخصصة'],
    clientsT: 'عملاء يثقون بنا', expectT: 'ما يمكنك أن تتوقعه منا', join: 'انضم إلى فريقنا: caudit.net/careers',
    mapT: 'من عمّان إلى المنطقة', mapS: 'مقرنا الرئيسي في عمّان، الأردن، ونخدم عملاءنا في منطقة الشرق الأوسط وشمال أفريقيا.', amman: 'عمّان',
    rows: ['الاسم', 'التأسيس', 'المقر الرئيسي', 'الخدمات', 'الاعتمادات المهنية', 'المعايير', 'العملاء', 'الهاتف', 'البريد الإلكتروني', 'الموقع الإلكتروني'],
    founded: '26 شباط 2015', dl: 'تحميل PDF', other: 'English', otherHref: '?lang=en'
  } : {
    profile: 'Company Profile', year: '2026', firm: 'Consolidated for Auditing and Financial Consulting', site: 'www.caudit.net', motto: ['Integrity', 'Transparency', 'Quality'],
    lb: { about: 'About Us', lead: 'Our Leadership', why: 'Why Choose Us', values: 'Core Values', sectors: 'Sectors We Serve', svc: 'Our Services', det: 'Service Details', team: 'Our Team', clients: 'Clients & Commitments', profile: 'Corporate Profile' },
    whoTitle: 'A trusted partner for your business', est: 'Established 2015 · Amman, Jordan', vision: 'Our Vision', mission: 'Our Mission', mottoT: 'Our Motto', reach: 'Where We Work',
    specialised: 'Specialised services', across: 'Specialised services across nine integrated practices', service: 'Service',
    stats: ['Founded', 'Years of practice', 'Clients served', 'Specialised services'],
    clientsT: 'Clients That Trust Us', expectT: 'What You Can Expect from Us', join: 'Join our team: caudit.net/careers',
    mapT: 'From Amman to the region', mapS: 'Headquartered in Amman, Jordan, serving clients across the Middle East and North Africa.', amman: 'Amman',
    rows: ['Name', 'Founded', 'Headquarters', 'Services', 'Professional credentials', 'Standards', 'Clients', 'Phone', 'Email', 'Website'],
    founded: '26 February 2015', dl: 'Download PDF', other: 'العربية', otherHref: '?lang=ar'
  };
  const svcIcons = ['shield-check', 'calculator', 'receipt-text', 'scan-search', 'trending-up', 'building-2', 'briefcase-business', 'graduation-cap', 'monitor-cog'];
  const valIcons = ['badge-check', 'scale', 'award', 'handshake', 'lock-keyhole', 'lightbulb'];
  const whyIcons = ['user-check', 'circle-check-big', 'factory', 'heart-handshake', 'cpu', 'rocket'];
  const ptIcons = ['medal', 'network', 'clipboard-check'];
  const secIcons = ['factory', 'store', 'stethoscope', 'monitor-smartphone', 'heart-handshake', 'hard-hat', 'wheat', 'fuel'];
  const secPhotos = [29988954, 1427541, 6129104, 1181354, 6591154, 8961073, 14502034, 19205947];
  const expIcons = ['hourglass', 'users-round', 'graduation-cap', 'book-check', 'globe', 'compass', 'lock', 'map-pin', 'star'];

  const st = D.stats, S = D.services.items;
  const totalSpec = S.reduce((a, s) => a + s.list.length, 0), maxList = Math.max(...S.map((s) => s.list.length));
  const cc = D.footer.cols.find((c) => (c.links || []).some((l) => String(l[1] || '').startsWith('tel:')));
  const link = (k) => (cc.links.find((l) => l[3] === k) || [''])[0];

  const pages = [];
  const page = (label, inner, opt = {}) => pages.push({ label, inner, opt });
  const A = (x, y, w, inner, extra = '') => `<div class="abs" style="top:${y}mm;inset-inline-start:${x}mm;${w ? `width:${w}mm;` : ''}${extra}">${inner}</div>`;

  // ============ 1 · COVER ============
  page('', `
    ${shot(8939052, para(30, 80, 0, 158), { pos: [.55, .5] })}
    ${shot(7821716, para(114, 80, 0, 158), { pos: [.6, .5] })}
    ${shot(7654131, para(198, 80, 0, 158), { pos: [.3, .5] })}
    ${A(18, 172, 120, `
      <div style="display:flex;align-items:center;gap:3.4mm"><img src="/assets/img/icon.png" style="height:13mm"><img src="/assets/img/wordmark.png" style="height:6.6mm"></div>
      <h1 class="t1" style="font-size:${AR ? 30 : 40}pt;margin-top:9mm">${esc(T.profile)} <span style="color:var(--silver)">${T.year}</span></h1>
      <p class="t2" style="margin-top:4mm;font-size:${AR ? 13 : 14}pt">${esc(D.services.title1)} ${esc(D.services.title2)}</p>
      <p class="tx" style="margin-top:5mm">${esc(D.hero.sub)}</p>`)}
    ${mark(`position:absolute;z-index:1;width:50mm;bottom:38mm;inset-inline-end:18mm`)}
    ${A(18, 268, 174, `<div style="display:flex;align-items:center;gap:6mm;padding-top:4mm;border-top:1px solid var(--line)">${T.motto.map((m) => `<span style="display:flex;align-items:center;gap:2mm;font-weight:600;color:var(--accent);font-size:${AR ? 10 : 9}pt"><span class="dot"></span>${esc(m)}</span>`).join('')}<span style="flex:1"></span><span class="sm">${T.site}</span></div>`)}`, { bare: true });

  // ============ 2 · ABOUT US / PHILOSOPHY ============
  page(T.lb.about, `
    ${shot(8938631, [[118, 0], [210, 0], [210, 160]], { pos: [.55, .4] })}
    ${A(18, 26, 98, `
      <h2 class="t1">${esc(T.whoTitle)}</h2>
      <p class="t2" style="margin-top:4mm">${esc(T.est)}</p>
      <p class="tx" style="margin-top:4mm">${esc(D.intro.p1)}</p>
      <div style="display:flex;flex-direction:column;gap:3.6mm;margin-top:6mm">${D.intro.points.map((p, i) => `
        <div style="display:flex;gap:3.6mm;align-items:flex-start">${ic(ptIcons[i], 8)}<div><p class="t3">${esc(p.title)}</p><p class="sm" style="margin-top:.6mm">${esc(p.text)}</p></div></div>`).join('')}</div>`)}
    <div class="band abs" style="top:186mm;inset-inline:0;height:111mm;padding:10mm 18mm 0">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6mm 12mm">
        <div><p class="cap">${esc(T.vision)}</p><p class="t2" style="font-weight:300;font-size:${AR ? 10.4 : 11}pt;margin-top:2.4mm;line-height:1.5">${esc(D.vision.text)}</p></div>
        <div><p class="cap">${esc(T.mission)}</p><p class="t2" style="font-weight:300;font-size:${AR ? 10.4 : 11}pt;margin-top:2.4mm;line-height:1.5">${esc(D.mission.text)}</p></div>
        <div style="border-top:1px solid oklch(1 0 0 / .3);padding-top:4mm"><p class="cap">${esc(T.mottoT)}</p><p style="font-size:15pt;font-weight:300;margin-top:1.6mm">${T.motto.map(esc).join(' · ')}</p></div>
        <div style="border-top:1px solid oklch(1 0 0 / .3);padding-top:4mm"><p class="cap">${esc(T.reach)}</p><p style="font-size:${AR ? 11 : 12}pt;font-weight:300;margin-top:1.6mm;line-height:1.4">${esc(st[3].caption)}</p></div>
      </div></div>`);

  // ============ 3 · LEADERSHIP (the founder's page) ============
  const L0 = D.leaders.people[0], L1 = D.leaders.people[1];
  const certs = (p) => p.certs.length ? `<p class="t3 ltr" style="margin-top:2.4mm;letter-spacing:.04em">${p.certs.join(' · ')}</p>` : '';
  const contact = (p) => p.contact.filter((c) => /^\+|@/.test(c.value)).map((c) => `<span class="ltr">${esc(c.value)}</span>`).join('<span style="color:var(--line)">  |  </span>');
  page(T.lb.lead, `
    ${shot('esam', [[92, 0], [210, 0], [210, 204]], { pos: [.62, .1] })}
    ${A(18, 26, 104, `
      <h2 class="t1">${esc(D.leaders.title)}</h2>
      <p class="t2" style="margin-top:9mm;font-size:${AR ? 14 : 15}pt">${esc(L0.name)}</p>
      <p class="cap" style="margin-top:1.6mm">${esc(L0.role)}</p>${certs(L0)}
      <p class="sm" style="margin-top:2.4mm;color:var(--ink)">${esc(L0.degree)}</p>
      ${L0.bio.map((b) => `<p class="tx" style="margin-top:3mm">${esc(b)}</p>`).join('')}
      <p class="sm" style="margin-top:3.4mm;color:var(--accent)">${contact(L0)}</p>`)}
    ${A(18, 214, 174, `
      <div style="display:grid;grid-template-columns:36mm 1fr;gap:7mm;border-top:1px solid var(--line);padding-top:6mm">
        <div style="height:46mm;overflow:hidden"><img src="/assets/img/${L1.photo}.jpg" style="width:100%;height:100%;object-fit:cover;object-position:center 15%"></div>
        <div><p class="t2" style="font-size:${AR ? 12.5 : 13}pt">${esc(L1.name)}</p><p class="cap" style="margin-top:1.4mm">${esc(L1.role)}</p>
          <p class="sm" style="margin-top:1.6mm;color:var(--ink)">${esc(L1.degree)}</p>
          ${L1.bio.map((b) => `<p class="tx" style="margin-top:2mm;font-size:8.3pt;line-height:1.5">${esc(b)}</p>`).join('')}
          <p class="sm" style="margin-top:2mm;color:var(--accent)">${contact(L1)}</p></div></div>`)}`);

  // ============ 4 · WHY CHOOSE US: competence ring around the mark ============
  const cx = 105, cy = 132, R = 46;
  const nodes = D.why.items.map((w, k) => { const a = (-90 + k * 60) * Math.PI / 180; return { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), w, k, c: Math.cos(a) }; });
  page(T.lb.why, `
    ${shot(7984737, [[150, 0], [210, 0], [210, 104]], { pos: [.5, .45] })}
    ${A(18, 26, 128, `<h2 class="t1">${esc(D.why.title1)} ${esc(D.why.title2)}</h2><p class="t2" style="margin-top:3mm">${esc(D.why.subtitle)}</p><p class="tx" style="margin-top:3.6mm">${esc(D.why.intro)}</p>`)}
    <svg class="shot" viewBox="0 0 210 297" style="z-index:1">
      <circle cx="${MX(cx)}" cy="${cy}" r="${R}" fill="none" stroke="#2f6390" stroke-width=".35" stroke-dasharray="1.2 1.4"/>
      <circle cx="${MX(cx)}" cy="${cy}" r="22" fill="#eef2f6"/>
      ${nodes.map((n) => `<circle cx="${MX(n.x)}" cy="${n.y}" r="8.2" fill="#2f6390"/>`).join('')}</svg>
    ${mark(`position:absolute;z-index:2;width:26mm;top:${cy - 13}mm;inset-inline-start:${cx - 13}mm`)}
    ${nodes.map((n) => A(n.x - 4.6, n.y - 4.6, 9.2, `<span class="ic" style="width:9.2mm;height:9.2mm;color:#fff"><i data-lucide="${whyIcons[n.k]}"></i></span>`, 'z-index:3')).join('')}
    ${nodes.map((n) => { const right = n.c > .1, left = n.c < -.1;
      const x = right ? n.x + 11 : left ? n.x - 11 - 44 : n.x - 22, y = n.k === 0 ? n.y - 17 : n.k === 3 ? n.y + 10 : n.y - 4;
      return A(x, y, 44, `<p class="t3" style="text-align:${right ? 'start' : left ? 'end' : 'center'};font-size:9.4pt">${esc(n.w.title)}</p>`, 'z-index:3'); }).join('')}
    ${A(18, 196, 174, `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5mm 8mm;border-top:1px solid var(--line);padding-top:5mm">${D.why.items.map((w, k) => `
      <div><p class="cap" style="display:flex;gap:2mm;align-items:center"><span style="color:var(--silver)">${pad(k + 1)}</span>${esc(w.title)}</p><p class="sm" style="margin-top:1.4mm;text-align:start">${esc(w.text)}</p></div>`).join('')}</div>`)}`);

  // ============ 5 · CORE VALUES + numbers ============
  const figs = [[st[0].n, '', T.stats[0]], [st[1].n, st[1].suffix, T.stats[1]], [st[2].n, st[2].suffix, T.stats[2]], [totalSpec, '', T.stats[3]]];
  page(T.lb.values, `
    ${shot(8939110, [[160, 0], [210, 0], [210, 87]], { pos: [.6, .5] })}
    ${A(18, 26, 136, `<h2 class="t1">${esc(D.values.title1)} ${esc(D.values.title2)}</h2><p class="t2" style="margin-top:3mm">${esc(D.values.kicker)}</p><p class="tx" style="margin-top:3.6mm">${esc(D.values.sub)}</p>`)}
    ${A(18, 92, 174, `<div style="display:grid;grid-template-columns:1fr 1fr;gap:7mm 12mm">${D.values.cards.map((c, k) => `
      <div style="display:flex;gap:4.5mm;align-items:flex-start;border-top:1px solid var(--line);padding-top:4.5mm">${ic(valIcons[k], 12)}
        <div><p class="t3" style="font-size:11pt">${esc(c.title)}</p><p class="sm" style="margin-top:1.4mm;text-align:justify">${esc(c.text)}</p></div></div>`).join('')}</div>`)}
    <div class="band abs" style="top:226mm;inset-inline:0;height:71mm;padding:11mm 18mm 0">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6mm">${figs.map(([n, s, l], i) => `
        <div style="${i ? 'border-inline-start:1px solid oklch(1 0 0 / .3);padding-inline-start:5mm' : ''}"><p class="num" style="font-size:36pt">${n}${s ? `<small>${esc(s)}</small>` : ''}</p><p class="cap" style="margin-top:2.6mm">${esc(l)}</p></div>`).join('')}</div></div>`);

  // ============ 6 · SECTORS: angled photo mosaic ============
  const rowsY = [62, 114, 166, 218], ph = 49;
  const cells = D.sectors.cards.map((c, k) => { const r = Math.floor(k / 2), col = k % 2, s = ph * SL;
    return { c, k, x: col ? 128 : 18 + s, y0: rowsY[r], y1: rowsY[r] + ph, w: col ? 92 : 78 }; });
  page(T.lb.sectors, `
    ${A(18, 26, 174, `<h2 class="t1">${esc(D.sectors.title)}</h2><p class="tx" style="margin-top:4mm;max-width:150mm">${esc(D.expect.cards[4].text)}.</p>`)}
    ${cells.map((m) => shot(secPhotos[m.k], para(m.x, m.w, m.y0, m.y1), { overlays: [{ pts: [[m.x - 60, m.y1 - 11], [m.x + m.w + 10, m.y1 - 11], [m.x + m.w + 10, m.y1], [m.x - 60, m.y1]], fill: '#1d3a57', op: .82 }] })).join('')}
    ${cells.map((m) => { const s = ph * SL, lx = m.x - s + 11 * SL + 4; return A(lx, m.y1 - 9.2, 70, `<div style="display:flex;align-items:center;gap:2.4mm;color:#fff"><span class="ic" style="width:5.4mm;height:5.4mm;color:#fff"><i data-lucide="${secIcons[m.k]}"></i></span><span style="font-weight:600;font-size:${AR ? 9 : 9.4}pt">${esc(m.c.title)}</span></div>`, 'z-index:3'); }).join('')}`);

  // ============ 7 · SERVICES OVERVIEW ============
  page(T.lb.svc, `
    ${shot(33175651, [[164, 0], [210, 0], [210, 80]], { pos: [.5, .5] })}
    ${A(18, 26, 140, `<h2 class="t1">${esc(D.services.title1)}<br>${esc(D.services.title2)}</h2>`)}
    ${A(18, 62, 140, `<div style="display:flex;align-items:baseline;gap:4mm"><span class="num" style="font-size:44pt">${totalSpec}</span><span class="t2" style="max-width:70mm">${esc(T.across)}</span></div>`)}
    ${A(18, 92, 174, `<div style="border-top:1px solid var(--accent)">${S.map((s, k) => `
      <div style="display:grid;grid-template-columns:11mm 1fr 42mm;gap:5mm;align-items:center;padding:3mm 0;border-bottom:1px solid var(--line)">
        ${ic(svcIcons[k], 10)}
        <div><p class="t3" style="font-size:10.4pt"><span style="color:var(--silver);font-weight:400">${pad(k + 1)}</span>&nbsp; ${esc(s.title)}</p><p class="sm" style="margin-top:.6mm">${esc(s.tagline)}</p></div>
        <div><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="sm" style="font-size:6.8pt">${esc(T.specialised)}</span><b class="num" style="font-size:15pt">${pad(s.list.length)}</b></div>
          <div style="height:1.5mm;background:var(--mist);margin-top:1mm"><div style="height:100%;width:${(s.list.length / maxList) * 100}%;background:var(--accent)"></div></div></div></div>`).join('')}</div>`)}`);

  // ============ 8-11 · SERVICE DETAILS ============
  [[0, 1, 2], [3, 4], [5, 6], [7, 8]].forEach((group) => {
    const c = group.length === 3;
    page(`${T.lb.det} ${pad(group[0] + 1)}–${pad(group[group.length - 1] + 1)}`, A(18, 24, 174, `<div style="display:flex;flex-direction:column;justify-content:space-between;height:250mm">${group.map((k) => { const s = S[k]; return `
      <div style="border-top:1px solid var(--accent);padding-top:${c ? 3.4 : 5}mm">
        <div style="display:flex;gap:4.5mm;align-items:flex-start">${ic(svcIcons[k], c ? 10 : 13)}
          <div style="flex:1"><p class="cap" style="color:var(--silver)">${esc(T.service)} ${pad(k + 1)} / ${pad(S.length)}</p>
            <h3 class="t1" style="font-size:${AR ? (c ? 14 : 16) : (c ? 17 : 21)}pt;margin-top:1mm">${esc(s.title)}</h3>
            <p class="t2" style="font-size:${c ? 9.4 : 10.4}pt;margin-top:1mm">${esc(s.tagline)}</p></div>
          <div style="text-align:end"><p class="num" style="font-size:${c ? 22 : 30}pt">${pad(s.list.length)}</p><p class="sm" style="font-size:6.6pt">${esc(T.specialised)}</p></div></div>
        <p class="tx" style="margin-top:${c ? 2.4 : 3.6}mm;font-size:${c ? 8.2 : 9}pt;line-height:${c ? 1.5 : 1.58}">${esc(s.text[0])}</p>
        <p class="cap" style="margin-top:${c ? 2.6 : 4}mm">${esc(s.listTitle)}</p>
        <ul class="li" style="margin-top:${c ? 1.8 : 2.6}mm;grid-template-columns:repeat(${c ? 3 : 2},1fr);gap:${c ? '.8mm 4mm' : '1.8mm 7mm'}">${s.list.map((li) => `<li style="${c ? 'font-size:7.1pt;line-height:1.3' : ''}">${esc(li)}</li>`).join('')}</ul>
      </div>`; }).join('')}</div>`));
  });

  // ============ 12 · TEAM ============
  page(T.lb.team, `
    ${A(18, 26, 174, `<h2 class="t1" style="font-size:${AR ? 20 : 25}pt">${esc(D.team.title)}</h2>`)}
    ${A(18, 52, 174, `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 9mm;border-top:1px solid var(--accent)">${D.team.people.map((p) => `
      <div style="display:flex;gap:4.5mm;padding:4.6mm 0;border-bottom:1px solid var(--line);height:52mm">
        <img src="/assets/img/${p.thumb || p.photo}.jpg" style="width:22mm;height:28mm;object-fit:cover;object-position:center 15%;flex:0 0 auto">
        <div><p class="t2" style="font-size:9.8pt">${esc(p.name)}</p><p class="cap" style="margin:1mm 0 1.6mm;font-size:6.4pt">${esc(p.role)}</p><p class="sm" style="font-size:7.4pt;line-height:1.48;text-align:justify">${esc(p.line)}</p></div></div>`).join('')}</div>
      <p class="t3" style="margin-top:4mm"><span class="ltr">${esc(T.join)}</span></p>`)}`);

  // ============ 13 · CLIENTS & COMMITMENTS ============
  const logos = EN.clients.logoFiles || [];
  page(T.lb.clients, `
    ${A(18, 26, 174, `<div style="display:flex;justify-content:space-between;align-items:flex-end"><h2 class="t1">${esc(T.clientsT)}</h2><p><span class="num" style="font-size:30pt">${st[2].n}<small>${esc(st[2].suffix)}</small></span></p></div>`)}
    ${A(18, 46, 174, `<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:1.5mm 3mm;border-top:1px solid var(--accent);padding-top:4mm">${logos.map((f) => `<div style="height:15mm;position:relative"><img src="/assets/img/clients/${f}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></div>`).join('')}</div>`)}
    ${A(18, 128, 174, `<h2 class="t1" style="font-size:${AR ? 20 : 24}pt">${esc(T.expectT)}</h2>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0 8mm;margin-top:5mm;border-top:1px solid var(--accent)">${D.expect.cards.map((c, k) => `
        <div style="display:flex;gap:3.4mm;align-items:flex-start;padding:4.4mm 0;border-bottom:1px solid var(--line);min-height:37mm">${ic(expIcons[k], 9)}<p class="sm" style="color:var(--ink);font-size:8.2pt">${esc(c.text)}</p></div>`).join('')}</div>`)}`);

  // ============ 14 · CORPORATE PROFILE: regional dot map + fact table ============
  const M = MENA_MAP, mw = 174, mh = mw * M.h / M.w, kk = mw / M.w;
  const mxm = (x) => AR ? M.w - x : x;
  const dotSvg = `<svg viewBox="0 0 ${M.w} ${M.h}" style="width:${mw}mm;height:${mh}mm;display:block">${M.dots.map(([x, y, t]) => { const fill = t === 'J' || t === 'j' ? '#2f6390' : t === 'm' ? '#9fabb7' : '#d9dee4'; const r = t === 'J' ? .13 : .3; return `<circle cx="${mxm(x)}" cy="${y}" r="${r}" fill="${fill}"/>`; }).join('')}
    <circle cx="${mxm(M.amman[0])}" cy="${M.amman[1]}" r="1.1" fill="none" stroke="#1d3a57" stroke-width=".22"/><circle cx="${mxm(M.amman[0])}" cy="${M.amman[1]}" r=".42" fill="#1d3a57"/></svg>`;
  const ax = mxm(M.amman[0]) * kk, ay = M.amman[1] * kk;
  const facts = [T.firm, T.founded, link('pin'), S.map((s) => s.title).join(' · '), D.hero.certs.slice(0, 5).map((c) => c[0]).join(' · '), D.hero.certs.slice(5).map((c) => c[0]).join(' · '), `${st[2].n}${st[2].suffix} · ${st[2].caption}`, link('phone'), link('mail'), link('globe')];
  page(T.lb.profile, `
    ${A(18, 26, 174, `<h2 class="t1">${esc(T.mapT)}</h2><p class="tx" style="margin-top:3mm">${esc(T.mapS)}</p>`)}
    <div class="abs" style="top:52mm;left:18mm;width:${mw}mm">${dotSvg}
      <div style="position:absolute;left:${AR ? ax - 22 : ax + 4.5}mm;top:${ay + 2.2}mm;font-weight:700;color:var(--navy);font-size:9.5pt;background:var(--paper);padding:0 1.2mm">${esc(T.amman)}</div></div>
    ${A(18, 52 + mh + 6, 174, `<div style="border-top:1px solid var(--accent)">${T.rows.map((r, i) => `
      <div style="display:grid;grid-template-columns:44mm 1fr;gap:6mm;padding:3.6mm 0;border-bottom:1px solid var(--line)"><span class="cap" style="color:var(--ink2)">${esc(r)}</span><span class="sm" style="color:var(--ink)">${i >= 7 ? `<span class="ltr">${esc(facts[i])}</span>` : esc(facts[i])}</span></div>`).join('')}</div>`)}`);

  // ============ 15 · BACK COVER (charcoal, like the reference) ============
  page('', `
    <div style="position:absolute;inset:0;background:var(--char)"></div>
    ${mark('position:absolute;z-index:1;width:150mm;top:40mm;inset-inline-end:-40mm;opacity:.16', '#ffffff')}
    ${A(18, 120, 120, `<img src="/assets/img/icon.png" style="height:24mm;filter:brightness(0) invert(1)"><img src="/profile/img/wordmark-white.png" style="height:9mm;display:block;margin-top:6mm">
      <p style="color:oklch(0.85 0.01 250);font-size:${AR ? 11 : 10.5}pt;margin-top:8mm;line-height:1.6">${esc(D.consult.title1)} ${esc(D.consult.title2)}</p>`)}
    ${A(18, 222, 174, `<div style="display:grid;grid-template-columns:1fr 34mm;gap:10mm;align-items:end;border-top:1px solid oklch(1 0 0 / .2);padding-top:6mm">
      <div style="color:oklch(0.9 0.01 250);font-size:${AR ? 9.4 : 9}pt;line-height:1.85">
        <p style="font-weight:600;color:#fff;font-size:${AR ? 11 : 10.5}pt">${esc(T.firm)}</p><p>${esc(link('pin'))}</p>
        <p><span class="ltr">${esc(link('phone'))}</span>&nbsp;&nbsp;·&nbsp;&nbsp;<span class="ltr">${esc(link('mail'))}</span>&nbsp;&nbsp;·&nbsp;&nbsp;<span class="ltr">${esc(link('globe'))}</span></p></div>
      <div style="background:#fff;padding:2.4mm"><img src="/profile/qr-website.svg" style="width:100%;display:block"></div></div>`)}`, { bare: true });

  // ---------- render ----------
  document.getElementById('doc').innerHTML = pages.map((p, i) => `<section class="page" id="pg${i + 1}">${p.inner}
      ${p.opt.bare ? '' : `<div class="brk">[ ${esc(p.label)} ]</div><div class="pn"><span>${esc(T.firm)}</span><b>${pad(i + 1)}</b></div>`}</section>`).join('');
  lucide.createIcons({ attrs: { 'stroke-width': 1.3 } });

  if (!PRINT) document.getElementById('ui').innerHTML = `<img src="/assets/img/icon.png" alt=""><span class="t">${esc(T.firm)} · ${esc(T.profile)} ${T.year}</span>
    <a href="${T.otherHref}">${esc(T.other)}</a><a href="/profile/Consolidated-Company-Profile-${AR ? 'AR' : 'EN'}.pdf" download>${esc(T.dl)}</a>`;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(() => { window.__profileReady = true; }));
})();
</script>
</body>
</html>
