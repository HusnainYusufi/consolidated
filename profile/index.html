<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Profile – Consolidated</title>
<meta name="description" content="Company profile of Consolidated for Auditing and Financial Consulting, Amman, Jordan.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================================
     EDITORIAL EDITION — white paper, one accent (cobalt), set like a printed annual report.
     Structure comes from type, columns and hairlines; no cards, no icons, no CSS effects that
     PDF viewers mis-draw (no background-clip text, gradient borders, filters or masks).
     ========================================================================================== */
  :root{
    --paper:#faf9f6; --ink:#121418; --grey:#5d626a; --soft:#8b8f95; --hair:#d8d6cf;
    --blue:#2347b8; --blue-d:#1a358f; --on-blue:rgba(255,255,255,.78); --hair-blue:rgba(255,255,255,.28);
    --display:'Instrument Serif',Georgia,serif; --text:'Newsreader',Georgia,serif; --label:'Inter',Arial,sans-serif;
  }
  html[lang="ar"]{ --display:'Amiri',serif; --text:'Noto Naskh Arabic',serif; --label:'IBM Plex Sans Arabic',sans-serif; }
  @page{ size:210mm 297mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:#2a2a2a; color:var(--ink); font-family:var(--text); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html.print body{ background:var(--paper); }
  h1,h2,h3,h4,p,ul,ol{ margin:0; padding:0; font-weight:400; }
  a{ color:inherit; text-decoration:none; }
  img{ display:block; }

  #doc{ width:210mm; margin:0 auto; }
  html:not(.print) #doc{ margin:76px auto 40px; display:flex; flex-direction:column; gap:26px; }
  .page{ position:relative; width:210mm; height:297mm; overflow:hidden; background:var(--paper); page-break-after:always; break-after:page; }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  html:not(.print) .page{ box-shadow:0 24px 70px rgba(0,0,0,.5); }
  .page.blue{ background:var(--blue); color:#fff; }

  /* frame: content area, running head and folio */
  .pad{ position:absolute; inset:24mm 16mm 22mm; display:flex; flex-direction:column; }
  .rh{ position:absolute; top:10mm; inset-inline:16mm; display:flex; justify-content:space-between; padding-bottom:2.4mm; border-bottom:.6pt solid var(--hair); }
  .fo{ position:absolute; bottom:10mm; inset-inline:16mm; display:flex; align-items:baseline; justify-content:space-between; }
  .fo .pn{ font:400 12pt/1 var(--display); }
  .blue .rh{ border-color:var(--hair-blue); }

  /* type */
  .lbl{ font:500 6.4pt/1.3 var(--label); letter-spacing:.17em; text-transform:uppercase; color:var(--grey); }
  html[lang="ar"] .lbl{ letter-spacing:0; font-size:8pt; }
  .blue .lbl{ color:var(--on-blue); }
  .acc{ color:var(--blue); } .blue .acc{ color:#fff; }
  .disp{ font-family:var(--display); font-weight:400; line-height:.98; letter-spacing:-.005em; }
  .it{ font-style:italic; } html[lang="ar"] .it{ font-style:normal; }
  .stand{ font:300 14.5pt/1.38 var(--text); }
  .body{ font:400 9.5pt/1.55 var(--text); color:#2a2d33; hyphens:auto; }
  .blue .body{ color:var(--on-blue); }
  html[lang="ar"] .stand{ font-size:13pt; line-height:1.75; font-weight:400; }
  html[lang="ar"] .body{ font-size:9.2pt; line-height:1.85; }
  .cols{ columns:2; column-gap:8mm; }
  .cols p + p{ margin-top:2.6mm; }
  .hair{ border-top:.6pt solid var(--hair); }
  .blue .hair{ border-color:var(--hair-blue); }
  .dropcap::first-letter{ float:left; font:400 52pt/.78 var(--display); margin:1.4mm 2.6mm 0 0; color:var(--blue); }
  html[lang="ar"] .dropcap::first-letter{ float:none; font:inherit; margin:0; color:inherit; }
  .ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }

  /* images */
  .bleed{ position:absolute; overflow:hidden; } .bleed img{ width:100%; height:100%; object-fit:cover; }

  /* logo */
  .logo{ display:flex; align-items:center; gap:2.6mm; }
  .logo .mark{ height:11mm; } .logo .word{ height:6mm; }
  .logo .ar{ display:none; flex-direction:column; line-height:1.15; font-family:var(--label); }
  .logo .ar b{ font-size:14pt; font-weight:600; } .logo .ar small{ font-size:7.2pt; opacity:.8; }
  html[lang="ar"] .logo .word{ display:none; } html[lang="ar"] .logo .ar{ display:flex; }

  /* chapter opener */
  .ch-no{ font:400 230pt/.74 var(--display); letter-spacing:-.04em; }
  .ch-list{ display:flex; flex-direction:column; gap:1.6mm; margin-top:6mm; }
  .ch-list span{ font:400 10.5pt/1.3 var(--text); color:var(--on-blue); }

  /* contents */
  .toc-row{ display:grid; grid-template-columns:30mm 1fr 14mm; gap:5mm; align-items:start; padding:5.5mm 0; border-top:.6pt solid var(--hair); }
  .toc-row .n{ font:400 46pt/.8 var(--display); color:var(--blue); }
  .toc-row h3{ font:400 21pt/1.05 var(--display); margin-bottom:2.2mm; }
  .toc-row .items{ font:400 9pt/1.5 var(--text); color:var(--grey); }
  .toc-row .pg{ font:400 15pt/1 var(--display); text-align:end; }

  /* numbers */
  .nums{ display:grid; grid-template-columns:1fr 1fr; column-gap:10mm; }
  .num{ padding:5mm 0 6mm; border-top:.6pt solid var(--hair); }
  .num b{ display:block; font:400 74pt/.86 var(--display); color:var(--blue); }
  .num p{ margin-top:3mm; font:400 10pt/1.4 var(--text); color:var(--grey); max-width:70mm; }

  /* values / why / expect lists */
  .grid2{ display:grid; grid-template-columns:1fr 1fr; column-gap:10mm; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); column-gap:7mm; }
  .item{ padding:4.5mm 0 5.5mm; border-top:.6pt solid var(--hair); }
  .item .k{ font:500 6.4pt/1 var(--label); letter-spacing:.16em; color:var(--blue); }
  .item h3{ font:400 21pt/1.05 var(--display); margin:2.6mm 0 2.4mm; }
  .item p{ font:400 9.2pt/1.5 var(--text); color:#2a2d33; }
  html[lang="ar"] .item p{ line-height:1.8; font-size:9pt; }

  /* why: half-blue split */
  .why-panel{ position:absolute; top:0; bottom:0; inset-inline-start:0; width:78mm; background:var(--blue); color:#fff; padding:24mm 10mm 22mm 16mm; display:flex; flex-direction:column; }
  html[dir="rtl"] .why-panel{ padding:24mm 16mm 22mm 10mm; }
  .why-list{ position:absolute; top:24mm; bottom:22mm; inset-inline-start:90mm; inset-inline-end:16mm; display:flex; flex-direction:column; justify-content:space-between; }
  .why-row{ display:grid; grid-template-columns:13mm 1fr; gap:3mm; padding-top:3.6mm; border-top:.6pt solid var(--hair); }
  .why-row .n{ font:400 22pt/.9 var(--display); color:var(--blue); }
  .why-row h3{ font:400 16pt/1.1 var(--display); margin-bottom:1.6mm; }
  .why-row p{ font:400 9pt/1.5 var(--text); color:#2a2d33; }

  /* services index */
  .svc-row{ display:grid; grid-template-columns:14mm 1fr 12mm; gap:4mm; align-items:baseline; padding:3.8mm 0; border-top:.6pt solid var(--hair); }
  .svc-row .n{ font:400 17pt/1 var(--display); color:var(--blue); }
  .svc-row h3{ font:400 16pt/1.1 var(--display); }
  .svc-row p{ font:italic 400 9pt/1.4 var(--text); color:var(--grey); margin-top:1mm; }
  html[lang="ar"] .svc-row p{ font-style:normal; }
  .svc-row .pg{ font:400 12pt/1 var(--display); text-align:end; }

  /* service pages */
  .s-no{ font:400 120pt/.76 var(--display); color:var(--blue); letter-spacing:-.03em; }
  .s-title{ font:400 31pt/1.02 var(--display); }
  .s-tag{ font:italic 300 13.5pt/1.35 var(--text); color:var(--ink); }
  html[lang="ar"] .s-tag{ font-style:normal; font-weight:400; font-size:12pt; line-height:1.7; }
  .spec-head{ display:flex; justify-content:space-between; align-items:baseline; gap:6mm; padding-bottom:2.4mm; }
  .spec{ list-style:none; counter-reset:sp; }
  .spec li{ counter-increment:sp; display:grid; grid-template-columns:8mm 1fr; gap:2mm; padding:1.75mm 0; border-top:.6pt solid var(--hair); font:400 9.2pt/1.32 var(--text); break-inside:avoid; }
  .spec li::before{ content:counter(sp, decimal-leading-zero); font:500 6.2pt/1.9 var(--label); letter-spacing:.08em; color:var(--blue); }
  .spec.two{ columns:2; column-gap:8mm; }
  .spec.tight li{ padding:1.35mm 0; font-size:8.8pt; }

  /* leadership */
  .lead-ph{ position:absolute; top:0; bottom:0; width:86mm; overflow:hidden; background:#000; }
  .lead-ph img{ width:100%; height:100%; object-fit:cover; object-position:center 12%; }
  .lead-tx{ position:absolute; top:24mm; bottom:22mm; display:flex; flex-direction:column; }
  .creds{ font:500 7.4pt/1 var(--label); letter-spacing:.18em; color:var(--blue); }
  .lead-tx .bio p{ font:400 9.8pt/1.58 var(--text); color:#2a2d33; }
  .lead-tx .bio p + p{ margin-top:2.8mm; }
  html[lang="ar"] .lead-tx .bio p{ font-size:9.4pt; line-height:1.85; }
  .ct-mini{ display:grid; grid-template-columns:1fr 1fr; gap:3mm 8mm; padding-top:4mm; border-top:.6pt solid var(--hair); }
  .ct-mini span{ display:block; font:400 9.6pt/1.35 var(--text); margin-top:1mm; }
  .ct-mini span.lbl{ font:500 6.4pt/1.3 var(--label); margin-top:0; }

  /* team masthead */
  .team{ display:grid; grid-template-columns:repeat(4,1fr); column-gap:5mm; row-gap:8mm; }
  .member .ph{ aspect-ratio:1; overflow:hidden; background:#111; }
  .member .ph img{ width:100%; height:100%; object-fit:cover; }
  .member h3{ font:400 13pt/1.1 var(--display); margin-top:3mm; }
  .member .role{ display:block; font:italic 400 8.6pt/1.3 var(--text); color:var(--blue); margin:.8mm 0 1.6mm; }
  html[lang="ar"] .member .role{ font-style:normal; }
  .member p{ font:400 7.8pt/1.45 var(--text); color:var(--grey); }

  /* sectors */
  .sec{ display:grid; grid-template-columns:24mm 1fr; gap:4mm; align-items:center; padding:3.4mm 0; border-top:.6pt solid var(--hair); }
  .sec .th{ aspect-ratio:1; overflow:hidden; } .sec .th img{ width:100%; height:100%; object-fit:cover; }
  .sec .k{ font:500 6.2pt/1 var(--label); letter-spacing:.16em; color:var(--blue); }
  .sec h3{ font:400 15pt/1.1 var(--display); margin-top:1.6mm; }

  /* clients: a ruled table of logos */
  .logos{ display:grid; grid-template-columns:repeat(6,1fr); border-top:.6pt solid var(--hair); border-inline-start:.6pt solid var(--hair); }
  .logos div{ position:relative; aspect-ratio:4/3; border-bottom:.6pt solid var(--hair); border-inline-end:.6pt solid var(--hair); background:#fff; }
  .logos img{ position:absolute; inset:18% 14%; width:72%; height:64%; object-fit:contain; mix-blend-mode:multiply; }

  /* back cover */
  .ct-row{ display:block; padding:3mm 0; border-top:.6pt solid var(--hair-blue); }
  .ct-row span{ display:block; font:400 11pt/1.35 var(--text); margin-top:1.2mm; }
  .ct-row span.lbl{ font:500 6.4pt/1.3 var(--label); margin-top:0; }
  .qr{ display:block; background:#fff; padding:3.2mm; width:38mm; color:var(--ink); }
  .qr img{ width:100%; } .qr p{ font:500 5.8pt/1.3 var(--label); letter-spacing:.12em; text-transform:uppercase; text-align:center; margin-top:1.8mm; }

  /* screen chrome */
  .ui{ position:fixed; z-index:50; top:0; left:0; right:0; height:56px; display:flex; align-items:center; gap:14px; padding:0 20px; background:rgba(20,20,20,.9); backdrop-filter:blur(10px); font-family:'Inter',sans-serif; }
  html.print .ui{ display:none; }
  .ui img{ height:28px; } .ui .t{ flex:1; font-size:13px; letter-spacing:.04em; color:rgba(255,255,255,.8); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ui a{ font-size:13px; color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:99px; padding:7px 15px; white-space:nowrap; }
  .ui a.pri{ background:#fff; color:#111; border-color:#fff; font-weight:500; }
  @media (max-width:700px){ .ui .t{ display:none; } }
</style>
</head>
<body>
<div class="ui" id="ui"></div>
<div id="doc"></div>
<script src="/assets/js/i18n.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'ar' ? 'ar' : 'en', AR = lang === 'ar', PRINT = q.has('print');
  const D = I18N[lang], EN = I18N.en, H = document.documentElement;
  H.lang = lang; H.dir = AR ? 'rtl' : 'ltr'; if (PRINT) H.classList.add('print');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad2 = (i) => String(i).padStart(2, '0');
  const sky = (n) => `/assets/img/sky-${n}.jpg`, duo = (n) => `/profile/img/duo-${n}.jpg`;
  const skyOf = (img) => sky(String(img).replace('sky-', ''));

  const T = AR ? {
    profile: 'الملف التعريفي 2026', firm: 'الموحدة لتدقيق الحسابات والاستشارات المالية', since: 'تأسست 2015 · عمّان، الأردن',
    contents: 'المحتويات', chapter: 'الفصل', ch: ['من نحن', 'ما نقدمه', 'فريقنا', 'من يثق بنا'], vm: 'الرؤية والمهمة',
    numbers: 'بالأرقام', glance: 'لمحة سريعة', founded: 'سنة التأسيس', lines: 'خطوط خدمات متكاملة تحت سقف واحد',
    specialisedAll: 'خدمة متخصصة عبر جميع الممارسات', people: 'مهنيون مؤهلون في فريقنا', service: 'الخدمة', specialised: 'خدمة متخصصة',
    svcLead: 'تسع ممارسات متكاملة تحت سقف واحد، يقودها مهنيون معتمدون دولياً، ترافق عملك من التأسيس إلى النمو والتحول.',
    leadership: 'القيادة', address: 'العنوان', phone: 'الهاتف', email: 'البريد الإلكتروني',
    website: 'الموقع الإلكتروني', scan: 'امسح الرمز لزيارة موقعنا', motto: 'نزاهة • شفافية • جودة', dl: 'تحميل PDF', other: 'English', otherHref: '?lang=en'
  } : {
    profile: 'Company Profile 2026', firm: 'Consolidated for Auditing and Financial Consulting', since: 'Est. 2015 · Amman, Jordan',
    contents: 'Contents', chapter: 'Chapter', ch: ['Who We Are', 'What We Do', 'Our People', 'Who Trusts Us'], vm: 'Vision & Mission',
    numbers: 'In Numbers', glance: 'At a glance', founded: 'Year of establishment', lines: 'Integrated service lines under one roof',
    specialisedAll: 'Specialised services across our practices', people: 'Qualified professionals in our team', service: 'Service', specialised: 'specialised services',
    svcLead: 'Nine integrated practices under one roof, led by internationally certified professionals, supporting your business from formation to growth and transformation.',
    leadership: 'Leadership', address: 'Address', phone: 'Phone', email: 'Email',
    website: 'Website', scan: 'Scan to visit our website', motto: 'Integrity • Transparency • Quality', dl: 'Download PDF', other: 'العربية', otherHref: '?lang=ar'
  };
  const logo = (white) => `<div class="logo"><img class="mark" src="/assets/img/icon.png" alt=""><img class="word" src="${white ? '/profile/img/wordmark-white.png' : '/assets/img/wordmark.png'}" alt=""><div class="ar"><b>الموحدة</b><small>لتدقيق الحسابات والاستشارات المالية</small></div></div>`;
  const contact = D.footer.cols.find((c) => (c.links || []).some((l) => l[3] === 'phone')).links;
  const pick = (k) => (contact.find((l) => l[3] === k) || [''])[0];
  const stripNum = (s) => String(s).replace(/^(أكثر من\s*)?\d+\+?\s*/, '');
  const st = (k) => D.stats.find((s) => s.icon === k) || {};

  // ---------- page model ----------
  const pages = [], anchor = {};
  const mark = (k) => { anchor[k] = pages.length + 1; };
  const page = (inner, o = {}) => pages.push(Object.assign({ inner, cls: '', head: true, foot: true, section: '' }, o));
  const title = (lbl, html, size = 52) => `<div class="lbl">${esc(lbl)}</div><h2 class="disp" style="font-size:${size}pt;margin-top:4mm">${html}</h2>`;

  const opener = (n, key, img, standfirst, items) => {
    mark(key);
    const side = n % 2 ? 'inset-inline-end:0' : 'inset-inline-start:0';
    const padSide = n % 2 ? 'inset-inline-end:92mm' : 'inset-inline-start:92mm';
    page(`<div class="bleed" style="top:0;bottom:0;width:80mm;${side}"><img src="${duo(img)}"></div>
      <div class="pad" style="${padSide}">
        <div class="lbl">${esc(T.chapter)} ${pad2(n)}</div>
        <div class="ch-no" style="margin-top:8mm">${pad2(n)}</div>
        <div style="margin-top:auto">
          <h2 class="disp" style="font-size:50pt">${esc(T.ch[n - 1])}</h2>
          <p class="stand" style="margin-top:6mm;color:#fff">${esc(standfirst)}</p>
          <div class="ch-list hair" style="padding-top:5mm">${items.map((t) => `<span>${esc(t)}</span>`).join('')}</div>
        </div>
      </div>`, { cls: 'blue', head: false, foot: false });
  };

  // 1 · Cover
  page(`<div class="bleed" style="inset:0"><img src="${duo(1)}" style="object-position:center 30%"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,38,110,.15) 30%, rgba(14,28,90,.85) 78%, rgba(14,28,90,.95))"></div>
    <div class="pad" style="inset:16mm 16mm 16mm">
      ${logo(true)}
      <div style="margin-top:auto">
        <div class="lbl">${esc(T.profile)}</div>
        <h1 class="disp" style="font-size:88pt;margin:6mm 0 8mm;line-height:.92">${String(D.footer.motto).split('•').map((w, i) => `<span style="display:block" class="${i === 1 ? 'it' : ''}">${esc(w.trim())}</span>`).join('')}</h1>
        <p class="stand" style="max-width:150mm;color:var(--on-blue);font-size:12.5pt">${esc(D.hero.sub)}</p>
        <div class="hair" style="margin-top:10mm;padding-top:4mm;display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:6mm">
          <span class="lbl">${esc(T.firm)}</span><span class="lbl">${esc(T.since)}</span><span class="lbl" style="text-align:end"><span class="ltr">www.caudit.net</span></span>
        </div>
      </div>
    </div>`, { cls: 'blue', head: false, foot: false });

  // 2 · Contents
  const toc = [
    ['c1', [D.intro.title, T.numbers, T.vm, `${D.values.title1} ${D.values.title2}`, `${D.why.title1} ${D.why.title2}`]],
    ['c2', [D.services.heading, `${D.services.items.length} ${T.lines}`]],
    ['c3', [D.leaders.title, D.team.title]],
    ['c4', [D.sectors.title, D.clients.title, `${D.expect.t1} ${D.expect.t2} ${D.expect.t3}`]]
  ];
  page(`<div class="pad">
      ${title(T.profile, esc(T.contents), 60)}
      <p class="stand it" style="margin:7mm 0 10mm;max-width:130mm;color:var(--grey)">${esc(D.consult.title1)} ${esc(D.consult.title2)}</p>
      <div>${toc.map(([k, items], i) => `<a class="toc-row" href="%%L:${k}%%"><span class="n">${pad2(i + 1)}</span>
        <div><h3>${esc(T.ch[i])}</h3><p class="items">${items.map(esc).join(' · ')}</p></div><span class="pg">%%${k}%%</span></a>`).join('')}</div>
      <div style="flex:1;min-height:40mm;margin-top:9mm;display:grid;grid-template-columns:1.4fr 1fr;gap:6mm;align-items:end">
        <div style="height:100%;overflow:hidden"><img src="${sky(3)}" style="width:100%;height:100%;object-fit:cover"></div>
        <p class="lbl" style="line-height:1.7">${esc(T.firm)}<br>${esc(T.since)}</p>
      </div>
    </div>`, { section: T.contents });

  // ===== Chapter 1 =====
  opener(1, 'c1', 2, D.expect.cards[0].text, toc[0][1]);

  // About
  page(`<div class="pad" style="bottom:150mm">
      ${title(T.ch[0], `<span class="it">${esc(D.intro.title)}</span>`, 60)}
      <p class="stand dropcap" style="margin-top:8mm;font-size:13.2pt;line-height:1.5">${esc(D.intro.p1)}</p>
    </div>
    <div class="bleed" style="left:0;right:0;bottom:0;height:140mm"><img src="${sky(5)}" style="object-position:center 45%"></div>`, { section: T.ch[0], foot: false });

  // In numbers
  const nums = [
    [st('founded').n, T.founded],
    [`${st('years').n}${st('years').suffix || ''}`, stripNum(st('years').caption)],
    [`${st('clients').n}${st('clients').suffix || ''}`, stripNum(st('clients').caption)],
    [D.services.items.length, T.lines],
    [D.services.items.reduce((a, s) => a + s.list.length, 0), T.specialisedAll],
    [D.team.people.length, T.people]
  ];
  page(`<div class="pad">
      ${title(T.glance, `<span class="it">${esc(T.numbers)}</span>`, 60)}
      <div class="nums" style="margin-top:12mm">${nums.map(([n, c]) => `<div class="num"><b>${esc(n)}</b><p>${esc(c)}</p></div>`).join('')}</div>
      <div class="hair" style="margin-top:auto;padding-top:5mm;display:flex;justify-content:space-between;align-items:baseline;gap:8mm">
        <p class="disp it" style="font-size:24pt">${esc(st('location').caption)}</p><span class="lbl">${esc(T.since)}</span>
      </div>
    </div>`, { section: T.ch[0] });

  // Vision & Mission
  page(`<div class="bleed" style="top:0;bottom:0;width:58mm;inset-inline-end:0"><img src="${sky(6)}" style="object-position:40% center"></div>
    <div class="pad" style="inset-inline-end:72mm">
      <div class="lbl">${esc(T.vm)}</div>
      ${[D.vision, D.mission].map((v, i) => `<div style="${i ? 'margin-top:auto;' : 'margin-top:10mm;'}" class="${i ? 'hair' : ''}">
        <h2 class="disp it" style="font-size:46pt;${i ? 'margin-top:8mm' : ''}">${esc(v.title)}</h2>
        <p class="stand" style="margin-top:5mm;font-size:13.5pt">${esc(v.text)}</p>
        <p class="lbl acc" style="margin-top:5mm">${esc(v.tag)}</p></div>`).join('')}
      <div style="height:6mm"></div>
    </div>`, { section: T.ch[0], frame: ['16mm', '72mm'] });

  // Core values
  page(`<div class="pad">
      ${title(D.values.kicker, `${esc(D.values.title1)} <span class="it">${esc(D.values.title2)}</span>`, 54)}
      <p class="stand" style="margin-top:6mm;font-size:12.5pt;color:var(--grey)">${esc(D.values.sub)}</p>
      <div class="grid2" style="margin-top:auto">${D.values.cards.map((c, i) => `<div class="item"><span class="k">${pad2(i + 1)}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join('')}</div>
    </div>`, { section: T.ch[0] });

  // Why choose us (half blue)
  page(`<div class="why-panel">
      <div class="lbl">${esc(T.ch[0])}</div>
      <h2 class="disp" style="font-size:44pt;margin-top:4mm">${esc(D.why.title1)}<br><span class="it">${esc(D.why.title2)}</span></h2>
      <p class="body" style="margin-top:auto;font-size:10.4pt;color:#fff">${esc(D.why.intro)}</p>
    </div>
    <div class="why-list">${D.why.items.map((w, i) => `<div class="why-row"><span class="n">${pad2(i + 1)}</span><div><h3>${esc(w.title)}</h3><p>${esc(w.text)}</p></div></div>`).join('')}</div>`,
    { section: T.ch[0], head: false, frame: ['90mm', '16mm'] });

  // ===== Chapter 2 =====
  opener(2, 'c2', 4, T.svcLead, toc[1][1]);

  // Services index
  page(`<div class="pad">
      ${title(T.ch[1], `<span class="it">${esc(D.services.heading)}</span>`, 60)}
      <p class="stand" style="margin:6mm 0 9mm;max-width:150mm">${esc(T.svcLead)}</p>
      <div style="margin-top:auto">${D.services.items.map((s, i) => `<a class="svc-row" href="%%L:s${i}%%"><span class="n">${pad2(i + 1)}</span>
        <div><h3>${esc(s.title)}</h3><p>${esc(s.tagline)}</p></div><span class="pg">%%s${i}%%</span></a>`).join('')}</div>
    </div>`, { section: T.ch[1] });

  // One page per service, alternating two layouts
  D.services.items.forEach((s, i) => {
    mark('s' + i);
    const long = s.list.length > 12;
    const head = `<div class="lbl">${esc(T.service)} ${pad2(i + 1)} / ${pad2(D.services.items.length)}</div>`;
    const list = (two) => `<div class="spec-head hair" style="padding-top:3mm"><p class="disp it" style="font-size:14pt">${esc(s.listTitle)}</p><span class="lbl acc" style="white-space:nowrap">${pad2(s.list.length)} ${esc(T.specialised)}</span></div>
      <ol class="spec ${two ? 'two' : ''} ${long ? 'tight' : ''}">${s.list.map((li) => `<li><span>${esc(li)}</span></li>`).join('')}</ol>`;
    if (i % 2 === 0) {
      page(`<div class="bleed" style="top:0;left:0;right:0;height:78mm"><img src="${skyOf(s.img)}" style="object-position:center 45%"></div>
        <div class="pad" style="top:88mm">
          <div style="display:grid;grid-template-columns:44mm 1fr;gap:6mm;align-items:end">
            <span class="s-no">${pad2(i + 1)}</span>
            <div>${head}<h2 class="s-title" style="margin-top:3mm">${esc(s.title)}</h2></div>
          </div>
          <p class="s-tag" style="margin-top:6mm">${esc(s.tagline)}</p>
          <div class="body cols" style="margin-top:5mm">${s.text.slice(0, long ? 1 : 2).map((p) => `<p>${esc(p)}</p>`).join('')}</div>
          <div style="margin-top:auto">${list(true)}</div>
        </div>`, { section: T.ch[1], head: false });
    } else {
      page(`<div class="bleed" style="top:0;bottom:0;width:62mm;inset-inline-start:0"><img src="${skyOf(s.img)}" style="object-position:center"></div>
        <div class="pad" style="inset-inline-start:76mm">
          <span class="s-no">${pad2(i + 1)}</span>
          <div style="margin-top:6mm">${head}<h2 class="s-title" style="margin-top:3mm">${esc(s.title)}</h2></div>
          <p class="s-tag" style="margin-top:5mm">${esc(s.tagline)}</p>
          <div class="body" style="margin-top:5mm"><p>${esc(s.text[0])}</p></div>
          <div style="margin-top:auto">${list(false)}</div>
        </div>`, { section: T.ch[1], frame: ['76mm', '16mm'] });
    }
  });

  // ===== Chapter 3 =====
  opener(3, 'c3', 5, D.expect.cards[2].text, toc[2][1]);

  // Leadership: one portrait-led page per leader, alternating sides
  D.leaders.people.forEach((p, i) => {
    const start = i % 2 === 0;
    const mail = (p.contact.find((c) => (c.href || '').startsWith('mailto:')) || {}).value || '';
    const tel = (p.contact.find((c) => (c.href || '').startsWith('tel:')) || {}).value || '';
    page(`<div class="lead-ph" style="${start ? 'inset-inline-start:0' : 'inset-inline-end:0'}"><img src="/profile/img/${p.photo}-bw.jpg"></div>
      <div class="lead-tx" style="${start ? 'inset-inline-start:98mm;inset-inline-end:16mm' : 'inset-inline-start:16mm;inset-inline-end:98mm'}">
        <div class="lbl">${esc(T.leadership)}</div>
        <h2 class="disp" style="font-size:40pt;margin-top:5mm">${esc(p.name)}</h2>
        <p class="lbl acc" style="margin-top:4mm">${esc(p.role)}</p>
        ${p.certs.length ? `<p class="creds" style="margin-top:4mm"><span class="ltr">${p.certs.map(esc).join(' · ')}</span></p>` : ''}
        <p class="body it" style="margin-top:4mm;color:var(--grey)">${esc(p.degree)}</p>
        <div class="bio hair" style="margin-top:6mm;padding-top:5mm">${p.bio.map((b, k) => k === 0 ? `<p class="stand" style="font-size:12.5pt;color:var(--ink)">${esc(b)}</p>` : `<p>${esc(b)}</p>`).join('')}</div>
        <div class="ct-mini" style="margin-top:auto"><div><span class="lbl">${esc(T.email)}</span><span class="ltr">${esc(mail)}</span></div><div><span class="lbl">${esc(T.phone)}</span><span class="ltr">${esc(tel)}</span></div></div>
      </div>`, { section: T.ch[2], head: false, frame: start ? ['98mm', '16mm'] : ['16mm', '98mm'] });
  });

  // Team masthead
  const teamImg = ['esam', 'abdelhadi', 'masoud', 'hamdan', 'alfares', 'abuhejleh', 'lojen'];
  page(`<div class="pad">
      ${title(T.ch[2], `<span class="it">${esc(D.team.title)}</span>`, 36)}
      <p class="stand" style="margin-top:6mm;max-width:150mm;color:var(--grey);font-size:12.5pt">${esc(D.expect.cards[2].text)}</p>
      <div class="team" style="margin-top:auto">${D.team.people.map((p, i) => `<div class="member"><div class="ph"><img src="/profile/img/team-${teamImg[i]}.jpg"></div>
        <h3>${esc(p.name)}</h3><span class="role">${esc(p.role)}</span><p>${esc(p.line)}</p></div>`).join('')}</div>
    </div>`, { section: T.ch[2] });

  // ===== Chapter 4 =====
  opener(4, 'c4', 6, D.expect.cards[1].text, toc[3][1]);

  // Sectors
  page(`<div class="pad">
      ${title(T.ch[3], `<span class="it">${esc(D.sectors.title)}</span>`, 56)}
      <div style="display:grid;grid-template-columns:auto 1fr;gap:8mm;align-items:end;margin-top:8mm">
        <b class="disp acc" style="font-size:96pt;line-height:.78;font-weight:400">${esc(st('clients').n)}${esc(st('clients').suffix || '')}</b>
        <p class="stand" style="font-size:12.5pt;color:var(--grey)">${esc(D.expect.cards[4].text)}</p>
      </div>
      <div class="grid2" style="margin-top:auto">${D.sectors.cards.map((c, i) => `<div class="sec"><div class="th"><img src="${skyOf(c.img)}"></div><div><span class="k">${pad2(i + 1)}</span><h3>${esc(c.title)}</h3></div></div>`).join('')}</div>
    </div>`, { section: T.ch[3] });

  // Clients
  page(`<div class="pad">
      ${title(T.ch[3], `<span class="it">${esc(D.clients.title)}</span>`, 56)}
      <p class="stand" style="margin-top:6mm;max-width:150mm;color:var(--grey)">${esc(D.expect.cards[1].text)}</p>
      <div class="logos" style="margin-top:auto">${(EN.clients.logoFiles || []).map((f) => `<div><img src="/assets/img/clients/${f}"></div>`).join('')}</div>
    </div>`, { section: T.ch[3] });

  // What you can expect
  page(`<div class="pad">
      ${title(T.ch[3], `<span class="it">${esc(D.expect.t1)} ${esc(D.expect.t2)}</span> ${esc(D.expect.t3)}`, 48)}
      <div class="grid3" style="margin-top:auto">${D.expect.cards.map((c, i) => `<div class="item" style="min-height:62mm"><span class="k">${pad2(i + 1)}</span><p class="disp" style="font-size:16pt;line-height:1.18;margin-top:3mm;color:var(--ink)">${esc(c.text)}</p></div>`).join('')}</div>
    </div>`, { section: T.ch[3] });

  // Back cover
  page(`<div class="bleed" style="top:0;left:0;right:0;height:120mm"><img src="${duo(7)}" style="object-position:center 40%"></div>
    <div style="position:absolute;top:60mm;left:0;right:0;height:60mm;background:linear-gradient(180deg, rgba(35,71,184,0), var(--blue))"></div>
    <div class="pad" style="inset:16mm 16mm 16mm">
      ${logo(true)}
      <div style="margin-top:auto">
        <h2 class="disp" style="font-size:50pt">${esc(D.consult.title1)}<br><span class="it">${esc(D.consult.title2)}</span></h2>
        <p class="stand" style="margin-top:6mm;font-size:12pt;color:var(--on-blue);max-width:150mm">${esc(D.consult.sub)}</p>
        <div style="display:grid;grid-template-columns:1fr auto;gap:10mm;align-items:end;margin-top:10mm">
          <div class="grid2" style="column-gap:8mm">
            <a class="ct-row" href="${esc((contact.find((l) => l[3] === 'map') || [])[1] || '#')}"><span class="lbl">${esc(T.address)}</span><span>${esc(pick('pin'))}</span></a>
            <a class="ct-row" href="tel:${esc(pick('phone').replace(/\s+/g, ''))}"><span class="lbl">${esc(T.phone)}</span><span class="ltr">${esc(pick('phone'))}</span></a>
            <a class="ct-row" href="mailto:${esc(pick('mail'))}"><span class="lbl">${esc(T.email)}</span><span class="ltr">${esc(pick('mail'))}</span></a>
            <a class="ct-row" href="https://www.caudit.net"><span class="lbl">${esc(T.website)}</span><span class="ltr">${esc(pick('globe'))}</span></a>
          </div>
          <a class="qr" href="https://www.caudit.net"><img src="/profile/qr-website.svg" alt=""><p>${esc(T.scan)}</p></a>
        </div>
        <div class="hair" style="margin-top:8mm;padding-top:4mm;display:flex;justify-content:space-between"><span class="lbl">${esc(T.motto)}</span><span class="lbl">${esc(T.firm)}</span></div>
      </div>
    </div>`, { cls: 'blue', head: false, foot: false });

  // ---------- render ----------
  let out = pages.map((p, i) => {
    const fr = p.frame ? ` style="inset-inline-start:${p.frame[0]};inset-inline-end:${p.frame[1]}"` : '';
    const rh = p.head ? `<div class="rh"${fr}><span class="lbl">${esc(T.firm)}</span><span class="lbl">${esc(p.section)}</span></div>` : '';
    const fo = p.foot ? `<div class="fo"${fr}><span class="lbl">${esc(T.profile)}</span><span class="pn">${pad2(i + 1)}</span></div>` : '';
    return `<section class="page ${p.cls}" id="pg${i + 1}">${p.inner}${rh}${fo}</section>`;
  }).join('');
  out = out.replace(/%%L:(\w+)%%/g, (_, k) => '#pg' + (anchor[k] || 1)).replace(/%%(\w+)%%/g, (_, k) => pad2(anchor[k] || 0));
  const doc = document.getElementById('doc');
  doc.innerHTML = out;

  if (!PRINT) {
    document.getElementById('ui').innerHTML = `<img src="/assets/img/icon.png" alt=""><span class="t">${esc(T.firm)} · ${esc(T.profile)}</span>
      <a href="${T.otherHref}">${esc(T.other)}</a><a class="pri" href="/profile/Consolidated-Company-Profile-${AR ? 'AR' : 'EN'}.pdf" download>${esc(T.dl)}</a>`;
    const fit = () => { doc.style.zoom = Math.min(1.25, (window.innerWidth - 32) / 794); };
    fit(); window.addEventListener('resize', fit);
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(() => { window.__profileReady = true; }));
})();
</script>
</body>
</html>
