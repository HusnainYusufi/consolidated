<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Profile – Consolidated</title>
<meta name="description" content="Company profile of Consolidated for Auditing and Financial Consulting, Amman, Jordan.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;600&family=Aref+Ruqaa:wght@400;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============ THEME: ink · ivory · brass, teal accent ============ */
  :root{
    --navy:#0f1f29; --navy2:#16303c; --deep:#0a161d; --paper:#f6f2ea; --sand:#ece5d8; --ink:#14181b; --ink2:#5a5f63;
    --line:rgba(20,24,27,.12); --white:#f8f5ee; --mute:rgba(248,245,238,.72);
    --cyan:#5fd0c1; --blue:#1f7f86; --brass:#c79d5d; --brass2:#e5c48d; --red:#c4472f; --red2:#e0745c;
    --grad:linear-gradient(100deg,#5fd0c1,#2f8a9a 50%,#c79d5d);
    --head:'Instrument Serif',Georgia,serif; --body:'Roboto',Arial,sans-serif;
  }
  html[lang="ar"]{ --head:'Amiri','Noto Naskh Arabic',serif; --body:'IBM Plex Sans Arabic','Segoe UI',sans-serif; }
  @page{ size:210mm 297mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:var(--body); font-weight:300; -webkit-print-color-adjust:exact; print-color-adjust:exact; background:#0a161d; }
  html.print body{ background:#fff; }
  h1,h2,h3,h4{ font-family:var(--head); font-weight:400; margin:0; line-height:1.04; }
  p{ margin:0; }
  .it{ font-style:italic; } html[lang="ar"] .it{ font-style:normal; }
  .ac{ color:var(--blue); } .dark .ac{ color:var(--brass2); }

  #doc{ margin:0 auto; width:210mm; }
  html:not(.print) #doc{ box-shadow:0 0 60px rgba(0,0,0,.5); }
  .page{ position:relative; width:210mm; height:297mm; overflow:hidden; page-break-after:always; break-after:page; background:var(--paper); color:var(--ink); }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  .page.dark{ background:var(--navy); color:var(--white); }
  .page.sand{ background:var(--sand); }
  .page.ledger{ background-image:repeating-linear-gradient(180deg, transparent 0 8.2mm, rgba(20,24,27,.045) 8.2mm 8.4mm); }
  .pad{ position:absolute; inset:16mm 16mm 22mm; }
  .z{ position:relative; z-index:2; }
  .pad, .dv-body, .sv-body, .svb-body, .why-body, .vm-in, .vm-bottom, .foot, .est, .sv-badge { z-index:2; }

  /* golden thread */
  svg.thread{ position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; overflow:visible; }

  /* footer: chapter tracker + next teaser */
  .foot{ position:absolute; left:16mm; right:16mm; bottom:9mm; display:flex; align-items:center; gap:4mm; font-size:6.8pt; letter-spacing:.18em; text-transform:uppercase; color:var(--ink2); }
  html[lang="ar"] .foot{ letter-spacing:0; font-size:8pt; }
  .dark .foot{ color:var(--mute); }
  .foot .trk{ display:flex; gap:1.4mm; align-items:center; }
  .foot .trk i{ width:5mm; height:1.6px; background:currentColor; opacity:.3; }
  .foot .trk i.on{ opacity:1; background:var(--brass); width:9mm; height:2px; }
  .foot .chn{ font-weight:600; }
  .foot .bar{ flex:1; height:1px; background:currentColor; opacity:.2; }
  .foot .nx{ display:flex; align-items:center; gap:1.5mm; }
  .foot .nx svg{ width:3.4mm; height:3.4mm; color:var(--brass); }
  html[dir="rtl"] .foot .nx svg{ transform:scaleX(-1); }
  .foot .pn{ font-family:var(--head); font-size:12pt; letter-spacing:0; color:var(--brass); }

  .kicker{ display:inline-flex; align-items:center; gap:3mm; font-size:7.6pt; letter-spacing:.3em; text-transform:uppercase; font-weight:600; color:var(--blue); }
  html[lang="ar"] .kicker{ letter-spacing:0; font-size:9.5pt; }
  .kicker::before{ content:""; width:9mm; height:2px; background:var(--brass); flex:0 0 auto; }
  .dark .kicker, .kicker.light{ color:var(--brass2); }
  .h2{ font-size:36pt; }
  .lead{ font-size:11.6pt; line-height:1.62; }
  .txt{ font-size:9.6pt; line-height:1.62; color:var(--ink2); }
  .dark .txt{ color:var(--mute); }
  .img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .gradbar{ height:2px; background:var(--grad); }
  .swirl{ position:absolute; pointer-events:none; }

  .ib{ width:13mm; height:13mm; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; color:var(--blue);
       background:linear-gradient(#fff,#fff) padding-box, var(--grad) border-box; border:1.4px solid transparent; }
  .ib svg{ width:6mm; height:6mm; }
  .dark .ib, .ib.on-dark{ color:var(--brass2); background:linear-gradient(var(--navy),var(--navy)) padding-box, var(--grad) border-box; }
  .chip{ display:inline-flex; align-items:center; gap:1.6mm; border:1px solid var(--line); border-radius:99px; padding:1.3mm 3.4mm; font-size:7.8pt; background:rgba(255,255,255,.6); }
  .chip svg{ width:3.6mm; height:3.6mm; color:var(--blue); }
  .dark .chip{ border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.05); }
  .dark .chip svg{ color:var(--brass2); }
  .badge{ display:inline-block; border:1px solid currentColor; border-radius:99px; padding:.8mm 2.8mm; font-size:7.4pt; font-weight:600; letter-spacing:.1em; }
  .ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }

  .logo{ display:flex; align-items:center; gap:3.5mm; }
  .logo .icon{ height:15mm; } .logo .word{ height:9mm; filter:invert(1) brightness(1.15); }
  .logo .ar-word{ display:none; flex-direction:column; line-height:1.1; }
  .logo .ar-word b{ font-size:16pt; font-weight:600; } .logo .ar-word small{ font-size:8pt; opacity:.8; }
  html[lang="ar"] .logo .word{ display:none; } html[lang="ar"] .logo .ar-word{ display:flex; }

  /* COVER */
  .cv-shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,22,29,.35), rgba(10,22,29,.1) 30%, rgba(10,22,29,.85) 64%, var(--deep)); }
  .cv-words{ font-family:var(--head); font-size:60pt; line-height:.98; }
  .cv-words div{ display:flex; align-items:center; gap:5mm; overflow:hidden; }
  .cv-words .tick{ width:11mm; height:11mm; border-radius:50%; background:var(--brass); display:grid; place-items:center; color:var(--deep); flex:0 0 auto; }
  .cv-words .tick svg{ width:6mm; height:6mm; stroke-width:2.6; }
  html:not([lang="ar"]) .cv-words div:nth-child(2) span:last-child{ font-style:italic; color:var(--brass2); }

  /* CONTENTS */
  .ch-row{ display:grid; grid-template-columns:44mm 14mm 1fr; gap:5mm; align-items:center; padding:5mm 0; border-bottom:1px solid var(--line); }
  .ch-thumb{ position:relative; height:30mm; border-radius:4mm; overflow:hidden; }
  .ch-num{ font-family:var(--head); font-size:30pt; color:var(--brass); line-height:1; }
  .ch-row h3{ font-size:20pt; margin-bottom:2mm; }
  .ch-items{ display:flex; flex-wrap:wrap; gap:1mm 5mm; font-size:8.4pt; color:var(--ink2); }
  .ch-items span b{ font-weight:600; color:var(--ink); margin-inline-start:1.2mm; font-family:var(--head); font-size:10pt; }

  /* DIVIDER */
  .dv-shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,22,29,.25) 10%, rgba(10,22,29,.55) 45%, rgba(10,22,29,.96)); }
  .dv-no{ position:absolute; top:12mm; inset-inline-end:12mm; font-family:var(--head); font-size:230pt; line-height:.8; color:transparent; -webkit-text-stroke:1.2px rgba(229,196,141,.75); }
  .dv-body{ position:absolute; left:16mm; right:16mm; bottom:28mm; color:#fff; }
  .dv-title{ font-size:58pt; margin:5mm 0 9mm; }
  .dv-quote{ display:flex; gap:4mm; max-width:150mm; }
  .dv-quote svg{ width:8mm; height:8mm; color:var(--brass2); flex:0 0 auto; }
  .dv-quote p{ font-family:var(--head); font-size:16pt; line-height:1.35; color:rgba(255,255,255,.9); }
  html:not([lang="ar"]) .dv-quote p{ font-style:italic; }
  html[dir="rtl"] .dv-quote svg{ transform:scaleX(-1); }

  /* ABOUT */
  .band{ position:absolute; top:0; left:0; right:0; overflow:hidden; border-end-end-radius:30mm; }
  .est{ position:absolute; width:34mm; height:34mm; border-radius:50%; background:var(--navy); color:var(--white); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:0 5mm 12mm rgba(0,0,0,.25); }
  .est b{ font-family:var(--head); font-weight:400; font-size:26pt; line-height:1; }
  .est span{ font-size:6.5pt; letter-spacing:.22em; text-transform:uppercase; color:var(--brass2); margin-top:1.5mm; font-weight:600; }
  html[lang="ar"] .est span{ letter-spacing:0; font-size:8pt; }
  .strengths{ display:grid; grid-template-columns:repeat(3,1fr); gap:5mm; }
  .strength{ background:#fff; border-radius:5mm; padding:6mm 5mm; display:flex; flex-direction:column; gap:3mm; }
  .strength h3{ font-size:14pt; } html:not([lang="ar"]) .strength h3{ font-style:italic; }
  .strength p{ font-size:8.6pt; line-height:1.5; color:var(--ink2); }

  /* NUMBERS */
  .big-n{ display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid rgba(255,255,255,.14); }
  .big-n > div{ padding:7mm 5mm 7mm 0; border-bottom:1px solid rgba(255,255,255,.14); }
  html[dir="rtl"] .big-n > div{ padding:7mm 0 7mm 5mm; }
  .big-n b{ display:block; font-family:var(--head); font-weight:400; font-size:50pt; line-height:.9; }
  .big-n b small{ font-size:.5em; color:var(--brass2); }
  .big-n > div > span:not(.ib){ display:block; margin-top:3mm; font-size:7.4pt; letter-spacing:.14em; text-transform:uppercase; font-weight:500; color:var(--mute); line-height:1.45; }
  html[lang="ar"] .big-n > div > span:not(.ib){ letter-spacing:0; font-size:8.6pt; }
  .big-n .ib{ width:10mm; height:10mm; margin-bottom:4mm; } .big-n .ib svg{ width:4.6mm; height:4.6mm; }
  .decade{ position:relative; margin-top:6mm; }
  .decade .track{ height:3px; background:rgba(255,255,255,.14); border-radius:2px; position:relative; }
  .decade .fill{ position:absolute; inset:0; background:var(--grad); border-radius:2px; transform-origin:left center; }
  html[dir="rtl"] .decade .fill{ transform-origin:right center; }
  .decade .yrs{ display:flex; justify-content:space-between; margin-top:2.5mm; }
  .decade .yrs span{ font-size:7pt; color:var(--mute); width:0; display:flex; justify-content:center; white-space:nowrap; }
  .decade .yrs span.k{ color:#fff; font-weight:600; font-size:8pt; }
  .decade .dots{ position:absolute; left:0; right:0; top:-1.6mm; display:flex; justify-content:space-between; }
  .decade .dots i{ width:3.4mm; height:3.4mm; border-radius:50%; background:var(--navy); border:1.2px solid var(--brass2); }
  .decade .dots i.k{ background:var(--brass2); }

  /* VISION / MISSION */
  .vm-top{ position:absolute; top:16mm; left:16mm; right:16mm; height:142mm; border-radius:7mm; overflow:hidden; color:var(--white); }
  .vm-top .shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(15,31,41,.25), rgba(15,31,41,.92) 70%); }
  .vm-in{ position:absolute; left:11mm; right:11mm; bottom:11mm; }
  .vm-bottom{ position:absolute; top:166mm; left:16mm; right:16mm; height:105mm; border-radius:7mm; background:#fff; padding:11mm; }
  .vm-title{ font-size:34pt; margin:5mm 0 5mm; } html:not([lang="ar"]) .vm-title{ font-style:italic; }
  .vm-text{ font-size:12.4pt; line-height:1.6; }
  .vm-tag{ margin-top:6mm; font-size:7.6pt; letter-spacing:.24em; text-transform:uppercase; font-weight:600; }
  html[lang="ar"] .vm-tag{ letter-spacing:0; font-size:9pt; }

  /* RING */
  .ring{ position:relative; margin:0 auto; }
  .ring svg.rg{ position:absolute; inset:0; width:100%; height:100%; }
  .ring .core{ position:absolute; transform:translate(-50%,-50%); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .ring .node{ position:absolute; transform:translate(-50%,-50%); width:15mm; height:15mm; border-radius:50%; display:grid; place-items:center; background:var(--grad); color:#fff; box-shadow:0 2mm 6mm rgba(10,22,29,.25); }
  .ring .node svg{ width:6.4mm; height:6.4mm; stroke-width:1.7; }
  .ring .lbl{ position:absolute; transform:translate(-50%,-50%); width:38mm; text-align:center; font-family:var(--head); font-size:14.5pt; line-height:1.1; }
  html:not([lang="ar"]) .ring .lbl{ font-style:italic; }
  .ring .lbl small{ display:block; font-family:var(--body); font-style:normal; font-size:6.6pt; letter-spacing:.18em; color:var(--brass); font-weight:600; margin-bottom:1mm; }
  .vgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:4mm 6mm; }
  .vgrid div{ border-top:1px solid var(--line); padding-top:3mm; }
  .vgrid h4{ font-size:11.5pt; margin-bottom:1.5mm; } html:not([lang="ar"]) .vgrid h4{ font-style:italic; }
  .vgrid p{ font-size:8.3pt; line-height:1.48; color:var(--ink2); }

  /* WHY */
  .why-img{ position:absolute; top:0; bottom:0; inset-inline-start:0; width:70mm; overflow:hidden; }
  .why-body{ position:absolute; top:16mm; bottom:22mm; inset-inline-start:82mm; inset-inline-end:16mm; }
  .why-row{ display:flex; gap:4.5mm; padding:4.2mm 0; border-bottom:1px solid rgba(255,255,255,.12); }
  .why-row h3{ font-size:13.5pt; margin-bottom:1.2mm; } html:not([lang="ar"]) .why-row h3{ font-style:italic; }
  .why-row p{ font-size:8.6pt; line-height:1.5; color:var(--mute); }

  /* LIFECYCLE */
  .life{ display:grid; grid-template-columns:repeat(4,1fr); gap:4mm; position:relative; }
  .life-line{ position:absolute; top:6.5mm; left:6mm; right:6mm; height:2px; background:var(--grad); transform-origin:left center; }
  html[dir="rtl"] .life-line{ transform-origin:right center; }
  .stage{ position:relative; display:flex; flex-direction:column; gap:3mm; }
  .stage .step{ width:13mm; height:13mm; border-radius:50%; background:var(--navy); border:2px solid var(--brass2); display:grid; place-items:center; color:var(--brass2); z-index:1; position:relative; }
  .stage .step svg{ width:6mm; height:6mm; }
  .stage .sno{ font-size:6.8pt; letter-spacing:.2em; text-transform:uppercase; color:var(--brass2); font-weight:600; margin-top:2mm; }
  html[lang="ar"] .stage .sno{ letter-spacing:0; font-size:8pt; }
  .stage h3{ font-size:19pt; } html:not([lang="ar"]) .stage h3{ font-style:italic; }
  .stage > p{ font-size:9pt; line-height:1.45; color:var(--mute); min-height:18mm; }
  .svc-pill{ display:flex; gap:3mm; align-items:center; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); border-radius:3.5mm; padding:3.6mm 3.4mm; }
  .svc-pill i{ font-style:normal; font-family:var(--head); font-size:10pt; color:var(--brass2); }
  .svc-pill span{ font-size:9pt; line-height:1.28; }
  .svc-pill svg{ width:4.6mm; height:4.6mm; color:var(--cyan); flex:0 0 auto; }

  /* SERVICE A */
  .sv-hero{ position:absolute; top:0; left:0; right:0; height:126mm; overflow:hidden; }
  .sv-grad{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,22,29,.15) 20%, rgba(10,22,29,.88)); }
  .sv-no{ position:absolute; top:8mm; inset-inline-end:12mm; font-family:var(--head); font-size:120pt; line-height:.8; color:transparent; -webkit-text-stroke:1.1px rgba(229,196,141,.8); }
  .sv-hero-text{ position:absolute; left:16mm; right:44mm; bottom:13mm; color:#fff; z-index:2; }
  html[dir="rtl"] .sv-hero-text{ left:44mm; right:16mm; }
  .sv-hero-text h2{ font-size:33pt; margin-top:4mm; }
  .sv-badge{ position:absolute; top:115.5mm; inset-inline-end:16mm; width:21mm; height:21mm; border-radius:50%; background:var(--navy); border:2px solid var(--brass2); color:var(--brass2); display:grid; place-items:center; box-shadow:0 4mm 10mm rgba(10,22,29,.3); }
  .sv-badge svg{ width:9.5mm; height:9.5mm; stroke-width:1.5; }
  .sv-body{ position:absolute; top:138mm; left:16mm; right:16mm; bottom:22mm; display:flex; flex-direction:column; }
  .tagline{ font-family:var(--head); font-size:16pt; line-height:1.25; color:var(--blue); }
  html:not([lang="ar"]) .tagline{ font-style:italic; }
  .count{ display:flex; align-items:baseline; gap:2mm; }
  .count b{ font-family:var(--head); font-weight:400; font-size:30pt; line-height:1; color:var(--brass); }
  .count span{ font-size:7pt; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--ink2); max-width:26mm; line-height:1.3; }
  html[lang="ar"] .count span{ letter-spacing:0; font-size:8pt; }
  .ks{ margin-top:7mm; background:#fff; border-radius:5mm; padding:6.5mm 7mm; }
  .ks ul{ list-style:none; margin:3.5mm 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:2.2mm 7mm; }
  .ks li{ display:flex; gap:2.2mm; font-size:8.6pt; line-height:1.35; color:var(--ink); }
  .ks li svg{ width:3.8mm; height:3.8mm; color:var(--brass); flex:0 0 auto; margin-top:.2mm; stroke-width:2.2; }
  .ks.dense li{ font-size:8.1pt; } .ks.dense ul{ gap:1.6mm 6mm; }

  /* SERVICE B */
  .svb-photo{ position:absolute; top:0; bottom:0; inset-inline-end:0; width:72mm; overflow:hidden; }
  .svb-photo .sv-no{ top:auto; bottom:16mm; inset-inline-end:auto; inset-inline-start:8mm; font-size:110pt; }
  .svb-photo .icn{ position:absolute; top:16mm; inset-inline-start:10mm; width:20mm; height:20mm; border-radius:50%; background:var(--navy); border:2px solid var(--brass2); display:grid; place-items:center; color:var(--brass2); box-shadow:0 4mm 10mm rgba(0,0,0,.35); }
  .svb-photo .icn svg{ width:9mm; height:9mm; stroke-width:1.5; }
  .svb-body{ position:absolute; top:16mm; bottom:22mm; inset-inline-start:16mm; inset-inline-end:84mm; display:flex; flex-direction:column; }
  .svb-body h2{ font-size:31pt; margin:5mm 0 4mm; }
  .svb-body .ks{ padding:6mm; margin-top:auto; }
  .svb-body .ks ul{ grid-template-columns:1fr; gap:1.8mm; }
  .svb-body .ks.dense ul{ grid-template-columns:1fr 1fr; gap:1.4mm 4mm; }
  .svb-body .ks.dense li{ font-size:7.6pt; }

  /* PEOPLE */
  .leader{ display:grid; grid-template-columns:64mm 1fr; gap:9mm; align-items:start; }
  .leader .ph{ position:relative; height:84mm; border-radius:6mm; overflow:hidden; }
  .leader .ph img{ width:100%; height:100%; object-fit:cover; object-position:center 15%; }
  .leader .ph::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2.2px; background:var(--brass); }
  .leader h3{ font-size:24pt; }
  .leader .role{ margin:2mm 0 3.5mm; font-size:7.8pt; letter-spacing:.2em; text-transform:uppercase; font-weight:600; color:var(--blue); }
  html[lang="ar"] .leader .role{ letter-spacing:0; font-size:9pt; }
  .leader .deg{ display:flex; gap:2mm; align-items:center; font-size:8.4pt; color:var(--ink2); margin:3mm 0 4mm; }
  .leader .deg svg{ width:4mm; height:4mm; color:var(--brass); }
  .leader p.bio{ font-size:9pt; line-height:1.58; color:var(--ink2); margin-bottom:2.5mm; }
  .team{ display:grid; grid-template-columns:repeat(2,1fr); gap:6mm 8mm; }
  .member{ display:flex; gap:5mm; align-items:flex-start; padding:5mm; border-radius:5mm; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); }
  .member .ph{ width:28mm; height:34mm; border-radius:4mm; overflow:hidden; flex:0 0 auto; background:var(--navy2); display:grid; place-items:center; font-family:var(--head); font-size:22pt; color:var(--brass2); }
  .member .ph img{ width:100%; height:100%; object-fit:cover; object-position:center 15%; }
  .member h3{ font-size:13.5pt; }
  .member .role{ display:block; margin:1.2mm 0 2mm; font-size:7pt; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--brass2); }
  html[lang="ar"] .member .role{ letter-spacing:0; font-size:8.4pt; }
  .member p{ font-size:8pt; line-height:1.48; color:var(--mute); }

  /* CLIENTS / COMMITMENTS */
  .logos{ display:grid; grid-template-columns:repeat(6,1fr); gap:3.2mm; }
  .logos div{ position:relative; aspect-ratio:1/1; background:#fff; border-radius:3mm; border:1px solid var(--line); overflow:hidden; }

      } else {
        const pts = []; let y = yStart, side = 1;
        while (y + 55 < yEnd) { y += 55; pts.push([G + side * 1.8, y]); side *= -1; }
        pts.push([G, yEnd]);
        let px = xIn, py = yStart;
        pts.forEach(([x, yy]) => { const m = (yy - py) / 2; d += ` C${px},${py + m} ${x},${yy - m} ${x},${yy}`; px = x; py = yy; });
      }
      const dark = pg.classList.contains('dark');
      const fill = dark ? '#0f1f29' : (pg.classList.contains('sand') ? '#ece5d8' : '#f6f2ea');
      const ticks = nodes.map(n => { const tx = n.x; const tick = Math.abs(tx - G) > 2 ? `<line class="tk" x1="${G}" y1="${n.y}" x2="${tx}" y2="${n.y}" stroke="${BRASS}" stroke-width=".3" opacity=".8"/>` : '';
        return `${tick}<circle class="nd" cx="${G}" cy="${n.y}" r="${n.big ? 2.6 : 1.7}" fill="${fill}" stroke="${BRASS}" stroke-width=".55"/>${n.big ? `<circle class="nd" cx="${G}" cy="${n.y}" r="1" fill="${BRASS}"/>` : ''}`; }).join('');
      const svg = `<svg class="thread" viewBox="0 0 210 297" preserveAspectRatio="none"><defs><linearGradient id="tg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5c48d"/><stop offset="1" stop-color="#c79d5d"/></linearGradient></defs>
        <path class="th" d="${d}" fill="none" stroke="url(#tg${i})" stroke-width=".55" stroke-linecap="round"/>${ticks}</svg>`;
      pg.insertAdjacentHTML('beforeend', svg);
      xIn = G;
    });
  }

  // ---------- screen sizing ----------
  function fit() { if (PRINT) return; const z = Math.min(1.3, (window.innerWidth - (window.innerWidth > 1100 ? 160 : 0)) / 794); doc.style.zoom = z; }
  fit();

  // hand-drawn helpers (all coordinates in page millimetres)
  function rough(cx, cy, rx, ry, seed) {
    let d = ''; const steps = 46, turn = Math.PI * 2 + .55; let rnd = seed;
    const r = () => { rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; };
    for (let k = 0; k <= steps; k++) { const t = -1.9 + turn * k / steps; const w = 1 + (r() - .5) * .07 + .04 * Math.sin(3 * t);
      const x = cx + rx * w * Math.cos(t), y = cy + ry * w * Math.sin(t); d += (k ? ' L' : 'M') + x.toFixed(2) + ',' + y.toFixed(2); }
    return d; }
  function arrow(x1, y1, x2, y2) {
    const mx = (x1 + x2) / 2 + (y2 - y1) * .25, my = (y1 + y2) / 2 - (x2 - x1) * .25;
    const a = Math.atan2(y2 - my, x2 - mx), h = 2.6;
    return `M${x1},${y1} Q${mx},${my} ${x2},${y2} M${x2},${y2} L${(x2 - h * Math.cos(a - .45)).toFixed(2)},${(y2 - h * Math.sin(a - .45)).toFixed(2)} M${x2},${y2} L${(x2 - h * Math.cos(a + .45)).toFixed(2)},${(y2 - h * Math.sin(a + .45)).toFixed(2)}`; }
  const ANN = [
    { sel: '#pg1 .cv-words', text: () => T.nCover, at: 'below-end', dx: -6, dy: 4, rot: -6 },
    { sel: '[data-an="num2"] .cnt', text: () => T.nSectors, circle: true, at: 'end', dx: 7, dy: -2, rot: -5 },
    { sel: '[data-an="num4"] .cnt', text: () => T.nList, circle: true, at: 'below', dx: 0, dy: 21, rot: -3 },
    { sel: '[data-an="decade"] .dots i:last-child', text: () => T.nToday, at: 'above', dx: -4, dy: -9, rot: -8, arrow: true },
    { sel: '[data-an="life"] .life-line', text: () => T.nStages, at: 'above-end', dx: -42, dy: -9, rot: -3 },
    { sel: '[data-an="certs"]', text: () => T.nCreds, at: 'end', dx: 4, dy: -5, rot: -6, underline: true },
    { sel: '[data-an="logos"]', text: () => T.nLogos, at: 'above-end', dx: -46, dy: -7, rot: -4 },
    { sel: '#pg27 .qr, .page:last-child .qr', text: () => T.nScan, at: 'above', dx: -2, dy: -10, rot: -9, arrow: true },
    { sel: '.page:last-child h2', text: () => T.nTalk, at: 'above-end', dx: -10, dy: -6, rot: -7 },
  ];
  function annotate() {
    document.querySelectorAll('.note, svg.scrib').forEach(e => e.remove());
    const perPage = new Map();
    const add = (pg, html) => { perPage.set(pg, (perPage.get(pg) || '') + html); };
    let seed = 11;
    ANN.forEach(a => {
      const el = document.querySelector(a.sel); if (!el) return;
      const pg = el.closest('.page'); const R = pg.getBoundingClientRect(); const k = 297 / R.height; const b = el.getBoundingClientRect();
      const x0 = (b.left - R.left) * k, y0 = (b.top - R.top) * k, w = b.width * k, h = b.height * k;
      const flip = AR ? -1 : 1; const startX = AR ? x0 + w : x0, endX = AR ? x0 : x0 + w;
      let nx, ny;
      if (a.at === 'end') { nx = endX + a.dx * flip; ny = y0 + h / 2 + a.dy; }
      else if (a.at === 'start') { nx = startX + a.dx * flip; ny = y0 + a.dy; }
      else if (a.at === 'below') { nx = startX + a.dx * flip; ny = y0 + h + a.dy; }
      else if (a.at === 'below-end') { nx = endX + a.dx * flip; ny = y0 + h + a.dy; }
      else if (a.at === 'above-end') { nx = endX + a.dx * flip; ny = y0 + a.dy; }
      else { nx = startX + w / 2 + a.dx * flip; ny = y0 + a.dy; }
      const anchorSide = AR ? 'right' : 'left';
      const pos = AR ? `right:${(210 - nx).toFixed(1)}mm` : `left:${nx.toFixed(1)}mm`;
      add(pg, `<span class="note" style="${pos};top:${(ny - 3).toFixed(1)}mm;transform:rotate(${a.rot * flip}deg)">${esc(a.text())}</span>`);
      let paths = '';
      if (a.circle) paths += `<path d="${rough(x0 + w / 2, y0 + h / 2, w / 2 + 3.2, h / 2 + 2.6, seed += 37)}" fill="none" stroke="currentColor" stroke-width=".55" stroke-linecap="round"/>`;
      if (a.underline) paths += `<path d="M${startX},${y0 + h + 1.6} C${startX + 20 * flip},${y0 + h + .4} ${endX - 18 * flip},${y0 + h + 2.8} ${endX + 2 * flip},${y0 + h + 1.2}" fill="none" stroke="currentColor" stroke-width=".55" stroke-linecap="round"/>`;
      if (a.arrow) { const tx = startX + (w / 2) * flip, ty = (ny < y0 ? y0 - 1.2 : y0 + h + 1.2); const fx = nx + 6 * flip, fy = ny < y0 ? ny + 3 : ny - 4;
        paths += `<path d="${arrow(fx, fy, tx, ty)}" fill="none" stroke="currentColor" stroke-width=".5" stroke-linecap="round" stroke-linejoin="round"/>`; }
      if (paths) add(pg, `<svg class="scrib" viewBox="0 0 210 297" preserveAspectRatio="none" style="color:${pg.classList.contains('dark') ? '#e0745c' : '#c4472f'}">${paths}</svg>`);
    });
    perPage.forEach((html, pg) => pg.insertAdjacentHTML('beforeend', html));
  }

  function finish() {
    annotate();
    drawThreads();
    window.__profileReady = true;
    if (!PRINT) animate();
  }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(finish));

  // ---------- animations (screen only) ----------
  function animate() {
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js';
    s.onload = () => { const t = document.createElement('script'); t.src = 'https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js'; t.onload = run; document.head.appendChild(t); };
    document.head.appendChild(s);
  }
  function run() {
    const gsap = window.gsap, ST = window.ScrollTrigger; gsap.registerPlugin(ST);
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // progress bar + rail
    const prog = document.getElementById('ui-progress');
    ST.create({ start: 0, end: 'max', onUpdate: (self) => { prog.style.transform = `scaleX(${self.progress})`; } });
    const railLinks = [...document.querySelectorAll('#ui-rail a')];
    document.querySelectorAll('.page').forEach(pg => ST.create({ trigger: pg, start: 'top 50%', end: 'bottom 50%', onToggle: (self) => {
      if (!self.isActive) return; const ch = +pg.dataset.ch;
      railLinks.forEach((a, i) => a.classList.toggle('on', i === ch + 1 || (ch < 0 && i === 0)));
    } }));
    if (reduced) return;

    // thread draws as you scroll, page after page
    document.querySelectorAll('.page').forEach((pg) => {
      const path = pg.querySelector('svg.thread .th'); if (!path) return;
      const len = path.getTotalLength(); path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      gsap.to(path, { strokeDashoffset: 0, ease: 'none', scrollTrigger: { trigger: pg, start: 'top 80%', end: 'bottom 80%', scrub: .6 } });
      gsap.from(pg.querySelectorAll('svg.thread .nd, svg.thread .tk'), { opacity: 0, duration: .6, stagger: .1, scrollTrigger: { trigger: pg, start: 'top 55%' } });
      // photos settle
      pg.querySelectorAll('.img').forEach(img => gsap.fromTo(img, { scale: 1.12 }, { scale: 1, ease: 'none', scrollTrigger: { trigger: pg, start: 'top bottom', end: 'bottom top', scrub: true } }));
      // content reveals
      const items = pg.querySelectorAll('.kicker, h2, .lead, .txt, .tagline, .strength, .big-n > div, .why-row, .vgrid > div, .stage, .svc-pill, .ks li, .member, .leader, .exp > div, .logos > div, .ct-row, .ch-row, .vm-in, .vm-bottom, .count, .chip, .dv-quote, .qr');
      if (items.length) gsap.from(items, { y: 24, opacity: 0, duration: .8, ease: 'power3.out', stagger: .045, scrollTrigger: { trigger: pg, start: 'top 72%' } });
      // rings assemble
      pg.querySelectorAll('.ring').forEach(rg => {
        const c = rg.querySelector('.ring-c'); if (c) { const L = 2 * Math.PI * +c.getAttribute('r'); c.style.strokeDasharray = L; c.style.strokeDashoffset = L; gsap.to(c, { strokeDashoffset: 0, duration: 1.6, ease: 'power2.inOut', scrollTrigger: { trigger: rg, start: 'top 75%' } }); }
        gsap.from(rg.querySelectorAll('.node'), { scale: 0, opacity: 0, duration: .6, ease: 'back.out(1.8)', stagger: .12, delay: .4, scrollTrigger: { trigger: rg, start: 'top 75%' } });
        gsap.from(rg.querySelectorAll('.lbl'), { opacity: 0, y: 8, duration: .5, stagger: .12, delay: .6, scrollTrigger: { trigger: rg, start: 'top 75%' } });
        gsap.from(rg.querySelector('.core'), { scale: .6, opacity: 0, duration: .9, ease: 'power3.out', scrollTrigger: { trigger: rg, start: 'top 75%' } });
      });
      // lifecycle + timeline lines draw
      pg.querySelectorAll('.life-line, .decade .fill').forEach(l => gsap.from(l, { scaleX: 0, duration: 1.4, ease: 'power2.inOut', scrollTrigger: { trigger: l, start: 'top 80%' } }));
      pg.querySelectorAll('.decade .dots i').forEach((d, j) => gsap.from(d, { scale: 0, duration: .35, delay: .1 * j, scrollTrigger: { trigger: d, start: 'top 85%' } }));
      // counters
      pg.querySelectorAll('.cnt').forEach(el => {
        const to = +el.dataset.to; if (!to || el.dataset.plain === '1') return; const o = { v: 0 };
        gsap.to(o, { v: to, duration: 1.6, ease: 'power2.out', scrollTrigger: { trigger: el, start: 'top 85%' }, onUpdate: () => { const v = Math.round(o.v); el.textContent = el.dataset.pad ? pad2(v) : v; } });
      });
    });
    gsap.utils.toArray('.note').forEach(n => gsap.from(n, { opacity: 0, scale: .7, duration: .6, ease: 'back.out(2)', scrollTrigger: { trigger: n, start: 'top 85%' } }));
    gsap.utils.toArray('svg.scrib path').forEach(pth => { const L = pth.getTotalLength(); pth.style.strokeDasharray = L; pth.style.strokeDashoffset = L;
      gsap.to(pth, { strokeDashoffset: 0, duration: 1, ease: 'power2.out', scrollTrigger: { trigger: pth.closest('.page'), start: 'top 40%' } }); });
    gsap.utils.toArray('.stamp').forEach(st => gsap.from(st, { scale: 1.8, opacity: 0, duration: .5, ease: 'power4.in', scrollTrigger: { trigger: st, start: 'top 80%' } }));
    // cover entrance
    const cover = document.getElementById('pg1');
    gsap.from(cover.querySelectorAll('.cv-words div > span'), { yPercent: 110, opacity: 0, duration: 1.1, ease: 'expo.out', stagger: .12, delay: .2 });
    gsap.from(cover.querySelectorAll('.lead, .gradbar, .logo, .kicker'), { opacity: 0, y: 16, duration: 1, stagger: .1, delay: .5 });
    gsap.fromTo(cover.querySelector('.swirl'), { rotate: -25, opacity: 0 }, { rotate: 0, opacity: .13, duration: 2.2, ease: 'power3.out' });
    window.addEventListener('resize', () => { fit(); annotate(); drawThreads(); ST.refresh(); });
  }
})();
</script>
</body>
