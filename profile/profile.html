<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Consolidated Company Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@300;400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1623; --navy2:#11233a; --deep:#070f19; --paper:#f4f3ef; --sand:#e7e5df; --ink:#121417; --ink2:#50555d;
    --line:rgba(18,20,23,.12); --white:#f7f6f2; --mute:rgba(247,246,242,.72);
    --cyan:#27fcf2; --blue:#3064d0; --purple:#8739d5; --grad:linear-gradient(100deg,#27fcf2,#3064d0 55%,#8739d5);
    --head:'Instrument Serif',Georgia,serif; --body:'Roboto',Arial,sans-serif;
  }
  html[lang="ar"]{ --head:'Amiri','Noto Naskh Arabic',serif; --body:'IBM Plex Sans Arabic','Segoe UI',sans-serif; }
  @page{ size:210mm 297mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#2a2a2a; }
  body{ font-family:var(--body); font-weight:300; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  h1,h2,h3,h4{ font-family:var(--head); font-weight:400; margin:0; line-height:1.04; }
  p{ margin:0; }
  .it{ font-style:italic; } html[lang="ar"] .it{ font-style:normal; }

  .page{ position:relative; width:210mm; height:297mm; overflow:hidden; page-break-after:always; break-after:page; background:var(--paper); color:var(--ink); }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  .page.dark{ background:var(--navy); color:var(--white); }
  .page.sand{ background:var(--sand); }
  .pad{ position:absolute; inset:16mm 16mm 20mm; }
  .foot{ position:absolute; left:16mm; right:16mm; bottom:9mm; display:flex; justify-content:space-between; align-items:center; font-size:6.8pt; letter-spacing:.22em; text-transform:uppercase; color:var(--ink2); z-index:3; }
  html[lang="ar"] .foot{ letter-spacing:0; font-size:8pt; }
  .dark .foot, .foot.light{ color:var(--mute); }
  .foot .pn{ font-family:var(--head); font-size:12pt; letter-spacing:0; }
  .foot .bar{ flex:1; height:1px; background:currentColor; opacity:.25; margin:0 5mm; }

  .kicker{ display:inline-flex; align-items:center; gap:3mm; font-size:7.6pt; letter-spacing:.3em; text-transform:uppercase; font-weight:600; color:var(--blue); }
  html[lang="ar"] .kicker{ letter-spacing:0; font-size:9.5pt; }
  .kicker::before{ content:""; width:9mm; height:2px; background:var(--grad); flex:0 0 auto; }
  .dark .kicker, .kicker.light{ color:var(--cyan); }
  .h1{ font-size:60pt; } .h2{ font-size:36pt; } .h3{ font-size:17pt; }
  .lead{ font-size:11.6pt; line-height:1.62; }
  .txt{ font-size:9.6pt; line-height:1.62; color:var(--ink2); }
  .dark .txt{ color:var(--mute); }
  .grad-text{ color:var(--cyan); }
  .page:not(.dark) .grad-text{ color:var(--blue); }

  .img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .duo{ position:absolute; inset:0; mix-blend-mode:multiply; }
  .ib{ width:13mm; height:13mm; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; color:var(--blue);
       background:linear-gradient(#fff,#fff) padding-box, var(--grad) border-box; border:1.4px solid transparent; }
  .ib svg{ width:6mm; height:6mm; stroke-width:1.6; }
  .dark .ib, .ib.on-dark{ color:var(--cyan); background:linear-gradient(var(--navy),var(--navy)) padding-box, var(--grad) border-box; }
  .ib.solid{ background:var(--grad); color:#fff; border:0; }
  .ib.lg{ width:17mm; height:17mm; } .ib.lg svg{ width:8mm; height:8mm; }
  .chip{ display:inline-flex; align-items:center; gap:1.6mm; border:1px solid var(--line); border-radius:99px; padding:1.3mm 3.4mm; font-size:7.8pt; font-weight:400; background:rgba(255,255,255,.6); }
  .chip svg{ width:3.6mm; height:3.6mm; color:var(--blue); }
  .dark .chip{ border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.05); }
  .dark .chip svg{ color:var(--cyan); }
  .badge{ display:inline-block; border:1px solid currentColor; border-radius:99px; padding:.8mm 2.8mm; font-size:7.4pt; font-weight:600; letter-spacing:.1em; }
  .ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }

  /* logo */
  .logo{ display:flex; align-items:center; gap:3.5mm; }
  .logo .icon{ height:15mm; } .logo .word{ height:9mm; filter:invert(1) brightness(1.15); }
  .logo.on-light .word{ filter:none; }
  .logo .ar-word{ display:none; flex-direction:column; line-height:1.1; }
  .logo .ar-word b{ font-size:16pt; font-weight:600; } .logo .ar-word small{ font-size:8pt; opacity:.8; }
  html[lang="ar"] .logo .word{ display:none; } html[lang="ar"] .logo .ar-word{ display:flex; }

  /* cover */
  .cover .shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,22,35,.55) 0%, rgba(11,22,35,.35) 30%, rgba(11,22,35,.9) 62%, rgba(7,15,25,1) 100%); }
  .swirl{ position:absolute; opacity:.13; pointer-events:none; }
  .gradbar{ height:2.2px; background:var(--grad); }

  /* about */
  .band{ position:absolute; top:0; left:0; right:0; overflow:hidden; border-end-end-radius:30mm; }
  .est{ position:absolute; width:34mm; height:34mm; border-radius:50%; background:var(--navy); color:var(--white); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:0 5mm 12mm rgba(0,0,0,.25); z-index:2; }
  .est b{ font-family:var(--head); font-weight:400; font-size:26pt; line-height:1; }
  .est span{ font-size:6.5pt; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); margin-top:1.5mm; font-weight:600; }
  html[lang="ar"] .est span{ letter-spacing:0; font-size:8pt; }
  .strengths{ display:grid; grid-template-columns:repeat(3,1fr); gap:5mm; }
  .strength{ background:#fff; border-radius:5mm; padding:6mm 5mm; display:flex; flex-direction:column; gap:3mm; }
  .strength h3{ font-size:14pt; } html:not([lang="ar"]) .strength h3{ font-style:italic; }
  .strength p{ font-size:8.6pt; line-height:1.5; color:var(--ink2); }

  /* glance */
  .stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:0; border-top:1px solid rgba(255,255,255,.14); }
  .stat{ padding:7mm 0 7mm; border-bottom:1px solid rgba(255,255,255,.14); display:flex; gap:5mm; align-items:flex-start; }
  .stat:nth-child(odd){ padding-inline-end:6mm; border-inline-end:1px solid rgba(255,255,255,.14); }
  .stat:nth-child(even){ padding-inline-start:7mm; }
  .stat b{ display:block; font-family:var(--head); font-weight:400; font-size:44pt; line-height:.9; }
  .stat b small{ font-size:.5em; }
  .stat span{ display:block; margin-top:2.5mm; font-size:7.6pt; letter-spacing:.14em; text-transform:uppercase; font-weight:500; color:var(--mute); line-height:1.45; }
  html[lang="ar"] .stat span{ letter-spacing:0; font-size:8.8pt; }

  /* vision/mission */
  .vm-top{ position:absolute; top:16mm; left:16mm; right:16mm; height:142mm; border-radius:7mm; overflow:hidden; color:var(--white); }
  .vm-top .shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,22,35,.25), rgba(11,22,35,.92) 70%); }
  .vm-in{ position:absolute; left:11mm; right:11mm; bottom:11mm; }
  .vm-bottom{ position:absolute; top:166mm; left:16mm; right:16mm; height:105mm; border-radius:7mm; background:#fff; padding:11mm; }
  .vm-title{ font-size:34pt; margin:5mm 0 5mm; } html:not([lang="ar"]) .vm-title{ font-style:italic; }
  .vm-text{ font-size:12.4pt; line-height:1.6; }
  .vm-tag{ margin-top:6mm; font-size:7.6pt; letter-spacing:.24em; text-transform:uppercase; font-weight:600; }
  html[lang="ar"] .vm-tag{ letter-spacing:0; font-size:9pt; }

  /* tiles */
  .tiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:5mm; }
  .tile{ background:#fff; border-radius:5mm; padding:7mm 6.5mm; display:flex; flex-direction:column; gap:3mm; position:relative; }
  .tile .no{ position:absolute; top:6mm; inset-inline-end:6.5mm; font-family:var(--head); font-size:11pt; color:rgba(18,20,23,.3); }
  .tile h3{ font-size:16pt; margin-top:1mm; } html:not([lang="ar"]) .tile h3{ font-style:italic; }
  .tile p{ font-size:8.9pt; line-height:1.55; color:var(--ink2); }

  /* why */
  .why-img{ position:absolute; top:0; bottom:0; inset-inline-start:0; width:70mm; overflow:hidden; }
  .why-body{ position:absolute; top:16mm; bottom:20mm; inset-inline-start:82mm; inset-inline-end:16mm; }
  .why-row{ display:flex; gap:4.5mm; padding:4.2mm 0; border-bottom:1px solid rgba(255,255,255,.12); }
  .why-row h3{ font-size:13.5pt; margin-bottom:1.2mm; } html:not([lang="ar"]) .why-row h3{ font-style:italic; }
  .why-row p{ font-size:8.6pt; line-height:1.5; color:var(--mute); }

  /* services overview */
  .svc-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:4.5mm; }
  .svc-card{ background:var(--navy); color:var(--white); border-radius:5mm; padding:6mm 5mm; min-height:56mm; display:flex; flex-direction:column; gap:3mm; position:relative; overflow:hidden; }
  .svc-card .no{ position:absolute; top:4.5mm; inset-inline-end:5mm; font-family:var(--head); font-size:22pt; color:rgba(255,255,255,.12); line-height:1; }
  .svc-card h3{ font-size:13.5pt; line-height:1.12; margin-top:1mm; }
  .svc-card p{ font-size:7.8pt; line-height:1.45; color:var(--mute); }
  .svc-card .ib{ color:var(--cyan); background:linear-gradient(var(--navy),var(--navy)) padding-box, var(--grad) border-box; width:11mm; height:11mm; }
  .svc-card .ib svg{ width:5mm; height:5mm; }

  /* service detail */
  .sv-hero{ position:absolute; top:0; left:0; right:0; height:126mm; overflow:hidden; }
  .sv-grad{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,15,25,.15) 20%, rgba(7,15,25,.88)); }
  .sv-no{ position:absolute; top:8mm; inset-inline-end:12mm; font-family:var(--head); font-size:120pt; line-height:.8; color:transparent; -webkit-text-stroke:1.1px rgba(255,255,255,.6); }
  .sv-hero-text{ position:absolute; left:16mm; right:44mm; bottom:13mm; color:#fff; }
  html[dir="rtl"] .sv-hero-text{ left:44mm; right:16mm; }
  .sv-hero-text h2{ font-size:33pt; margin-top:4mm; }
  .sv-badge{ position:absolute; top:115.5mm; inset-inline-end:16mm; width:21mm; height:21mm; border-radius:50%; background:var(--grad); color:#fff; display:grid; place-items:center; box-shadow:0 4mm 10mm rgba(7,15,25,.3); z-index:2; }
  .sv-badge svg{ width:9.5mm; height:9.5mm; stroke-width:1.5; }
  .sv-body{ position:absolute; top:138mm; left:16mm; right:16mm; bottom:20mm; display:flex; flex-direction:column; }
  .tagline{ font-family:var(--head); font-size:16pt; line-height:1.25; color:var(--blue); max-width:150mm; }
  html:not([lang="ar"]) .tagline{ font-style:italic; }
  .ks{ margin-top:7mm; background:#fff; border-radius:5mm; padding:6.5mm 7mm; }
  .ks ul{ list-style:none; margin:3.5mm 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:2.2mm 7mm; }
  .ks li{ display:flex; gap:2.2mm; font-size:8.6pt; line-height:1.35; color:var(--ink); }
  .ks li svg{ width:3.8mm; height:3.8mm; color:var(--blue); flex:0 0 auto; margin-top:.2mm; stroke-width:2.2; }
  .ks.dense li{ font-size:8.1pt; } .ks.dense ul{ gap:1.6mm 6mm; }

  /* leadership */
  .leader{ display:grid; grid-template-columns:64mm 1fr; gap:9mm; align-items:start; }
  .leader .ph{ position:relative; height:84mm; border-radius:6mm; overflow:hidden; }
  .leader .ph img{ width:100%; height:100%; object-fit:cover; object-position:center 15%; }
  .leader .ph::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2.2px; background:var(--grad); }
  .leader h3{ font-size:24pt; }
  .leader .role{ margin:2mm 0 3.5mm; font-size:7.8pt; letter-spacing:.2em; text-transform:uppercase; font-weight:600; color:var(--blue); }
  html[lang="ar"] .leader .role{ letter-spacing:0; font-size:9pt; }
  .leader .deg{ display:flex; gap:2mm; align-items:center; font-size:8.4pt; color:var(--ink2); margin:3mm 0 4mm; }
  .leader .deg svg{ width:4mm; height:4mm; color:var(--blue); }
  .leader p.bio{ font-size:9pt; line-height:1.58; color:var(--ink2); margin-bottom:2.5mm; }

  /* team */
  .team{ display:grid; grid-template-columns:repeat(2,1fr); gap:6mm 8mm; }
  .member{ display:flex; gap:5mm; align-items:flex-start; padding:5mm; border-radius:5mm; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); }
  .member .ph{ width:28mm; height:34mm; border-radius:4mm; overflow:hidden; flex:0 0 auto; background:var(--navy2); display:grid; place-items:center; font-family:var(--head); font-size:22pt; color:var(--cyan); }
  .member .ph img{ width:100%; height:100%; object-fit:cover; object-position:center 15%; }
  .member h3{ font-size:13.5pt; }
  .member .role{ display:block; margin:1.2mm 0 2mm; font-size:7pt; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--cyan); }
  html[lang="ar"] .member .role{ letter-spacing:0; font-size:8.4pt; }
  .member p{ font-size:8pt; line-height:1.48; color:var(--mute); }

  /* expect */
  .exp{ display:grid; grid-template-columns:repeat(3,1fr); gap:4.5mm; }
  .exp div{ background:#fff; border-radius:5mm; padding:6mm 5mm; min-height:60mm; display:flex; flex-direction:column; gap:4mm; }
  .exp p{ font-family:var(--head); font-size:12pt; line-height:1.3; }
  html:not([lang="ar"]) .exp p{ font-style:italic; }

  /* clients */
  .logos{ display:grid; grid-template-columns:repeat(6,1fr); gap:3mm; }
  .logos div{ position:relative; aspect-ratio:4/3; background:#fff; border-radius:3mm; border:1px solid var(--line); overflow:hidden; }
  .logos img{ position:absolute; inset:2.6mm; width:calc(100% - 5.2mm); height:calc(100% - 5.2mm); object-fit:contain; }

  /* contact */
  .ct-row{ display:flex; gap:4.5mm; align-items:center; padding:4.2mm 0; border-bottom:1px solid rgba(255,255,255,.14); }
  .ct-row small{ display:block; font-size:6.8pt; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); font-weight:600; margin-bottom:1mm; }
  html[lang="ar"] .ct-row small{ letter-spacing:0; font-size:8pt; }
  .ct-row span{ font-size:11pt; }
  .qr{ background:#fff; border-radius:5mm; padding:4mm; width:44mm; text-align:center; color:var(--ink); }
  .qr img{ width:36mm; height:36mm; display:block; margin:0 auto 2.5mm; }
  .qr p{ font-size:7.2pt; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  html[lang="ar"] .qr p{ letter-spacing:0; font-size:8.4pt; }
</style>
</head>
<body>
<div id="doc"></div>
<script src="/assets/js/i18n.js"></script>
<script src="/profile/vendor/lucide.min.js"></script>
<script>
(function(){
  const q = new URLSearchParams(location.search); const lang = q.get('lang') === 'ar' ? 'ar' : 'en';
  const D = I18N[lang], EN = I18N.en, AR = lang === 'ar';
  document.documentElement.lang = lang; document.documentElement.dir = AR ? 'rtl' : 'ltr';
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ic = (n) => `<i data-lucide="${n}"></i>`;
  const pad2 = (i) => String(i).padStart(2, '0');

  const T = AR ? {
    footer:'الموحدة · الملف التعريفي 2026', profile:'الملف التعريفي 2026', coverA:'الملف', coverB:'التعريفي', motto:'نزاهة • شفافية • جودة', since:'منذ 2015 · عمّان، الأردن',
    about:'من نحن', whoTitle:'شريك موثوق', whoTitle2:'لأعمالك', est:'تأسست', amman:'عمّان · الأردن',
    glance:'لمحة سريعة', glanceTitle:'الموحدة', glanceTitle2:'بالأرقام', lines:'خطوط خدمات متكاملة', people:'مهنيون مؤهلون', creds:'الاعتمادات المهنية لقيادتنا', standards:'معايير نعمل وفقها',
    vm:'الرؤية والمهمة', services:'خدماتنا', service:'الخدمة', servicesIntro:'تسع ممارسات متكاملة تغطي كل ما تحتاجه المنشأة، من التدقيق والضرائب إلى الاستشارات والتحول الرقمي.',
    leadership:'قيادتنا', team:'فريقنا', expect:'التزاماتنا', clients:'عملاؤنا', sectors:'القطاعات التي نخدمها', contact:'تواصل معنا',
    address:'العنوان', phone:'الهاتف', email:'البريد الإلكتروني', website:'الموقع الإلكتروني', scan:'امسح الرمز لزيارة موقعنا', more:'تفاصيل كاملة لكل خدمة على موقعنا'
  } : {
    footer:'Consolidated · Company Profile 2026', profile:'Company Profile 2026', coverA:'Company', coverB:'Profile', motto:'Integrity • Transparency • Quality', since:'Since 2015 · Amman, Jordan',
    about:'About Us', whoTitle:'A trusted partner', whoTitle2:'for your business', est:'Est.', amman:'Amman · Jordan',
    glance:'At a Glance', glanceTitle:'Consolidated', glanceTitle2:'in Numbers', lines:'Integrated service lines', people:'Qualified professionals', creds:'Professional credentials held by our leadership', standards:'Standards we work by',
    vm:'Vision & Mission', services:'Our Services', service:'Service', servicesIntro:'Nine integrated practices that cover everything an organisation needs, from audit and tax to advisory and digital transformation.',
    leadership:'Our Leadership', team:'Our Team', expect:'Our Commitments', clients:'Our Clients', sectors:'Sectors we serve', contact:'Contact Us',
    address:'Address', phone:'Phone', email:'Email', website:'Website', scan:'Scan to visit our website', more:'Full details of every service at www.caudit.net'
  };

  const svcIcons = ['shield-check','calculator','receipt-text','scan-search','trending-up','building-2','briefcase-business','graduation-cap','monitor-cog'];
  const valIcons = ['badge-check','scale','award','handshake','lock-keyhole','lightbulb'];
  const whyIcons = ['user-check','circle-check-big','factory','heart-handshake','cpu','rocket'];
  const ptIcons  = ['medal','network','clipboard-check'];
  const expIcons = ['hourglass','users-round','graduation-cap','book-check','globe','compass','lock','map-pin','star'];
  const secIcons = ['factory','store','stethoscope','monitor-smartphone','heart-handshake','hard-hat','wheat','fuel'];
  const tones    = ['navy','teal','violet','navy','teal','violet','navy','teal','violet'];
  const imgPos   = ['center 40%','center 30%','center 55%','center 35%','center 60%','center 45%','center 30%','center 70%','center 50%'];

  const logo = (onLight) => `<div class="logo ${onLight ? 'on-light' : ''}"><img class="icon" src="/assets/img/icon.png"><img class="word" src="/assets/img/wordmark.png"><div class="ar-word"><b>الموحدة</b><small>لتدقيق الحسابات والاستشارات المالية</small></div></div>`;
  let n = 0; const pages = [];
  const page = (cls, inner, opts = {}) => {
    n++;
    const foot = opts.noFoot ? '' : `<div class="foot ${opts.lightFoot ? 'light' : ''}"><span>${esc(T.footer)}</span><span class="bar"></span><span class="pn">${pad2(n)}</span></div>`;
    pages.push(`<section class="page ${cls}">${inner}${foot}</section>`);
  };

  // ---- contact data (single "Contact Us" column of the site footer)
  const cc = D.footer.cols.find(c => c.links.some(l => String(l[1] || '').startsWith('tel:'))) || D.footer.cols[D.footer.cols.length - 1];
  const addr = cc.links[0][0];
  const tel  = (cc.links.find(l => String(l[1] || '').startsWith('tel:')) || [''])[0];
  const mail = (cc.links.find(l => String(l[1] || '').startsWith('mailto:')) || [''])[0];
  const web  = (cc.links.find(l => /^https:\/\/www\.caudit/.test(String(l[1] || ''))) || ['www.caudit.net'])[0];

  // 1 · COVER
  page('dark cover', `
    <img class="img toned" src="/profile/img/sky-1-navy.jpg" style="object-position:center 30%">
    <div class="shade"></div>
    <img class="swirl" src="/assets/img/icon.png" style="width:170mm;top:-30mm;inset-inline-end:-55mm">
    <div class="pad" style="display:flex;flex-direction:column;justify-content:space-between">
      ${logo(false)}
      <div>
        <div class="kicker">${esc(T.profile)}</div>
        <h1 class="h1" style="font-size:72pt;margin-top:6mm">${esc(T.coverA)}<br><span class="it grad-text">${esc(T.coverB)}</span></h1>
        <p class="lead" style="max-width:140mm;margin-top:9mm;color:var(--mute)">${esc(D.hero.sub)}</p>
        <div class="gradbar" style="margin-top:12mm"></div>
        <div style="display:flex;justify-content:space-between;margin-top:5mm;font-size:8pt;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)"><span>${esc(T.motto)}</span><span>${esc(T.since)}</span></div>
      </div>
    </div>`, { noFoot: true });

  // 2 · ABOUT
  page('', `
    <div class="band" style="height:122mm"><img class="img toned" src="/profile/img/sky-2-navy.jpg" style="object-position:center 45%"></div>
    <div class="est" style="top:106mm;inset-inline-end:22mm"><span>${esc(T.est)}</span><b>2015</b><span>${esc(T.amman)}</span></div>
    <div style="position:absolute;top:132mm;left:16mm;right:16mm;bottom:20mm;display:flex;flex-direction:column">
      <div class="kicker">${esc(T.about)}</div>
      <h2 class="h2" style="margin:5mm 0 6mm">${esc(T.whoTitle)} <span class="it">${esc(T.whoTitle2)}</span></h2>
      <p class="txt" style="font-size:10pt;color:var(--ink)">${esc(D.intro.p1)}</p>
      <div class="strengths" style="margin-top:auto">${D.intro.points.map((p, i) => `
        <div class="strength"><span class="ib">${ic(ptIcons[i])}</span><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>`).join('')}</div>
    </div>`);

  // 3 · AT A GLANCE
  const st = D.stats;
  const glance = [
    { icon:'calendar-check', v: st[0].text ?? st[0].n, label: st[0].label },
    { icon:'clock', v: st[1].n, suf: st[1].suffix, label: st[1].label },
    { icon:'users', v: st[2].n, suf: st[2].suffix, label: st[2].label },
    { icon:'layers', v: D.services.items.length, label: T.lines },
    { icon:'user-round', v: D.team.people.length, label: T.people },
    { icon:'map-pin', v: st[3].text ?? st[3].n, label: st[3].label },
  ];
  page('dark', `
    <img class="swirl" src="/assets/img/icon.png" style="width:120mm;bottom:-30mm;inset-inline-start:-40mm;opacity:.07">
    <div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.glance)}</div>
      <h2 class="h2" style="margin:5mm 0 10mm;font-size:40pt">${esc(T.glanceTitle)} <span class="it grad-text">${esc(T.glanceTitle2)}</span></h2>
      <div class="stats">${glance.map(g => `<div class="stat"><span class="ib">${ic(g.icon)}</span><div><b>${esc(g.v)}${g.suf ? `<small class="grad-text">${esc(g.suf)}</small>` : ''}</b><span>${esc(g.label)}</span></div></div>`).join('')}</div>
      <div style="margin-top:9mm"><div class="kicker" style="color:var(--mute)">${esc(T.creds)}</div>
        <div style="display:flex;gap:2.5mm;margin-top:4mm;color:var(--cyan)">${['JCPA','CFA','CPA','CMA','CIA'].map(c => `<span class="badge">${c}</span>`).join('')}</div></div>
      <div style="margin-top:7mm"><div class="kicker" style="color:var(--mute)">${esc(T.standards)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:2.5mm;margin-top:4mm">${D.hero.certs.slice(5).map(c => `<span class="chip">${ic('check')}<b style="font-weight:600">${esc(c[0])}</b>&nbsp;${esc(c[1])}</span>`).join('')}</div></div>
      <div style="margin-top:auto;height:44mm;border-radius:6mm;overflow:hidden;position:relative"><img class="img toned" src="/profile/img/sky-6-navy.jpg" style="object-position:center 55%">
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:20pt;letter-spacing:.06em;color:#fff">${esc(T.motto)}</div></div>
    </div>`);

  // 4 · VISION & MISSION
  page('sand', `
    <div class="vm-top"><img class="img toned" src="/profile/img/sky-5-navy.jpg" style="object-position:center 35%"><div class="shade"></div>
      <div style="position:absolute;top:11mm;inset-inline-start:11mm"><div class="kicker light">${esc(T.vm)}</div></div>
      <div class="vm-in"><span class="ib on-dark lg">${ic('eye')}</span><h2 class="vm-title">${esc(D.vision.title)}</h2><p class="vm-text">${esc(D.vision.text)}</p><p class="vm-tag" style="color:var(--cyan)">${esc(D.vision.tag)}</p></div></div>
    <div class="vm-bottom"><span class="ib lg">${ic('target')}</span><h2 class="vm-title">${esc(D.mission.title)}</h2><p class="vm-text" style="color:var(--ink)">${esc(D.mission.text)}</p><p class="vm-tag" style="color:var(--blue)">${esc(D.mission.tag)}</p></div>`);

  // 5 · CORE VALUES
  page('', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(D.values.kicker)}</div>
      <h2 class="h2" style="margin:5mm 0 5mm">${esc(D.values.title1)} <span class="it">${esc(D.values.title2)}</span></h2>
      <p class="txt" style="max-width:165mm;margin-bottom:9mm">${esc(D.values.sub)}</p>
      <div class="tiles" style="margin-top:auto">${D.values.cards.map((c, i) => `<div class="tile"><span class="no">${pad2(i + 1)}</span><span class="ib">${ic(valIcons[i])}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join('')}</div>
    </div>`);

  // 6 · WHY CHOOSE US
  page('dark', `
    <div class="why-img"><img class="img toned" src="/profile/img/sky-4-violet.jpg" style="object-position:${AR ? '35%' : '62%'} center">
      <div style="position:absolute;inset:0;background:linear-gradient(${AR ? '270deg' : '90deg'}, rgba(11,22,35,0) 60%, rgba(11,22,35,1))"></div></div>
    <div class="why-body" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(D.why.kicker)}</div>
      <h2 class="h2" style="margin:5mm 0 5mm">${esc(D.why.title1)} <span class="it grad-text">${esc(D.why.title2)}</span></h2>
      <p class="txt" style="margin-bottom:6mm">${esc(D.why.intro)}</p>
      <div class="kicker" style="color:var(--mute);margin-bottom:1mm">${esc(D.why.subtitle)}</div>
      <div>${D.why.items.map((w, i) => `<div class="why-row"><span class="ib">${ic(whyIcons[i])}</span><div><h3>${esc(w.title)}</h3><p>${esc(w.text)}</p></div></div>`).join('')}</div>
    </div>`);

  // 7 · SERVICES AT A GLANCE
  page('', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.services)}</div>
      <h2 class="h2" style="margin:5mm 0 5mm"><span class="it">${esc(D.services.title1)}</span><br>${esc(D.services.title2)}</h2>
      <p class="txt" style="max-width:150mm;margin-bottom:8mm">${esc(T.servicesIntro)}</p>
      <div class="svc-grid" style="margin-top:auto">${D.services.items.map((s, i) => `<div class="svc-card"><span class="no">${pad2(i + 1)}</span><span class="ib">${ic(svcIcons[i])}</span><h3>${esc(s.title)}</h3><p>${esc(s.tagline)}</p></div>`).join('')}</div>
    </div>`);

  // 8–16 · ONE PAGE PER SERVICE
  D.services.items.forEach((s, i) => {
    const dense = s.list.length > 12 ? 'dense' : '';
    page('', `
      <div class="sv-hero"><img class="img toned" src="/profile/img/${s.img}-${tones[i]}.jpg" style="object-position:${imgPos[i]}"><div class="sv-grad"></div>
        <span class="sv-no">${pad2(i + 1)}</span>
        <div class="sv-hero-text"><div class="kicker light">${esc(T.service)} ${pad2(i + 1)} / ${pad2(D.services.items.length)}</div><h2>${esc(s.title)}</h2></div></div>
      <div class="sv-badge">${ic(svcIcons[i])}</div>
      <div class="sv-body">
        <p class="tagline">${esc(s.tagline)}</p>
        <p class="txt" style="margin-top:5mm;color:var(--ink)">${esc(s.text[0])}</p>
        ${s.list.length <= 10 ? `<p class="txt" style="margin-top:3mm">${esc(s.text[1])}</p>` : ''}
        <div class="ks ${dense}"><div class="kicker">${esc(s.listTitle)}</div><ul>${s.list.map(li => `<li>${ic('circle-check-big')}<span>${esc(li)}</span></li>`).join('')}</ul></div>
      </div>`);
  });

  // 17 · LEADERSHIP
  page('sand', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.leadership)}</div>
      <h2 class="h2" style="margin:5mm 0 9mm">${esc(D.leaders.title)}</h2>
      <div style="display:flex;flex-direction:column;gap:10mm">${D.leaders.people.map(p => `
        <div class="leader"><div class="ph"><img src="/assets/img/${p.photo}.jpg"></div>
          <div><h3>${esc(p.name)}</h3><div class="role">${esc(p.role)}</div>
            ${p.certs.length ? `<div style="display:flex;gap:2mm;color:var(--blue)">${p.certs.map(c => `<span class="badge">${esc(c)}</span>`).join('')}</div>` : ''}
            <div class="deg">${ic('graduation-cap')}<span>${esc(p.degree)}</span></div>
            ${p.bio.slice(0, 2).map(b => `<p class="bio">${esc(b)}</p>`).join('')}</div></div>`).join('')}</div>
    </div>`);

  // 18 · TEAM
  const initials = (name) => name.replace(/^Mr\.\s*/, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('');
  page('dark', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.team)}</div>
      <h2 class="h2" style="margin:5mm 0 9mm;font-size:31pt">${esc(D.team.title)}</h2>
      <div class="team">${D.team.people.map((p, i) => `<div class="member"><div class="ph">${p.photo ? `<img src="/assets/img/${p.photo}.jpg">` : esc(initials(EN.team.people[i].name))}</div>
        <div><h3>${esc(p.name)}</h3><span class="role">${esc(p.role)}</span><p>${esc(p.line)}</p></div></div>`).join('')}</div>
    </div>`);

  // 19 · COMMITMENTS
  page('', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.expect)}</div>
      <h2 class="h2" style="margin:5mm 0 9mm"><span class="it">${esc(D.expect.t1)} ${esc(D.expect.t2)}</span> ${esc(D.expect.t3)}</h2>
      <div class="exp" style="margin-top:auto">${D.expect.cards.map((c, i) => `<div><span class="ib">${ic(expIcons[i])}</span><p>${esc(c.text)}</p></div>`).join('')}</div>
    </div>`);

  // 20 · CLIENTS
  const logos = EN.clients.logoFiles || [];
  page('sand', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.clients)}</div>
      <h2 class="h2" style="margin:5mm 0 9mm">${esc(D.clients.title)}</h2>
      <div class="logos">${logos.map(f => `<div><img src="/assets/img/clients/${f}"></div>`).join('')}</div>
      <div style="margin-top:auto"><div class="kicker" style="margin-bottom:4mm">${esc(T.sectors)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:2.5mm">${D.sectors.cards.map((c, i) => `<span class="chip">${ic(secIcons[i])}${esc(c.title)}</span>`).join('')}</div></div>
    </div>`);

  // 21 · CONTACT (back cover)
  page('dark', `
    <div style="position:absolute;top:0;left:0;right:0;height:122mm;overflow:hidden"><img class="img toned" src="/profile/img/sky-7-navy.jpg" style="object-position:center 40%">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(11,22,35,.1), rgba(11,22,35,1))"></div></div>
    <img class="swirl" src="/assets/img/icon.png" style="width:110mm;top:8mm;inset-inline-end:-30mm;opacity:.1">
    <div class="pad" style="display:flex;flex-direction:column">
      ${logo(false)}
      <div style="margin-top:62mm"><div class="kicker">${esc(T.contact)}</div>
        <h2 class="h2" style="margin:5mm 0 5mm;font-size:38pt">${esc(D.consult.title1)} <span class="it grad-text">${esc(D.consult.title2)}</span></h2>
        <p class="txt" style="max-width:150mm">${esc(D.consult.sub)}</p></div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:10mm;align-items:end;margin-top:auto">
        <div>
          <div class="ct-row"><span class="ib">${ic('map-pin')}</span><div><small>${esc(T.address)}</small><span>${esc(addr)}</span></div></div>
          <div class="ct-row"><span class="ib">${ic('phone')}</span><div><small>${esc(T.phone)}</small><span class="ltr">${esc(tel)}</span></div></div>
          <div class="ct-row"><span class="ib">${ic('mail')}</span><div><small>${esc(T.email)}</small><span class="ltr">${esc(mail)}</span></div></div>
          <div class="ct-row" style="border-bottom:0"><span class="ib">${ic('globe')}</span><div><small>${esc(T.website)}</small><span class="ltr">${esc(web)}</span></div></div>
        </div>
        <div class="qr"><img src="/profile/qr-website.svg"><p>${esc(T.scan)}</p></div>
      </div>
      <div class="gradbar" style="margin-top:8mm"></div>
      <div style="display:flex;justify-content:space-between;margin-top:4mm;font-size:8pt;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)"><span>${esc(T.motto)}</span><span>${esc(T.more)}</span></div>
    </div>`, { noFoot: true });

  document.getElementById('doc').innerHTML = pages.join('');
  lucide.createIcons({ attrs: { 'stroke-width': 1.6 } });
  document.title = AR ? 'الملف التعريفي – الموحدة' : 'Company Profile – Consolidated';
  window.__profileReady = true;
})();
</script>
</body>
</html>
