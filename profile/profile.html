<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Consolidated Company Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@300;400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b1623; --navy2:#11233a; --deep:#070f19; --paper:#f4f3ef; --sand:#e7e5df; --ink:#121417; --ink2:#50555d;
    --line:rgba(18,20,23,.12); --white:#f7f6f2; --mute:rgba(247,246,242,.72);
    --cyan:#27fcf2; --blue:#3064d0; --purple:#8739d5; --grad:linear-gradient(100deg,#27fcf2,#3064d0 55%,#8739d5);
    --head:'Instrument Serif',Georgia,serif; --body:'Roboto',Arial,sans-serif;
  }
  html[lang="ar"]{ --head:'Amiri','Noto Naskh Arabic',serif; --body:'IBM Plex Sans Arabic','Segoe UI',sans-serif; }
  @page{ size:210mm 297mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#2a2a2a; }
  body{ font-family:var(--body); font-weight:300; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  h1,h2,h3,h4{ font-family:var(--head); font-weight:400; margin:0; line-height:1.04; }
  p{ margin:0; }
  .it{ font-style:italic; } html[lang="ar"] .it{ font-style:normal; }
  .ac{ color:var(--blue); } .dark .ac{ color:var(--cyan); }

  .page{ position:relative; width:210mm; height:297mm; overflow:hidden; page-break-after:always; break-after:page; background:var(--paper); color:var(--ink); }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  .page.dark{ background:var(--navy); color:var(--white); }
  .page.sand{ background:var(--sand); }
  .page.ledger{ background-image:repeating-linear-gradient(180deg, transparent 0 8.2mm, rgba(18,20,23,.045) 8.2mm 8.4mm); }
  .pad{ position:absolute; inset:16mm 16mm 20mm; }
  .foot{ position:absolute; left:16mm; right:16mm; bottom:9mm; display:flex; justify-content:space-between; align-items:center; font-size:6.8pt; letter-spacing:.22em; text-transform:uppercase; color:var(--ink2); z-index:3; }
  html[lang="ar"] .foot{ letter-spacing:0; font-size:8pt; }
  .dark .foot{ color:var(--mute); }
  .foot .pn{ font-family:var(--head); font-size:12pt; letter-spacing:0; }
  .foot .bar{ flex:1; height:1px; background:currentColor; opacity:.25; margin:0 5mm; }

  .kicker{ display:inline-flex; align-items:center; gap:3mm; font-size:7.6pt; letter-spacing:.3em; text-transform:uppercase; font-weight:600; color:var(--blue); }
  html[lang="ar"] .kicker{ letter-spacing:0; font-size:9.5pt; }
  .kicker::before{ content:""; width:9mm; height:2px; background:var(--grad); flex:0 0 auto; }
  .dark .kicker, .kicker.light{ color:var(--cyan); }
  .h2{ font-size:36pt; }
  .lead{ font-size:11.6pt; line-height:1.62; }
  .txt{ font-size:9.6pt; line-height:1.62; color:var(--ink2); }
  .dark .txt{ color:var(--mute); }
  .img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .gradbar{ height:2.2px; background:var(--grad); }
  .swirl{ position:absolute; pointer-events:none; }

  .ib{ width:13mm; height:13mm; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; color:var(--blue);
       background:linear-gradient(#fff,#fff) padding-box, var(--grad) border-box; border:1.4px solid transparent; }
  .ib svg{ width:6mm; height:6mm; }
  .dark .ib, .ib.on-dark{ color:var(--cyan); background:linear-gradient(var(--navy),var(--navy)) padding-box, var(--grad) border-box; }
  .ib.solid{ background:var(--grad); color:#fff; border:0; }
  .chip{ display:inline-flex; align-items:center; gap:1.6mm; border:1px solid var(--line); border-radius:99px; padding:1.3mm 3.4mm; font-size:7.8pt; background:rgba(255,255,255,.6); }
  .chip svg{ width:3.6mm; height:3.6mm; color:var(--blue); }
  .sand .chip[style*="color:#fff"] svg{ color:var(--cyan); }
  .dark .chip{ border-color:rgba(255,255,255,.22); background:rgba(255,255,255,.05); }
  .dark .chip svg{ color:var(--cyan); }
  .badge{ display:inline-block; border:1px solid currentColor; border-radius:99px; padding:.8mm 2.8mm; font-size:7.4pt; font-weight:600; letter-spacing:.1em; }
  .ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }

  .logo{ display:flex; align-items:center; gap:3.5mm; }
  .logo .icon{ height:15mm; } .logo .word{ height:9mm; filter:invert(1) brightness(1.15); }
  .logo .ar-word{ display:none; flex-direction:column; line-height:1.1; }
  .logo .ar-word b{ font-size:16pt; font-weight:600; } .logo .ar-word small{ font-size:8pt; opacity:.8; }
  html[lang="ar"] .logo .word{ display:none; } html[lang="ar"] .logo .ar-word{ display:flex; }

  /* ---------- COVER ---------- */
  .cv-shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,15,25,.35), rgba(7,15,25,.15) 30%, rgba(7,15,25,.85) 66%, var(--deep)); }
  .cv-words{ font-family:var(--head); font-size:60pt; line-height:.98; }
  .cv-words div{ display:flex; align-items:center; gap:5mm; }
  .cv-words .tick{ width:11mm; height:11mm; border-radius:50%; background:var(--grad); display:grid; place-items:center; color:#fff; flex:0 0 auto; }
  .cv-words .tick svg{ width:6mm; height:6mm; stroke-width:2.6; }
  html:not([lang="ar"]) .cv-words div:nth-child(2) span{ font-style:italic; }

  /* ---------- CONTENTS ---------- */
  .ch-row{ display:grid; grid-template-columns:44mm 14mm 1fr; gap:5mm; align-items:center; padding:5mm 0; border-bottom:1px solid var(--line); }
  .ch-thumb{ position:relative; height:30mm; border-radius:4mm; overflow:hidden; }
  .ch-num{ font-family:var(--head); font-size:30pt; color:var(--blue); line-height:1; }
  .ch-row h3{ font-size:20pt; margin-bottom:2mm; }
  .ch-items{ display:flex; flex-wrap:wrap; gap:1mm 5mm; font-size:8.4pt; color:var(--ink2); }
  .ch-items span b{ font-weight:600; color:var(--ink); margin-inline-start:1.2mm; font-family:var(--head); font-size:10pt; }

  /* ---------- CHAPTER DIVIDER ---------- */
  .dv-shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,15,25,.2) 10%, rgba(7,15,25,.55) 45%, rgba(7,15,25,.96)); }
  .dv-no{ position:absolute; top:12mm; inset-inline-start:13mm; font-family:var(--head); font-size:230pt; line-height:.8; color:transparent; -webkit-text-stroke:1.2px rgba(255,255,255,.55); }
  .dv-body{ position:absolute; left:16mm; right:16mm; bottom:26mm; color:#fff; }
  .dv-title{ font-size:58pt; margin:5mm 0 9mm; }
  .dv-quote{ display:flex; gap:4mm; max-width:150mm; }
  .dv-quote svg{ width:8mm; height:8mm; color:var(--cyan); flex:0 0 auto; }
  .dv-quote p{ font-family:var(--head); font-size:16pt; line-height:1.35; color:rgba(255,255,255,.9); }
  html:not([lang="ar"]) .dv-quote p{ font-style:italic; }
  html[dir="rtl"] .dv-quote svg{ transform:scaleX(-1); }

  /* ---------- ABOUT ---------- */
  .band{ position:absolute; top:0; left:0; right:0; overflow:hidden; border-end-end-radius:30mm; }
  .est{ position:absolute; width:34mm; height:34mm; border-radius:50%; background:var(--navy); color:var(--white); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:0 5mm 12mm rgba(0,0,0,.25); z-index:2; }
  .est b{ font-family:var(--head); font-weight:400; font-size:26pt; line-height:1; }
  .est span{ font-size:6.5pt; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); margin-top:1.5mm; font-weight:600; }
  html[lang="ar"] .est span{ letter-spacing:0; font-size:8pt; }
  .strengths{ display:grid; grid-template-columns:repeat(3,1fr); gap:5mm; }
  .strength{ background:#fff; border-radius:5mm; padding:6mm 5mm; display:flex; flex-direction:column; gap:3mm; }
  .strength h3{ font-size:14pt; } html:not([lang="ar"]) .strength h3{ font-style:italic; }
  .strength p{ font-size:8.6pt; line-height:1.5; color:var(--ink2); }

  /* ---------- NUMBERS ---------- */
  .big-n{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid rgba(255,255,255,.14); }
  .big-n > div{ padding:7mm 5mm 7mm 0; border-bottom:1px solid rgba(255,255,255,.14); }
  html[dir="rtl"] .big-n > div{ padding:7mm 0 7mm 5mm; }
  .big-n b{ display:block; font-family:var(--head); font-weight:400; font-size:50pt; line-height:.9; }
  .big-n b small{ font-size:.5em; color:var(--cyan); }
  .big-n span{ display:block; margin-top:3mm; font-size:7.4pt; letter-spacing:.14em; text-transform:uppercase; font-weight:500; color:var(--mute); line-height:1.45; }
  html[lang="ar"] .big-n span{ letter-spacing:0; font-size:8.6pt; }
  .big-n .ib{ width:10mm; height:10mm; margin-bottom:4mm; } .big-n .ib svg{ width:4.6mm; height:4.6mm; }
  .decade{ position:relative; margin-top:6mm; }
  .decade .track{ height:3px; background:rgba(255,255,255,.14); border-radius:2px; position:relative; }
  .decade .fill{ position:absolute; inset:0; background:var(--grad); border-radius:2px; }
  .decade .yrs{ display:flex; justify-content:space-between; margin-top:2.5mm; }
  .decade .yrs span{ font-size:7pt; color:var(--mute); width:0; display:flex; justify-content:center; white-space:nowrap; }
  .decade .yrs span.k{ color:#fff; font-weight:600; font-size:8pt; }
  .decade .dots{ position:absolute; left:0; right:0; top:-1.6mm; display:flex; justify-content:space-between; }
  .decade .dots i{ width:3.4mm; height:3.4mm; border-radius:50%; background:var(--navy); border:1.2px solid var(--cyan); }
  .decade .dots i.k{ background:var(--cyan); }

  /* ---------- VISION / MISSION ---------- */
  .vm-top{ position:absolute; top:16mm; left:16mm; right:16mm; height:142mm; border-radius:7mm; overflow:hidden; color:var(--white); }
  .vm-top .shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,22,35,.25), rgba(11,22,35,.92) 70%); }
  .vm-in{ position:absolute; left:11mm; right:11mm; bottom:11mm; }
  .vm-bottom{ position:absolute; top:166mm; left:16mm; right:16mm; height:105mm; border-radius:7mm; background:#fff; padding:11mm; }
  .vm-title{ font-size:34pt; margin:5mm 0 5mm; } html:not([lang="ar"]) .vm-title{ font-style:italic; }
  .vm-text{ font-size:12.4pt; line-height:1.6; }
  .vm-tag{ margin-top:6mm; font-size:7.6pt; letter-spacing:.24em; text-transform:uppercase; font-weight:600; }
  html[lang="ar"] .vm-tag{ letter-spacing:0; font-size:9pt; }

  /* ---------- RING DIAGRAM ---------- */
  .ring{ position:relative; margin:0 auto; }
  .ring svg.rg{ position:absolute; inset:0; width:100%; height:100%; }
  .ring .core{ position:absolute; transform:translate(-50%,-50%); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .ring .node{ position:absolute; transform:translate(-50%,-50%); width:15mm; height:15mm; border-radius:50%; display:grid; place-items:center; background:var(--grad); color:#fff; box-shadow:0 2mm 6mm rgba(7,15,25,.25); }
  .ring .node svg{ width:6mm; height:6mm; stroke-width:1.7; }
  .ring .lbl{ position:absolute; transform:translate(-50%,-50%); width:38mm; text-align:center; font-family:var(--head); font-size:14.5pt; line-height:1.1; }
  html:not([lang="ar"]) .ring .lbl{ font-style:italic; }
  .ring .lbl small{ display:block; font-family:var(--body); font-style:normal; font-size:6.6pt; letter-spacing:.18em; color:var(--blue); font-weight:600; margin-bottom:1mm; }
  .dark .ring .lbl small{ color:var(--cyan); }
  .vgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:4mm 6mm; }
  .vgrid div{ border-top:1px solid var(--line); padding-top:3mm; }
  .vgrid h4{ font-size:11.5pt; margin-bottom:1.5mm; } html:not([lang="ar"]) .vgrid h4{ font-style:italic; }
  .vgrid p{ font-size:8.3pt; line-height:1.48; color:var(--ink2); }

  /* ---------- WHY ---------- */
  .why-img{ position:absolute; top:0; bottom:0; inset-inline-start:0; width:70mm; overflow:hidden; }
  .why-body{ position:absolute; top:16mm; bottom:20mm; inset-inline-start:82mm; inset-inline-end:16mm; }
  .why-row{ display:flex; gap:4.5mm; padding:4.2mm 0; border-bottom:1px solid rgba(255,255,255,.12); }
  .why-row h3{ font-size:13.5pt; margin-bottom:1.2mm; } html:not([lang="ar"]) .why-row h3{ font-style:italic; }
  .why-row p{ font-size:8.6pt; line-height:1.5; color:var(--mute); }

  /* ---------- LIFECYCLE ---------- */
  .life{ display:grid; grid-template-columns:repeat(4,1fr); gap:4mm; position:relative; }
  .life-line{ position:absolute; top:6.5mm; left:6mm; right:6mm; height:2px; background:var(--grad); }
  .stage{ position:relative; display:flex; flex-direction:column; gap:3mm; }
  .stage .step{ width:13mm; height:13mm; border-radius:50%; background:var(--navy); border:2px solid var(--cyan); display:grid; place-items:center; color:var(--cyan); z-index:1; position:relative; }
  .stage .step svg{ width:6mm; height:6mm; }
  .stage .sno{ font-size:6.8pt; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan); font-weight:600; margin-top:2mm; }
  html[lang="ar"] .stage .sno{ letter-spacing:0; font-size:8pt; }
  .stage h3{ font-size:19pt; } html:not([lang="ar"]) .stage h3{ font-style:italic; }
  .stage > p{ font-size:9pt; line-height:1.45; color:var(--mute); min-height:18mm; }
  .svc-pill{ display:flex; gap:3mm; align-items:center; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14); border-radius:3.5mm; padding:3.6mm 3.4mm; }
  .svc-pill i{ font-style:normal; font-family:var(--head); font-size:10pt; color:var(--cyan); }
  .svc-pill span{ font-size:9pt; line-height:1.28; }
  .svc-pill svg{ width:4.6mm; height:4.6mm; color:var(--cyan); flex:0 0 auto; }

  /* ---------- SERVICE A (photo top) ---------- */
  .sv-hero{ position:absolute; top:0; left:0; right:0; height:126mm; overflow:hidden; }
  .sv-grad{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(7,15,25,.15) 20%, rgba(7,15,25,.88)); }
  .sv-no{ position:absolute; top:8mm; inset-inline-end:12mm; font-family:var(--head); font-size:120pt; line-height:.8; color:transparent; -webkit-text-stroke:1.1px rgba(255,255,255,.6); }
  .sv-hero-text{ position:absolute; left:16mm; right:44mm; bottom:13mm; color:#fff; }
  html[dir="rtl"] .sv-hero-text{ left:44mm; right:16mm; }
  .sv-hero-text h2{ font-size:33pt; margin-top:4mm; }
  .sv-badge{ position:absolute; top:115.5mm; inset-inline-end:16mm; width:21mm; height:21mm; border-radius:50%; background:var(--grad); color:#fff; display:grid; place-items:center; box-shadow:0 4mm 10mm rgba(7,15,25,.3); z-index:2; }
  .sv-badge svg{ width:9.5mm; height:9.5mm; stroke-width:1.5; }
  .sv-body{ position:absolute; top:138mm; left:16mm; right:16mm; bottom:20mm; display:flex; flex-direction:column; }
  .tagline{ font-family:var(--head); font-size:16pt; line-height:1.25; color:var(--blue); }
  html:not([lang="ar"]) .tagline{ font-style:italic; }
  .count{ display:flex; align-items:baseline; gap:2mm; flex:0 0 auto; }
  .count b{ font-family:var(--head); font-weight:400; font-size:30pt; line-height:1; color:var(--blue); }
  .count span{ font-size:7pt; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--ink2); max-width:26mm; line-height:1.3; }
  html[lang="ar"] .count span{ letter-spacing:0; font-size:8pt; }
  .ks{ margin-top:7mm; background:#fff; border-radius:5mm; padding:6.5mm 7mm; }
  .ks ul{ list-style:none; margin:3.5mm 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:2.2mm 7mm; }
  .ks li{ display:flex; gap:2.2mm; font-size:8.6pt; line-height:1.35; color:var(--ink); }
  .ks li svg{ width:3.8mm; height:3.8mm; color:var(--blue); flex:0 0 auto; margin-top:.2mm; stroke-width:2.2; }
  .ks.dense li{ font-size:8.1pt; } .ks.dense ul{ gap:1.6mm 6mm; }

  /* ---------- SERVICE B (photo side strip) ---------- */
  .svb-photo{ position:absolute; top:0; bottom:0; inset-inline-end:0; width:72mm; overflow:hidden; }
  .svb-photo .sv-no{ top:auto; bottom:14mm; inset-inline-end:auto; inset-inline-start:8mm; font-size:110pt; }
  .svb-photo .icn{ position:absolute; top:16mm; inset-inline-start:10mm; width:20mm; height:20mm; border-radius:50%; background:var(--grad); display:grid; place-items:center; color:#fff; box-shadow:0 4mm 10mm rgba(0,0,0,.35); }
  .svb-photo .icn svg{ width:9mm; height:9mm; stroke-width:1.5; }
  .svb-body{ position:absolute; top:16mm; bottom:20mm; inset-inline-start:16mm; inset-inline-end:84mm; display:flex; flex-direction:column; }
  .svb-body h2{ font-size:31pt; margin:5mm 0 4mm; }
  .svb-body .ks{ padding:6mm; margin-top:auto; }
  .svb-body .ks ul{ grid-template-columns:1fr; gap:1.8mm; }
  .svb-body .ks.dense ul{ grid-template-columns:1fr 1fr; gap:1.4mm 4mm; }
  .svb-body .ks.dense li{ font-size:7.6pt; }

  /* ---------- PEOPLE ---------- */
  .leader{ display:grid; grid-template-columns:64mm 1fr; gap:9mm; align-items:start; }
  .leader .ph{ position:relative; height:84mm; border-radius:6mm; overflow:hidden; }
  .leader .ph img{ width:100%; height:100%; object-fit:cover; object-position:center 15%; }
  .leader .ph::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:2.2px; background:var(--grad); }
  .leader h3{ font-size:24pt; }
  .leader .role{ margin:2mm 0 3.5mm; font-size:7.8pt; letter-spacing:.2em; text-transform:uppercase; font-weight:600; color:var(--blue); }
  html[lang="ar"] .leader .role{ letter-spacing:0; font-size:9pt; }
  .leader .deg{ display:flex; gap:2mm; align-items:center; font-size:8.4pt; color:var(--ink2); margin:3mm 0 4mm; }
  .leader .deg svg{ width:4mm; height:4mm; color:var(--blue); }
  .leader p.bio{ font-size:9pt; line-height:1.58; color:var(--ink2); margin-bottom:2.5mm; }
  .team{ display:grid; grid-template-columns:repeat(2,1fr); gap:6mm 8mm; }
  .member{ display:flex; gap:5mm; align-items:flex-start; padding:5mm; border-radius:5mm; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); }
  .member .ph{ width:28mm; height:34mm; border-radius:4mm; overflow:hidden; flex:0 0 auto; background:var(--navy2); display:grid; place-items:center; font-family:var(--head); font-size:22pt; color:var(--cyan); }
  .member .ph img{ width:100%; height:100%; object-fit:cover; object-position:center 15%; }
  .member h3{ font-size:13.5pt; }
  .member .role{ display:block; margin:1.2mm 0 2mm; font-size:7pt; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--cyan); }
  html[lang="ar"] .member .role{ letter-spacing:0; font-size:8.4pt; }
  .member p{ font-size:8pt; line-height:1.48; color:var(--mute); }

  /* ---------- CLIENTS / COMMITMENTS ---------- */
  .logos{ display:grid; grid-template-columns:repeat(6,1fr); gap:3.2mm; }
  .logos div{ position:relative; aspect-ratio:1/1; background:#fff; border-radius:3mm; border:1px solid var(--line); overflow:hidden; }
  .logos img{ position:absolute; inset:3mm; width:calc(100% - 6mm); height:calc(100% - 6mm); object-fit:contain; }
  .exp{ display:grid; grid-template-columns:repeat(3,1fr); gap:4.5mm; }
  .exp div{ background:#fff; border-radius:5mm; padding:6mm 5mm; min-height:60mm; display:flex; flex-direction:column; gap:4mm; position:relative; }
  .exp div .no{ position:absolute; top:5mm; inset-inline-end:5mm; font-family:var(--head); font-size:11pt; color:rgba(18,20,23,.3); }
  .exp p{ font-family:var(--head); font-size:12pt; line-height:1.3; }
  html:not([lang="ar"]) .exp p{ font-style:italic; }

  /* ---------- CONTACT ---------- */
  .ct-row{ display:flex; gap:4.5mm; align-items:center; padding:4.2mm 0; border-bottom:1px solid rgba(255,255,255,.14); }
  .ct-row small{ display:block; font-size:6.8pt; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); font-weight:600; margin-bottom:1mm; }
  html[lang="ar"] .ct-row small{ letter-spacing:0; font-size:8pt; }
  .ct-row span{ font-size:11pt; }
  .qr{ background:#fff; border-radius:5mm; padding:4mm; width:44mm; text-align:center; color:var(--ink); }
  .qr img{ width:36mm; height:36mm; display:block; margin:0 auto 2.5mm; }
  .qr p{ font-size:7.2pt; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  html[lang="ar"] .qr p{ letter-spacing:0; font-size:8.4pt; }
</style>
</head>
<body>
<div id="doc"></div>
<script src="/assets/js/i18n.js"></script>
<script src="/profile/vendor/lucide.min.js"></script>
<script>
(function(){

        <div class="sv-badge">${ic(svcIcons[i])}</div>
        <div class="sv-body">
          <div style="display:flex;justify-content:space-between;gap:8mm;align-items:flex-start;padding-inline-end:26mm"><p class="tagline">${esc(s.tagline)}</p></div>
          <p class="txt" style="margin-top:5mm;color:var(--ink)">${esc(s.text[0])}</p>
          ${s.list.length <= 10 ? `<p class="txt" style="margin-top:3mm">${esc(s.text[1])}</p>` : ''}
          <div style="margin-top:6mm">${count}</div>
          ${list}
        </div>`);
    } else {
      page('sand', `
        <div class="svb-photo">${photo(s.img.replace('sky-', ''), tones[i], imgPos[i])}
          <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(7,15,25,.25), rgba(7,15,25,.7))"></div>
          <div class="icn">${ic(svcIcons[i])}</div><span class="sv-no">${pad2(i + 1)}</span></div>
        <div class="svb-body">
          <div class="kicker">${esc(T.service)} ${pad2(i + 1)} / ${pad2(D.services.items.length)}</div>
          <h2>${esc(s.title)}</h2>
          <p class="tagline">${esc(s.tagline)}</p>
          <p class="txt" style="margin-top:5mm;color:var(--ink)">${esc(s.text[0])}</p>
          <p class="txt" style="margin-top:3mm">${esc(s.text[1])}</p>
          <div style="margin-top:6mm">${count}</div>
          ${list}
        </div>`);
    }
  });

  // =============== CHAPTER 03 ===============
  mark('c3'); divider(3, T.ch[2], D.team.title, 5, 'navy', 'center 40%');

  mark('lead');
  page('sand', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.leadership)}</div>
      <h2 class="h2" style="margin:5mm 0 9mm">${esc(D.leaders.title)}</h2>
      <div style="display:flex;flex-direction:column;gap:10mm">${D.leaders.people.map(p => `
        <div class="leader"><div class="ph"><img src="/assets/img/${p.photo}.jpg"></div>
          <div><h3>${esc(p.name)}</h3><div class="role">${esc(p.role)}</div>
            ${p.certs.length ? `<div style="display:flex;gap:2mm;color:var(--blue)">${p.certs.map(c => `<span class="badge">${esc(c)}</span>`).join('')}</div>` : ''}
            <div class="deg">${ic('graduation-cap')}<span>${esc(p.degree)}</span></div>
            ${p.bio.slice(0, 2).map(b => `<p class="bio">${esc(b)}</p>`).join('')}</div></div>`).join('')}</div>
    </div>`);

  mark('team');
  const initials = (name) => name.replace(/^Mr\.\s*/, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('');
  page('dark', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.team)}</div>
      <h2 class="h2" style="margin:5mm 0 9mm;font-size:31pt">${esc(D.team.title)}</h2>
      <div class="team">${D.team.people.map((p, i) => `<div class="member"><div class="ph">${p.photo ? `<img src="/assets/img/${p.photo}.jpg">` : esc(initials(EN.team.people[i].name))}</div>
        <div><h3>${esc(p.name)}</h3><span class="role">${esc(p.role)}</span><p>${esc(p.line)}</p></div></div>`).join('')}</div>
    </div>`);

  // =============== CHAPTER 04 ===============
  mark('c4'); divider(4, T.ch[3], D.expect.cards[1].text, 6, 'teal', 'center 45%');

  mark('sectors');
  page('dark', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.sectors)}</div>
      <h2 class="h2" style="margin:5mm 0 8mm">${esc(T.ch[3])}</h2>
      ${ring(D.sectors.cards.map((c, i) => ({ title: c.title, icon: secIcons[i] })), { id: 's', w: 178, h: 178, rNode: 52, rLabel: 76, core: 52,
          coreStyle: 'background:linear-gradient(var(--navy2),var(--navy2)) padding-box, var(--grad) border-box;border:1.6px solid transparent;',
          coreHtml: `<b style="font-family:var(--head);font-weight:400;font-size:38pt;line-height:1;color:#fff">${esc(st[2].n)}<span style="color:var(--cyan);font-size:.55em">${esc(st[2].suffix)}</span></b><span style="font-size:7pt;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin-top:2mm">${esc(T.clientsCore)}</span>` })}
      <div style="margin-top:auto;display:flex;gap:4mm;align-items:center"><span class="ib">${ic('quote')}</span><p style="font-family:var(--head);font-size:14pt;line-height:1.35" class="${AR ? '' : 'it'}">${esc(D.expect.cards[4].text)}</p></div>
    </div>`);

  mark('logos');
  const logos = EN.clients.logoFiles || [];
  page('sand', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.clients)}</div>
      <h2 class="h2" style="margin:5mm 0 9mm">${esc(D.clients.title)}</h2>
      <div class="logos">${logos.map(f => `<div><img src="/assets/img/clients/${f}"></div>`).join('')}</div>
      <div style="margin-top:auto;background:var(--navy);color:#fff;border-radius:6mm;padding:7mm 8mm;display:flex;gap:8mm;align-items:center">
        <b style="font-family:var(--head);font-weight:400;font-size:44pt;line-height:.9;flex:0 0 auto">${esc(st[2].n)}<span style="color:var(--cyan);font-size:.5em">${esc(st[2].suffix)}</span></b>
        <div><div class="kicker light" style="margin-bottom:3mm">${esc(T.sectors)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:2mm">${D.sectors.cards.map((c, i) => `<span class="chip" style="border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#fff">${ic(secIcons[i])}${esc(c.title)}</span>`).join('')}</div></div>
      </div>
    </div>`);

  mark('expect');
  page('ledger', `<div class="pad" style="display:flex;flex-direction:column">
      <div class="kicker">${esc(T.expect)}</div>
      <h2 class="h2" style="margin:5mm 0 9mm"><span class="it ac">${esc(D.expect.t1)} ${esc(D.expect.t2)}</span> ${esc(D.expect.t3)}</h2>
      <div class="exp" style="margin-top:auto">${D.expect.cards.map((c, i) => `<div><span class="no">${pad2(i + 1)}</span><span class="ib">${ic(expIcons[i])}</span><p>${esc(c.text)}</p></div>`).join('')}</div>
    </div>`);

  // =============== BACK COVER ===============
  mark('contact');
  page('dark', `
    <div style="position:absolute;top:0;left:0;right:0;height:122mm;overflow:hidden">${photo(7, 'navy', 'center 40%')}
      <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(11,22,35,.1), rgba(11,22,35,1))"></div></div>
    <img class="swirl" src="/assets/img/icon.png" style="width:110mm;top:8mm;inset-inline-end:-30mm;opacity:.1">
    <div class="pad" style="display:flex;flex-direction:column">
      ${logo}
      <div style="margin-top:62mm"><div class="kicker">${esc(T.contact)}</div>
        <h2 class="h2" style="margin:5mm 0 5mm;font-size:38pt">${esc(D.consult.title1)} <span class="it ac">${esc(D.consult.title2)}</span></h2>
        <p class="txt" style="max-width:150mm">${esc(D.consult.sub)}</p></div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:10mm;align-items:end;margin-top:auto">
        <div>
          <div class="ct-row"><span class="ib">${ic('map-pin')}</span><div><small>${esc(T.address)}</small><span>${esc(addr)}</span></div></div>
          <div class="ct-row"><span class="ib">${ic('phone')}</span><div><small>${esc(T.phone)}</small><span class="ltr">${esc(tel)}</span></div></div>
          <div class="ct-row"><span class="ib">${ic('mail')}</span><div><small>${esc(T.email)}</small><span class="ltr">${esc(mail)}</span></div></div>
          <div class="ct-row" style="border-bottom:0"><span class="ib">${ic('globe')}</span><div><small>${esc(T.website)}</small><span class="ltr">${esc(web)}</span></div></div>
        </div>
        <div class="qr"><img src="/profile/qr-website.svg"><p>${esc(T.scan)}</p></div>
      </div>
      <div class="gradbar" style="margin-top:8mm"></div>
      <div style="display:flex;justify-content:space-between;margin-top:4mm;font-size:8pt;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)"><span>${esc(T.mottoLine)}</span><span>${esc(T.more)}</span></div>
    </div>`, { noFoot: true });

  // fill page references on the contents page
  let html = pages.join('');
  html = html.replace(/%%(\w+)%%/g, (_, k) => pad2(anchor[k] || 0));
  document.getElementById('doc').innerHTML = html;
  lucide.createIcons({ attrs: { 'stroke-width': 1.6 } });
  document.title = AR ? 'الملف التعريفي – الموحدة' : 'Company Profile – Consolidated';
  window.__profileReady = true;
})();
</script>
</body>
</html>
