<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>Consolidated Company Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@300;400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0c1826; --navy2:#102235; --navy3:#152c44; --ink:#141414; --gray:#e6e6e4; --gray2:#d9d9d6;
    --white:#f4f3ef; --muted:rgba(244,243,239,.72); --inkmuted:rgba(20,20,20,.68); --cyan:#27fcf2; --blue:#3064d0; --purple:#8739d5;
    --head:'Instrument Serif',Georgia,serif; --body:'Roboto',Arial,sans-serif;
  }
  html[lang="ar"]{ --head:'Amiri','Noto Naskh Arabic',serif; --body:'IBM Plex Sans Arabic','Segoe UI',sans-serif; }
  @page{ size:297mm 210mm; margin:0; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#222; }
  body{ font-family:var(--body); font-weight:300; color:var(--white); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  h1,h2,h3,h4{ font-family:var(--head); font-weight:400; margin:0; line-height:1.08; }
  p{ margin:0; }
  .it{ font-style:italic; } html[lang="ar"] .it{ font-style:normal; }
  .page{ position:relative; width:297mm; height:210mm; overflow:hidden; page-break-after:always; break-after:page; background:var(--navy); color:var(--white); padding:16mm 18mm 14mm; }
  .page.gray{ background:var(--gray); color:var(--ink); }
  .page.dark2{ background:var(--navy2); }
  .page.black{ background:var(--ink); }
  .page:last-child{ page-break-after:auto; break-after:auto; }
  /* chrome */
  .chrome{ position:absolute; left:18mm; right:18mm; bottom:9mm; display:flex; justify-content:space-between; align-items:center; font-size:7.5pt; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  html[lang="ar"] .chrome{ letter-spacing:0; font-size:8.5pt; }
  .page.gray .chrome{ color:var(--inkmuted); }
  .chrome b{ font-weight:500; }
  .chrome .num{ font-family:var(--head); font-size:11pt; letter-spacing:.05em; }
  .gradline{ position:absolute; left:0; right:0; top:0; height:2.2mm; background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple)); }
  .kicker{ font-size:8pt; letter-spacing:.3em; text-transform:uppercase; color:var(--cyan); font-weight:500; margin-bottom:5mm; }
  html[lang="ar"] .kicker{ letter-spacing:0; font-size:9.5pt; }
  .page.gray .kicker{ color:#1f4062; }
  .h-xl{ font-size:44pt; } .h-l{ font-size:32pt; } .h-m{ font-size:22pt; } .h-s{ font-size:15pt; }
  .lead{ font-size:12pt; line-height:1.55; }
  .body{ font-size:9.6pt; line-height:1.55; color:var(--muted); }
  .page.gray .body{ color:var(--inkmuted); }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:14mm; }
  .cols-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6mm; }
  .cols-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:6mm; }
  .card{ border:1px solid rgba(255,255,255,.16); border-radius:4mm; padding:6mm 6mm; background:rgba(255,255,255,.03); }
  .page.gray .card{ border-color:rgba(20,20,20,.14); background:rgba(255,255,255,.55); }
  .card .n{ font-family:var(--head); color:var(--cyan); font-size:10pt; letter-spacing:.12em; display:block; margin-bottom:2mm; }
  .page.gray .card .n{ color:#1f4062; }
  .card h3{ font-size:14.5pt; margin-bottom:2.2mm; } html:not([lang="ar"]) .card h3{ font-style:italic; }
  .card p{ font-size:9pt; line-height:1.5; color:var(--muted); }
  .page.gray .card p{ color:var(--inkmuted); }
  .photo{ position:absolute; inset:0; object-fit:cover; width:100%; height:100%; }
  .shade{ position:absolute; inset:0; background:linear-gradient(90deg, rgba(12,24,38,.96) 35%, rgba(12,24,38,.55) 70%, rgba(12,24,38,.2)); }
  .rel{ position:relative; z-index:1; }
  .logo{ display:flex; align-items:center; gap:4mm; }
  .logo img.icon{ height:14mm; } .logo img.word{ height:8.5mm; filter:invert(1) brightness(1.1); }
  .page.gray .logo img.word{ filter:none; }
  .logo .ar-word{ display:none; flex-direction:column; line-height:1.05; }
  .logo .ar-word b{ font-size:15pt; font-weight:600; } .logo .ar-word small{ font-size:7.5pt; opacity:.8; }
  html[lang="ar"] .logo img.word{ display:none; } html[lang="ar"] .logo .ar-word{ display:flex; }
  .motto{ font-family:var(--head); letter-spacing:.14em; font-size:11pt; color:var(--muted); }
  html[lang="ar"] .motto{ letter-spacing:0; }
  /* stats */
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6mm; }
  .stat b{ display:block; font-family:var(--head); font-size:30pt; line-height:1; font-weight:400; }
  .stat b small{ font-size:.5em; color:var(--cyan); } .page.gray .stat b small{ color:#1f4062; }
  .stat span{ display:block; margin-top:2mm; font-size:7.5pt; letter-spacing:.12em; text-transform:uppercase; font-weight:500; }
  html[lang="ar"] .stat span{ letter-spacing:0; font-size:8.5pt; }
  /* toc */
  .toc{ display:grid; grid-template-columns:1fr 1fr; gap:3mm 14mm; counter-reset:toc; }
  .toc div{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid rgba(255,255,255,.12); padding:2.4mm 0; font-size:10.5pt; }
  .toc div i{ font-style:normal; font-family:var(--head); color:var(--cyan); font-size:9pt; letter-spacing:.12em; margin-inline-end:4mm; }
  .toc div span{ flex:1; } .toc div em{ font-style:normal; font-family:var(--head); font-size:11pt; }
  /* services overview */
  .svc-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:5mm; }
  .svc-grid .card{ min-height:34mm; }
  /* service detail */
  .svc{ display:grid; grid-template-columns:1fr 1.15fr; gap:14mm; height:100%; }
  .svc .body{ font-size:10.4pt; line-height:1.6; }
  .svc .tag{ font-family:var(--head); font-size:15pt; color:var(--muted); margin:3mm 0 7mm; } html:not([lang="ar"]) .svc .tag{ font-style:italic; }
  .svc h4{ font-family:var(--body); font-size:7.8pt; letter-spacing:.22em; text-transform:uppercase; color:var(--cyan); margin:6mm 0 3mm; font-weight:600; }
  html[lang="ar"] .svc h4{ letter-spacing:0; font-size:9pt; }
  .svc ol{ margin:0; padding:0; list-style:none; counter-reset:s; display:grid; grid-template-columns:1fr 1fr; gap:2.4mm 7mm; }
  .svc ol li{ counter-increment:s; position:relative; padding-inline-start:8mm; font-size:9.6pt; line-height:1.4; color:var(--white); }
  .svc ol li::before{ content:counter(s,decimal-leading-zero); position:absolute; inset-inline-start:0; top:.1em; font-size:7.5pt; font-weight:600; color:var(--cyan); letter-spacing:.05em; }
  .svc .num{ font-family:var(--head); font-size:64pt; line-height:.8; color:rgba(255,255,255,.12); display:block; margin-bottom:4mm; }
  .svc .why{ border-top:1px solid rgba(255,255,255,.14); margin-top:6mm; padding-top:1mm; }
  /* people */
  .leader{ display:grid; grid-template-columns:52mm 1fr; gap:8mm; align-items:start; }
  .leader img{ width:52mm; height:62mm; object-fit:cover; object-position:center 18%; border-radius:4mm; filter:grayscale(1); }
  .leader h3{ font-size:19pt; } .leader .role{ font-size:7.5pt; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan); margin:1.5mm 0 3mm; font-weight:600; }
  html[lang="ar"] .leader .role{ letter-spacing:0; font-size:8.5pt; }
  .leader p{ font-size:8.6pt; line-height:1.5; color:var(--muted); margin-bottom:2mm; }
  .chips{ display:flex; gap:1.5mm; flex-wrap:wrap; margin:2mm 0 3mm; }
  .chips span{ border:1px solid rgba(255,255,255,.5); border-radius:99px; padding:.6mm 2.4mm; font-size:7pt; font-weight:500; letter-spacing:.08em; }
  .team{ display:grid; grid-template-columns:repeat(4,1fr); gap:9mm 8mm; }
  .team .m{ display:flex; flex-direction:column; gap:3mm; align-items:flex-start; }
  .team .m .av{ width:30mm; height:30mm; border-radius:50%; overflow:hidden; flex:0 0 auto; background:#1f4062; display:grid; place-items:center; font-family:var(--head); font-size:18pt; }
  .team .m .av img{ width:100%; height:100%; object-fit:cover; object-position:center 15%; }
  .team .m h3{ font-size:14pt; } .team .m span{ display:block; font-size:7.5pt; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); margin-top:1mm; font-weight:600; }
  html[lang="ar"] .team .m span{ letter-spacing:0; font-size:8.5pt; }
  .team .m p{ font-size:8.8pt; line-height:1.45; color:var(--muted); margin-top:1.5mm; }
  /* logos */
  .logos{ display:grid; grid-template-columns:repeat(9,1fr); gap:3.5mm; }
  .logos div{ background:#fff; border-radius:2.5mm; aspect-ratio:4/3; position:relative; overflow:hidden; }
  .logos img{ position:absolute; inset:2.2mm; width:calc(100% - 4.4mm); height:calc(100% - 4.4mm); object-fit:contain; }
  /* expect */
  .expect{ display:grid; grid-template-columns:repeat(3,1fr); gap:5mm; }
  .expect .card{ display:flex; flex-direction:column; justify-content:flex-end; min-height:40mm; background:rgba(255,255,255,.04); }
  .expect .card p{ font-family:var(--head); font-size:12.5pt; line-height:1.25; color:var(--white); } html:not([lang="ar"]) .expect .card p{ font-style:italic; }
  /* contact */
  .contact{ display:grid; grid-template-columns:1fr 1fr; gap:6mm 14mm; }
  .contact div small{ display:block; font-size:7pt; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan); font-weight:600; margin-bottom:1.5mm; }
  html[lang="ar"] .contact div small{ letter-spacing:0; font-size:8pt; }
  .contact div span{ font-size:11pt; }
  .ltr{ direction:ltr; unicode-bidi:isolate; display:inline-block; }
  html[dir="rtl"] .shade{ background:linear-gradient(270deg, rgba(12,24,38,.96) 35%, rgba(12,24,38,.55) 70%, rgba(12,24,38,.2)); }
</style>
</head>
<body>
<div id="doc"></div>
<script src="/assets/js/i18n.js"></script>
<script>
(function(){
  const q = new URLSearchParams(location.search); const lang = q.get('lang') === 'ar' ? 'ar' : 'en';
  const D = I18N[lang], EN = I18N.en;
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const T = lang === 'ar' ? {
    profile:'الملف التعريفي', contents:'المحتويات', year:'2026', motto:'نزاهة • شفافية • جودة', since:'منذ 2015 · عمّان، الأردن',
    about:'من نحن', vm:'الرؤية والمهمة', values:'قيمنا الأساسية', why:'لماذا تختارنا', services:'خدماتنا', leadership:'قيادتنا', team:'فريقنا', expect:'ما يمكنك توقعه', clients:'عملاؤنا', contact:'تواصل معنا',
    servicesIntro:'تسع ممارسات متكاملة تغطي التدقيق والتأكيد والمحاسبة والضرائب والمخاطر والاستشارات المالية والمؤسسية والإسناد الخارجي والتدريب والتحول الرقمي.',
    clientsIntro:'شركات ومؤسسات تثق بالموحدة في أعمال التدقيق والضرائب والاستشارات.', sectors:'القطاعات التي نخدمها', expectIntro:'التزاماتنا تجاه كل عميل.',
    name:'الموحدة لتدقيق الحسابات والاستشارات المالية', company:'Consolidated for Auditing and Financial Consulting', website:'الموقع الإلكتروني', phone:'الهاتف', email:'البريد الإلكتروني', address:'العنوان', thanks:'شكراً لاهتمامكم'
  } : {
    profile:'Company Profile', contents:'Contents', year:'2026', motto:'Integrity • Transparency • Quality', since:'Since 2015 · Amman, Jordan',
    about:'About Us', vm:'Vision & Mission', values:'Our Core Values', why:'Why Choose Us', services:'Our Services', leadership:'Our Leadership', team:'Our Team', expect:'What You Can Expect', clients:'Our Clients', contact:'Contact Us',
    servicesIntro:'Nine integrated practices covering audit and assurance, accounting, tax, risk, financial and corporate advisory, outsourcing, training and digital transformation.',
    clientsIntro:'Companies and organisations that trust Consolidated with their audit, tax and advisory work.', sectors:'Sectors we serve', expectIntro:'Our commitments to every client.',
    name:'Consolidated for Auditing and Financial Consulting', company:'Consolidated for Auditing and Financial Consulting', website:'Website', phone:'Phone', email:'Email', address:'Address', thanks:'Thank you for your interest'
  };
  const logo = `<div class="logo"><img class="icon" src="/assets/img/icon.png"><img class="word" src="/assets/img/wordmark.png"><div class="ar-word"><b>الموحدة</b><small>لتدقيق الحسابات والاستشارات المالية</small></div></div>`;
  let pageNo = 0; const pages = [];
  const chrome = (section) => { pageNo++; return `<div class="chrome"><span><b>${esc(T.company)}</b> &nbsp;·&nbsp; ${esc(section)}</span><span class="num">${String(pageNo).padStart(2,'0')}</span></div>`; };
  const page = (cls, inner, section, opts = {}) => { const c = chrome(section); pages.push(`<section class="page ${cls}">${opts.noLine ? '' : '<div class="gradline"></div>'}${inner}${opts.noChrome ? '' : c}</section>`); };

  // 1. Cover
  pageNo = 0;
  pages.push(`<section class="page black"><img class="photo" src="/assets/img/sky-1.jpg" style="opacity:.55;object-position:center 30%"><div class="shade"></div>
    <div class="rel" style="height:100%;display:flex;flex-direction:column;justify-content:space-between">
      ${logo}
      <div><div class="kicker">${esc(T.profile)} · ${esc(T.year)}</div>
        <h1 class="h-xl" style="max-width:150mm">${esc(T.name)}</h1>
        <p class="lead" style="max-width:120mm;margin-top:6mm;color:var(--muted)">${esc(D.hero.sub)}</p></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end"><span class="motto">${esc(T.motto)}</span><span style="font-size:8pt;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)">${esc(T.since)}</span></div>
    </div></section>`);
  pageNo = 1;

  // 2. Contents
  const tocItems = [[T.about,3],[T.vm,4],[T.values,5],[T.why,6],[T.services,7],[T.leadership,17],[T.team,18],[T.expect,19],[T.clients,20],[T.contact,21]];
  page('', `<div style="display:grid;grid-template-columns:1.25fr 1fr;gap:16mm;height:100%">
    <div><div class="kicker">${esc(T.contents)}</div><h2 class="h-l" style="margin-bottom:10mm">${esc(T.profile)}</h2>
    <div class="toc" style="grid-template-columns:1fr">${tocItems.map((t,i)=>`<div><i>${String(i+1).padStart(2,'0')}</i><span>${esc(t[0])}</span><em>${String(t[1]).padStart(2,'0')}</em></div>`).join('')}</div></div>
    <div style="position:relative;border-radius:5mm;overflow:hidden;margin-bottom:8mm"><img src="/assets/img/sky-4.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1)"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,24,38,.1),rgba(12,24,38,.92))"></div>
      <div style="position:absolute;left:8mm;right:8mm;bottom:8mm"><p class="body" style="color:var(--white);font-size:10pt">${esc(D.hero.sub)}</p><p class="motto" style="margin-top:5mm">${esc(T.motto)}</p></div></div>
    </div>`, T.contents);

  // 3. About
  const st = D.stats;
  page('gray', `<div class="two"><div><div class="kicker">${esc(T.about)}</div><h2 class="h-l">${esc(D.about ? D.about.title : T.about)}</h2>
      <p class="body" style="margin-top:6mm;font-size:10pt">${esc(D.intro.p1)}</p></div>
    <div><div style="display:grid;gap:4mm;margin-top:14mm">${D.intro.points.map(p=>`<div class="card"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>`).join('')}</div></div></div>
    <div class="stats" style="margin-top:10mm;padding-top:6mm;border-top:1px solid rgba(20,20,20,.14)">${st.map(s=>`<div class="stat"><b>${esc(s.text ?? s.n)}${s.suffix?`<small>${esc(s.suffix)}</small>`:''}</b><span>${esc(s.label)}</span></div>`).join('')}</div>`, T.about);

  // 4. Vision & Mission
  page('', `<img class="photo" src="/assets/img/sky-3.jpg" style="opacity:.22;object-position:center 40%"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,24,38,.2),rgba(12,24,38,.95) 70%)"></div>
    <div class="rel"><div class="kicker">${esc(T.vm)}</div>
    <div class="two" style="margin-top:22mm;gap:10mm">
      <div class="card" style="padding:12mm;background:rgba(12,24,38,.85);min-height:118mm"><span class="n">01</span><h3 class="h-m it" style="font-size:30pt">${esc(D.vision.title)}</h3><p class="lead" style="margin-top:6mm;font-size:13pt;color:var(--white)">${esc(D.vision.text)}</p><p style="margin-top:8mm;font-size:8pt;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)">${esc(D.vision.tag)}</p></div>
      <div class="card" style="padding:12mm;background:rgba(12,24,38,.85);min-height:118mm"><span class="n">02</span><h3 class="h-m it" style="font-size:30pt">${esc(D.mission.title)}</h3><p class="lead" style="margin-top:6mm;font-size:13pt;color:var(--white)">${esc(D.mission.text)}</p><p style="margin-top:8mm;font-size:8pt;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)">${esc(D.mission.tag)}</p></div>
    </div></div>`, T.vm);

  // 5. Core values
  page('gray', `<div class="kicker">${esc(D.values.kicker)}</div><h2 class="h-l">${esc(D.values.title1)} <span class="it">${esc(D.values.title2)}</span></h2>
    <p class="body" style="max-width:170mm;margin:4mm 0 8mm">${esc(D.values.sub)}</p>
    <div class="cols-3">${D.values.cards.map((c,i)=>`<div class="card"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join('')}</div>`, T.values);

  // 6. Why choose us
  page('', `<div class="kicker">${esc(D.why.kicker)}</div><div class="two" style="align-items:end"><h2 class="h-l">${esc(D.why.title1)} <span class="it">${esc(D.why.title2)}</span></h2><p class="body">${esc(D.why.intro)}</p></div>
    <div class="kicker" style="margin:8mm 0 4mm;color:var(--muted)">${esc(D.why.subtitle)}</div>
    <div class="cols-3">${D.why.items.map((c,i)=>`<div class="card"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join('')}</div>`, T.why);

  // 7. Services overview
  page('gray', `<div class="kicker">${esc(T.services)}</div><div class="two" style="align-items:end"><h2 class="h-l"><span class="it">${esc(D.services.title1)}</span><br>${esc(D.services.title2)}</h2><p class="body">${esc(T.servicesIntro)}</p></div>
    <div class="svc-grid" style="margin-top:8mm">${D.services.items.map((s,i)=>`<div class="card"><span class="n">${String(i+1).padStart(2,'0')}</span><h3 style="font-size:13.5pt">${esc(s.title)}</h3><p>${esc(s.tagline)}</p></div>`).join('')}</div>`, T.services);

  // 8-16. Service detail pages
  D.services.items.forEach((s,i)=>{
    page(i%2 ? 'dark2' : '', `<div class="svc">
      <div><span class="num">${String(i+1).padStart(2,'0')}</span><div class="kicker">${esc(T.services)}</div><h2 class="h-l" style="font-size:28pt">${esc(s.title)}</h2><p class="tag">${esc(s.tagline)}</p>
        <h4>${esc(D.services.overviewTitle)}</h4>${s.text.map(p=>`<p class="body" style="margin-bottom:3mm">${esc(p)}</p>`).join('')}</div>
      <div><h4 style="margin-top:16mm">${esc(s.listTitle)}</h4><ol>${s.list.map(li=>`<li>${esc(li)}</li>`).join('')}</ol>
        <div class="why"><h4>${esc(D.services.whyTitle)}</h4>${s.why.map(p=>`<p class="body" style="margin-bottom:3mm">${esc(p)}</p>`).join('')}</div></div>
    </div>`, s.title);
  });

  // 17. Leadership
  page('gray', `<div class="kicker">${esc(T.leadership)}</div><h2 class="h-l" style="margin-bottom:8mm">${esc(D.leaders.title)}</h2>
    <div class="two">${D.leaders.people.map(p=>`<div class="leader"><img src="/assets/img/${p.photo}.jpg"><div><h3>${esc(p.name)}</h3><div class="role" style="color:#1f4062">${esc(p.role)}</div>${p.certs.length?`<div class="chips">${p.certs.map(c=>`<span style="border-color:rgba(20,20,20,.5)">${esc(c)}</span>`).join('')}</div>`:''}<p style="color:var(--inkmuted);font-size:8pt;margin-bottom:3mm">${esc(p.degree)}</p>${p.bio.map(b=>`<p style="color:var(--inkmuted)">${esc(b)}</p>`).join('')}</div></div>`).join('')}</div>`, T.leadership);

  // 18. Team
  const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('');
  page('', `<div class="kicker">${esc(T.team)}</div><h2 class="h-l" style="margin-bottom:10mm;max-width:200mm">${esc(D.team.title)}</h2>
    <div class="team">${D.team.people.map(p=>`<div class="m"><div class="av">${p.photo?`<img src="/assets/img/${p.photo}.jpg">`:esc(initials(EN.team.people.find(x=>x.photo===p.photo && x.role===p.role)?.name || p.name))}</div><div><h3>${esc(p.name)}</h3><span>${esc(p.role)}</span><p>${esc(p.line)}</p></div></div>`).join('')}</div>`, T.team);

  // 19. Expect
  page('dark2', `<div class="kicker">${esc(T.expect)}</div><h2 class="h-l" style="margin-bottom:8mm"><span class="it">${esc(D.expect.t1)} ${esc(D.expect.t2)}</span> ${esc(D.expect.t3)}</h2>
    <div class="expect">${D.expect.cards.map((c,i)=>`<div class="card"><span class="n">${String(i+1).padStart(2,'0')}</span><p>${esc(c.text)}</p></div>`).join('')}</div>`, T.expect);

  // 20. Clients
  const logos = EN.clients.logoFiles || [];
  page('gray', `<div class="kicker">${esc(T.clients)}</div><div class="two" style="align-items:end;margin-bottom:6mm"><h2 class="h-l">${esc(D.clients.title)}</h2><p class="body">${esc(T.clientsIntro)}</p></div>
    <div class="logos">${logos.map(f=>`<div><img src="/assets/img/clients/${f}"></div>`).join('')}</div>
    <div class="kicker" style="margin:7mm 0 2.5mm;color:#1f4062">${esc(T.sectors)}</div>
    <div style="display:flex;flex-wrap:wrap;gap:2mm">${D.sectors.cards.map(c=>`<span style="border:1px solid rgba(20,20,20,.3);border-radius:99px;padding:1.2mm 3.5mm;font-size:8pt">${esc(c.title)}</span>`).join('')}</div>`, T.clients);

  // 21. Contact / back cover
  const contact = D.footer.cols.find(c => c.links.some(l => String(l[1]||'').startsWith('tel:'))) || D.footer.cols[2];
  const addr = contact.links[0][0]; const tel = contact.links.find(l=>String(l[1]||'').startsWith('tel:')); const mail = contact.links.find(l=>String(l[1]||'').startsWith('mailto:')); const web = contact.links.find(l=>String(l[1]||'').startsWith('https://www.caudit'));
  pages.push(`<section class="page black"><img class="photo" src="/assets/img/sky-6.jpg" style="opacity:.45"><div class="shade"></div>
    <div class="rel" style="height:100%;display:flex;flex-direction:column;justify-content:space-between">
      ${logo}
      <div><div class="kicker">${esc(T.contact)}</div><h2 class="h-xl" style="font-size:38pt;max-width:160mm">${esc(D.consult.title1)} <span class="it">${esc(D.consult.title2)}</span></h2>
        <p class="body" style="max-width:130mm;margin:5mm 0 10mm;font-size:10.5pt">${esc(D.consult.sub)}</p>
        <div class="contact" style="max-width:170mm">
          <div><small>${esc(T.address)}</small><span>${esc(addr)}</span></div>
          <div><small>${esc(T.phone)}</small><span class="ltr">${esc(tel ? tel[0] : '')}</span></div>
          <div><small>${esc(T.email)}</small><span class="ltr">${esc(mail ? mail[0] : '')}</span></div>
          <div><small>${esc(T.website)}</small><span class="ltr">${esc(web ? web[0] : 'www.caudit.net')}</span></div>
        </div></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end"><span class="motto">${esc(T.motto)}</span><span style="font-size:8pt;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)">${esc(T.thanks)}</span></div>
    </div></section>`);

  document.getElementById('doc').innerHTML = pages.join('');
  document.title = (lang === 'ar' ? 'الملف التعريفي – الموحدة' : 'Company Profile – Consolidated');
})();
</script>
</body>
</html>
